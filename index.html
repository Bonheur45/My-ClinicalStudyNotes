# APPROACH TO HEADACHE

Comprehensive clinical study notes | Based on the complete PowerPoint presentation

These notes follow the original presentation in sequence. I have retained its important content and expanded the medical explanations to help you understand the underlying mechanisms, make clinical decisions and answer questions during your presentation.

I will use two distinctions throughout:

- **Presentation content:** What the original slides teach.
- **Clinical explanation and clarification:** Additional explanations, important qualifications and clinical context to help you understand and apply the material.

The notes cover the full presentation, including the clinical cases, investigations, lumbar puncture, treatment and follow-up.

# PART I. UNDERSTANDING HEADACHE

## 1. Introduction: What do I do?

### Opening clinical case

The presentation begins with this case:

A 28-year-old woman develops a severe headache suddenly while exercising. She describes it as the worst headache of her life and has vomited twice.

Before deciding which headache disorder she has, consider six questions:

1. Is this a primary or secondary headache?
2. What are my immediate concerns, and what do I do first?
3. Which history and examination findings make it dangerous?
4. Which investigations do I request, and when is a lumbar puncture safe?
5. If primary, which type is it, and how do I treat it?
6. If secondary, how do I treat the cause, and when do I admit or refer?

### Clinical reasoning

This is a high-risk presentation because the headache is:

- Sudden in onset.
- Severe and maximal at onset, according to the description.
- Triggered during physical exertion.
- Associated with vomiting.

The most urgent diagnosis to consider is **subarachnoid haemorrhage (SAH)**, particularly from a ruptured intracranial aneurysm.

Other important possibilities include:

- Cervical artery dissection.
- Cerebral venous sinus thrombosis.
- Intracerebral haemorrhage.
- Reversible cerebral vasoconstriction syndrome.
- Hypertensive emergency.
- Pregnancy-related vascular complications, depending on the patient's circumstances.

**Important principle:** A patient with a thunderclap headache should be assessed for dangerous secondary causes before being labelled as having migraine or another primary headache.

### What is thunderclap headache?

A thunderclap headache is a headache that reaches maximum intensity very rapidly, classically within one minute.

It is a description of onset, not a final diagnosis.

Causes include SAH, RCVS, CVST, cervical artery dissection and other vascular disorders. Primary thunderclap headache is considered only after appropriate exclusion of secondary causes.

## 2. Why headache matters

The presentation provides four epidemiological figures:

| Figure | Meaning |
|---|---|
| 66% | Lifetime prevalence of headache |
| 20% | Proportion of work absences attributed to headache |
| 98% | Approximate proportion of headaches that are primary |
| 3% | Emergency department visits attributed to headache |

### Understanding the figures

**Prevalence:** The proportion of a population affected by a condition during a specified period.

Lifetime prevalence means the proportion of people who have experienced headache at least once during their lifetime.

**Work absence:** Headache can cause people to miss work or school. It can also cause reduced productivity despite attendance, which is called presenteeism.

**Primary headache predominance:** Most headaches are not caused by an intracranial tumour, haemorrhage or infection. Many are primary headache disorders.

However, the fact that secondary headaches are less common does not make them less important. Some are life-threatening or can cause permanent disability.

The epidemiological figures are approximate and vary by population, study and definition.

**Central message:** Most headaches are benign. The clinical task is to identify the minority that are dangerous.

## 3. Primary versus secondary headache

### A. Primary headache

A primary headache is a headache disorder in which the headache itself is the disease, rather than a symptom of another identifiable underlying condition.

Examples:

- Migraine.
- Tension-type headache.
- Cluster headache.
- Other primary headache disorders.

Primary headaches are generally diagnosed through a characteristic history and examination, provided there are no concerning features suggesting a secondary cause.

### B. Secondary headache

A secondary headache is a headache caused by another underlying condition.

Examples include:

| Category | Examples |
|---|---|
| Vascular | SAH, stroke, CVST, arterial dissection |
| Infectious | Meningitis, encephalitis, brain abscess |
| Neoplastic | Brain tumours, metastatic lesions |
| Traumatic | Epidural and subdural haematoma |
| Ophthalmological | Acute angle-closure glaucoma |
| Inflammatory | Giant cell arteritis |
| Toxic | Carbon monoxide poisoning |
| Drug-related | Medication-overuse headache |

The treatment of a secondary headache involves identifying and managing the underlying cause, rather than treating only the pain.

### Important clinical distinction

A severe headache is not automatically secondary, and a mild headache is not automatically primary.

The nature of onset, associated symptoms, examination findings, risk factors and clinical context are more important than pain intensity alone.

## 4. Why headache hurts

### The brain itself has no pain receptors

The brain parenchyma, meaning the functional tissue of the brain, is relatively insensitive to pain.

However, several structures around and within the head are pain-sensitive.

These include:

- Scalp and its blood supply.
- Dura mater.
- Intracranial blood vessels.
- Dural venous sinuses.
- Head and neck muscles.
- Cranial nerves V, IX and X.
- Certain cervical spinal nerve structures.

### A. The meninges

The meninges are the protective membranes surrounding the brain and spinal cord.

They consist of:

1. **Dura mater:** The tough outer membrane.
2. **Arachnoid mater:** The middle membrane.
3. **Pia mater:** The delicate inner membrane closely covering the brain.

The subarachnoid space lies between the arachnoid and pia and contains cerebrospinal fluid and blood vessels.

The dura and its associated vascular structures are particularly important sources of intracranial pain.

Examples:

- SAH causes blood to enter and irritate the subarachnoid space.
- Meningitis causes inflammation of the meninges.
- Intracranial masses can stretch or displace pain-sensitive structures.
- Intracranial hypotension can produce traction on pain-sensitive structures.

### B. Blood vessels

Intracranial arteries, dural vessels and venous sinuses can contribute to headache.

Examples:

- SAH: blood irritates pain-sensitive meningeal structures.
- CVST: impaired venous drainage increases venous pressure and can raise intracranial pressure.
- Arterial dissection: injury to the vessel wall activates pain-sensitive fibres.

### C. Muscles

Head and neck muscles can contribute to headache.

Important muscles include:

- Temporalis.
- Frontalis.
- Occipital muscles.
- Trapezius.
- Sternocleidomastoid.
- Suboccipital muscles.

Muscular and myofascial pain can contribute to tension-type headache. However, tension-type headache is not simply caused by muscle contraction; altered central pain processing is also important, particularly in chronic cases.

### D. Cranial nerves

**Cranial nerve V – Trigeminal nerve**

The trigeminal nerve has three major divisions:

| Division | Name | Main sensory territory |
|---|---|---|
| V1 | Ophthalmic | Forehead, upper eyelid, cornea |
| V2 | Maxillary | Midface, cheek, upper lip |
| V3 | Mandibular | Lower face and part of the oral cavity |

The trigeminal nerve is particularly important in migraine and cranial pain pathways.

It carries sensory information from many intracranial pain-sensitive structures.

**Cranial nerve IX – Glossopharyngeal nerve**

It supplies sensory structures in the posterior tongue, pharynx, tonsillar region and part of the middle ear.

It is relevant in glossopharyngeal neuralgia, which causes severe, brief, stabbing pain in the throat, tonsillar region, base of tongue or ear.

**Cranial nerve X – Vagus nerve**

It supplies sensory fibres to structures in the pharynx, larynx and parts of the external ear, among other territories.

It can contribute to referred pain involving the head and neck.

### E. The trigeminovascular system

This is a particularly important concept in migraine.

The trigeminovascular system consists of trigeminal sensory fibres associated with intracranial blood vessels and their central pain pathways.

Activation of these pathways leads to the release of neuropeptides, particularly:

- Calcitonin gene-related peptide (CGRP).
- Substance P.
- Neurokinin A.

These substances contribute to neurogenic inflammation and sensitisation of pain pathways.

CGRP is an important therapeutic target. Examples of CGRP-targeted migraine medicines include erenumab, fremanezumab and galcanezumab.

**Important clarification:** Migraine is not simply a condition of dilated blood vessels. It is a complex neurological disorder involving altered sensory processing and trigeminovascular signalling.

### How different headaches produce pain

| Headache | Important mechanism |
|---|---|
| Migraine | Trigeminovascular activation and altered sensory processing |
| Tension-type | Myofascial nociception and central sensitisation |
| Cluster | Trigeminal-autonomic pathways and hypothalamic involvement |
| SAH | Meningeal irritation |
| Meningitis | Inflammatory irritation of meninges |
| Brain tumour | Mass effect, oedema and traction on pain-sensitive structures |
| CVST | Venous congestion and sometimes raised ICP |
| Glaucoma | Raised intraocular pressure activates ocular pain pathways |

## 5. Classification: ICHD-3

ICHD-3 stands for **International Classification of Headache Disorders, 3rd edition**.

It is a classification system developed by the International Headache Society.

Its purpose is to standardise headache diagnosis, research and clinical communication.

### Three major categories

**1. Primary headache disorders**

- Migraine.
- Tension-type headache.
- Trigeminal autonomic cephalalgias.
- Other primary headaches.

**2. Secondary headache disorders**

Headache attributed to:

- Trauma.
- Vascular disorders.
- Non-vascular intracranial disorders.
- Infection.
- Substances or their withdrawal.
- Disorders of homeostasis.

**3. Cranial neuropathies and other facial pain**

- Trigeminal neuralgia.
- Other cranial neuralgias.
- Facial pain disorders.

### What does chronic mean?

The presentation uses the general frequency threshold:

- Headache on 15 or more days per month.
- For more than three months.

For chronic migraine, at least eight days per month must have migraine features or otherwise meet the applicable migraine criteria.

**Example 1:** A patient experiences headache on 18 days per month for four months, with migraine features on 10 days. This meets the frequency requirements for chronic migraine, assuming the remaining diagnostic criteria are satisfied.

**Example 2:** A patient experiences headache on 18 days per month, but migraine features occur on only five days. The frequency alone does not establish chronic migraine.

### Chronic daily headache

This is a descriptive term, not one single ICHD-3 diagnosis.

It describes headache occurring on 15 or more days per month for more than three months.

Possible diagnoses include:

- Chronic migraine.
- Chronic tension-type headache.
- New daily persistent headache.
- Hemicrania continua.
- Chronic cluster headache.
- Medication-overuse headache.
- Secondary headache disorders.

# PART II. IDENTIFYING DANGEROUS HEADACHES

## 6. Secondary causes by pathology

The presentation organises secondary headaches into eight groups.

| System | Important causes |
|---|---|
| Vascular | SAH, ICH, ischaemic stroke, CVST, arterial dissection |
| Infectious | Meningitis, encephalitis, brain abscess |
| Neoplastic | Brain tumours, metastatic lesions |
| Raised pressure | Intracranial mass, hydrocephalus, IIH |
| Traumatic | Subdural or epidural haematoma, concussion |
| Ophthalmological | Acute angle-closure glaucoma |
| Inflammatory | Giant cell arteritis |
| Other | Hypertensive emergency, CO poisoning, medication overuse, sinusitis |

### Important distinctions

**Vascular:** Think of haemorrhage, interruption of blood supply, venous obstruction and arterial wall injury.

**Infectious:** Distinguish infection of the meninges, brain tissue and localised intracerebral infection.

**Neoplastic:** Distinguish primary tumours from metastatic lesions.

**Raised pressure:** Consider masses, hydrocephalus, venous obstruction and IIH.

**Traumatic:** Distinguish epidural bleeding, subdural bleeding and concussion.

These categories can overlap. For example, a brain abscess can cause raised ICP, and CVST can produce venous infarction.

### Brain abscess

A brain abscess is a localised collection of pus within brain tissue.

Possible routes of infection:

- Contiguous spread from sinusitis, otitis or dental infection.
- Haematogenous spread from a distant infection.
- Direct inoculation following trauma or neurosurgery.

Clinical features include headache, fever, seizures, focal neurological deficits and features of raised ICP. Fever may be absent.

**Investigation:** MRI brain with contrast is particularly useful. Contrast-enhanced CT is an alternative when MRI is unavailable or urgent imaging is required.

**Important:** Avoid lumbar puncture when an intracranial abscess or mass effect is suspected because of the risk of herniation.

Management involves prolonged antimicrobial therapy and neurosurgical assessment for possible aspiration or drainage.

### Brain tumours and metastases

Primary tumours originate from intracranial structures. Metastases originate from cancers elsewhere in the body.

Common sources of brain metastases include lung, breast, melanoma, kidney and colorectal cancer.

Headache can result from:

- Mass effect.
- Peritumoral vasogenic oedema.
- Raised ICP.
- Obstruction of CSF pathways.
- Stretching or displacement of pain-sensitive structures.

Clinical clues include progressive headache, new seizures, focal deficits, personality changes and papilloedema.

MRI brain with contrast is generally preferred for characterising a suspected tumour.

## 7. Red flags: SNOOP

SNOOP is a framework for identifying features that may indicate a secondary headache.

| Letter | Meaning | Examples |
|---|---|---|
| S | Systemic illness | Fever, weight loss, night sweats, cancer, HIV, pregnancy |
| N | Neurological signs | Confusion, focal deficit, seizure, papilloedema |
| O | Onset | Sudden thunderclap or new headache after age 50 |
| O | Other features | Trauma, Valsalva, exertion, waking from sleep, drugs |
| P | Pattern change | Progressive headache or new character |

### Why each matters

**S – Systemic illness**

Fever suggests infection. Weight loss and night sweats can indicate malignancy or chronic infection. Cancer and immunocompromise increase the risk of intracranial pathology.

Pregnancy and the postpartum period are important because of conditions such as pre-eclampsia, CVST and other pregnancy-associated vascular disorders.

**N – Neurological signs**

A focal deficit may indicate stroke, haemorrhage, mass effect or another structural lesion.

Seizures can occur with brain tumours, abscesses, encephalitis, haemorrhage and CVST.

Papilloedema suggests raised intracranial pressure.

**O – Sudden onset or new headache after age 50**

Sudden maximal-at-onset headache requires urgent evaluation for SAH and other vascular causes.

A new headache after age 50 raises concern for conditions such as giant cell arteritis and intracranial malignancy.

**O – Other features**

Head trauma may cause intracranial bleeding.

Valsalva manoeuvres, coughing and exertion can precipitate or reveal secondary headache disorders.

Drugs may cause headache directly or contribute to medication overuse.

**P – Pattern change**

A patient with a familiar migraine pattern who develops a completely different headache requires reassessment.

Progressive symptoms or a new headache pattern can indicate secondary pathology.

### Important clarification

SNOOP is a screening framework, not a diagnostic test. The absence of one particular red flag does not guarantee that a headache is harmless.

## 8. Low-risk versus high-risk features

### Low-risk features in the presentation

- Age under 50.
- Typical primary headache features.
- Previous similar headaches.
- Normal neurological examination.
- No change in pattern.
- No high-risk comorbidity.

### High-risk features

- Age over 50.
- Recent head trauma.
- Altered mental status.
- Vomiting.
- Sudden onset, maximal at once.
- Papilloedema.
- Immunocompromise.
- Focal neurological deficit.
- Worse in the morning or waking from sleep.

These findings should prompt consideration of secondary causes and targeted investigations.

**Clinical qualification:** Vomiting and morning headache are not specific to intracranial pathology. They must be interpreted alongside the full history and examination.

A normal neurological examination does not exclude SAH, CVST, meningitis or other secondary headaches.

## 9. The initial approach: primary or secondary?

The presentation provides a clinical decision pathway.

**Patient presents with headache**

**Initial assessment**

- Airway, breathing and circulation.
- GCS and level of consciousness.
- Vital signs.
- Blood glucose.

**Are there red flags or high-risk features?**

YES

**Treat as possible secondary headache**

- Investigate suspected cause.
- CT, MRI, venography, LP or blood tests as appropriate.
- Treat underlying cause.
- Admit or refer if unstable or uncertain.

NO

**Classify primary headache**

- Migraine.
- Tension-type.
- Cluster.
- Other primary headache.

Treat attack, consider prevention and safety-net.

Reassess if the patient deteriorates or a new red flag develops.

### What is GCS?

Glasgow Coma Scale assesses level of consciousness using three components:

| Component | Score |
|---|---|
| Eye opening | 1–4 |
| Verbal response | 1–5 |
| Motor response | 1–6 |
| **Total** | **3–15** |

A falling GCS is particularly concerning because it may indicate worsening intracranial pathology, seizures, metabolic disturbance or other serious illness.

# PART III. HISTORY AND PHYSICAL EXAMINATION

## 10. History: use a structured approach

The presentation uses:

- Onset.
- Provocation.
- Quality.
- Radiation.
- Severity.
- Time.

### Onset

Ask whether the headache began suddenly or gradually.

Clarify:

- When did it start?
- What was the patient doing?
- Did it reach maximum intensity immediately?
- Was it the first headache of this type?

Sudden maximal-at-onset headache is particularly concerning for vascular causes.

### Provocation

Ask what triggers, worsens or relieves the headache.

Examples:

- Physical activity.
- Coughing or straining.
- Bending forward.
- Posture.
- Sleep deprivation.
- Menstruation.
- Specific foods or medications.

### Quality

Ask the patient to describe the pain.

Common descriptions:

- Throbbing or pulsating.
- Pressure or tightness.
- Stabbing.
- Burning.
- Electric shock-like.

Quality helps characterise the syndrome but should not be used in isolation.

### Radiation

Ask where the pain begins and where it spreads.

Examples:

- Unilateral temporal pain.
- Retro-orbital pain.
- Occipital pain extending into the neck.
- Facial pain.

### Severity

Ask about intensity and functional impact.

Does the headache prevent the patient from:

- Working?
- Studying?
- Sleeping?
- Performing daily activities?

Severity is important for assessing disability and treatment needs.

### Time

Clarify:

- Duration of each attack.
- Number of headache days per month.
- Frequency of attacks.
- Whether the pattern is changing.
- Whether pain is continuous or episodic.

### Additional history

The presentation specifically asks about:

- Nausea.
- Photophobia.
- Aura.
- Analgesic use.
- Sleep.
- Triggers.
- Mood.
- Family history.

Also establish relevant medical history, pregnancy or postpartum status, trauma, cancer, immunosuppression and current medications.

### Photophobia and phonophobia

**Photophobia:** Increased sensitivity or discomfort in response to light.

**Phonophobia:** Increased sensitivity or discomfort in response to sound.

Both are commonly associated with migraine.

### Aura

Aura refers to reversible neurological symptoms associated with migraine, commonly visual, sensory or speech/language symptoms.

Examples include flashing lights, zigzag lines, tingling sensations and transient speech disturbance.

A first episode, atypical symptom, persistent deficit or sudden neurological deficit needs assessment for stroke or TIA rather than automatic attribution to migraine.

## 11. Physical examination: what to look for

| Examination | Look for | Possible significance |
|---|---|---|
| General | Fever, rash, high BP | Infection, hypertensive emergency |
| Consciousness | Confusion, low GCS | Intracranial pathology |
| Neurological | Cranial nerves, power, gait | Focal deficit |
| Fundi | Papilloedema | Raised ICP |
| Neck | Stiffness, restricted movement | Meningism or cervical cause |
| Eyes | Red eye, pupils, visual acuity | Angle-closure glaucoma |
| Temporal arteries | Tenderness, reduced pulse | GCA |

### General examination

Record vital signs:

- Blood pressure.
- Pulse.
- Temperature.
- Respiratory rate.
- Oxygen saturation.

Look for signs of systemic infection, dehydration, rash or other systemic disease.

### Neurological examination

Assess:

- Mental status and GCS.
- Cranial nerves.
- Motor power.
- Sensation.
- Reflexes.
- Coordination.
- Gait, when safe.

A focal deficit may indicate stroke, haemorrhage, mass effect or another neurological disorder.

### Fundoscopy

Look for papilloedema.

Papilloedema is optic disc swelling secondary to raised intracranial pressure.

It is a significant warning sign and requires investigation of the underlying cause.

### Neck examination

Assess neck stiffness and range of movement.

Neck stiffness can occur with meningeal irritation, including SAH and meningitis. However, it is not specific to either condition.

### Eye examination

Assess:

- Visual acuity.
- Pupil size and reaction.
- Conjunctival injection.
- Corneal appearance, where possible.
- Eye pain.

A painful red eye with visual disturbance and a mid-dilated poorly reactive pupil should raise concern for acute angle-closure glaucoma.

### Temporal arteries

In an older patient with a new headache, assess for tenderness, thickening or reduced pulse in the temporal arteries.

These findings may support giant cell arteritis, although a normal examination does not exclude it.

## 12. Clinical signs: eyes and meninges

### Papilloedema

Papilloedema is optic disc swelling caused by raised intracranial pressure.

It may be associated with:

- Headache.
- Transient visual obscurations.
- Pulsatile tinnitus.
- Diplopia.

It is important because prolonged pressure can damage the optic nerve and threaten vision.

### Brudzinski sign

With the patient lying supine, passive neck flexion produces involuntary flexion of the hips and knees.

This can occur in meningeal irritation.

### Kernig sign

With the patient supine and hip flexed, extension of the knee causes pain or resistance.

This may also suggest meningeal irritation.

**Important:** These signs have limited sensitivity. Their absence does not exclude meningitis or SAH.

### Acute angle-closure glaucoma

Aqueous humour is produced by the ciliary processes and normally drains through the trabecular meshwork into Schlemm's canal.

When the drainage angle becomes obstructed, intraocular pressure can rise rapidly.

This can cause:

- Severe eye pain.
- Headache.
- Red eye.
- Halos around lights.
- Blurred vision.
- Nausea and vomiting.

This is an ophthalmological emergency.

# PART IV. PRIMARY HEADACHE DISORDERS

## 13. The four ICHD-3 primary headache groups

The presentation identifies:

1. Migraine.
2. Tension-type headache.
3. Trigeminal autonomic cephalalgias.
4. Other primary headaches.

The clinical focus is on migraine, tension-type and cluster headache.

## 14. Migraine

Migraine is a recurrent neurological disorder characterised by attacks of headache and associated symptoms.

It may occur with or without aura.

### Migraine without aura

The presentation describes it as recurrent, usually unilateral and pulsating, with nausea, photophobia and phonophobia.

Typical characteristics:

- Moderate to severe intensity.
- Often unilateral.
- Pulsating quality.
- Worse with routine physical activity.
- Nausea or vomiting.
- Photophobia and phonophobia.

### Migraine with aura

Aura consists of fully reversible neurological symptoms that usually develop gradually before or during the headache.

Common forms:

- Visual aura.
- Sensory aura.
- Speech or language disturbance.

Visual aura may include:

- Zigzag lines.
- Flashing lights.
- Scintillating scotoma.
- Expanding blind spots.

Sensory aura may include tingling or pins-and-needles sensations that spread gradually.

**Clinical distinction:** A typical migraine aura usually develops gradually and is reversible. A sudden persistent focal neurological deficit should be treated as possible stroke until adequately assessed.

### Chronic migraine

The frequency requirements are:

- At least 15 headache days per month.
- For more than three months.
- At least eight days per month with migraine features or qualifying migraine symptoms.

### Diagnostic criteria: migraine without aura

The presentation gives the following criteria:

At least five attacks lasting 4–72 hours, with at least two of:

- Unilateral location.
- Pulsating quality.
- Moderate or severe intensity.
- Worsening with routine physical activity.

And at least one of:

- Nausea or vomiting.
- Both photophobia and phonophobia.

The complete ICHD-3 diagnosis also requires that the headache is not better accounted for by another diagnosis.

## 15. Tension-type headache (TTH)

Tension-type headache is a common primary headache disorder.

The presentation describes:

- Usually bilateral pain.
- Pressing or tightening quality.
- Mild to moderate intensity.
- Not worsened by routine physical activity.
- No nausea or vomiting.

Photophobia or phonophobia may occur, but the classic presentation does not have the prominent migraine-associated symptom pattern.

### Subtypes

| Subtype | Frequency |
|---|---|
| Infrequent episodic | Occasional attacks |
| Frequent episodic | 1–14 days per month |
| Chronic | At least 15 days per month for more than 3 months |

### Pathophysiology

Episodic tension-type headache is associated with peripheral myofascial nociception.

Chronic tension-type headache involves increased central pain sensitivity and altered pain modulation.

Stress, poor sleep, anxiety and musculoskeletal factors may contribute, but they are not sufficient to establish the diagnosis.

## 16. Trigeminal autonomic cephalalgias (TACs)

TACs are a group of primary headache disorders characterised by:

- Severe, usually unilateral head pain.
- Ipsilateral cranial autonomic symptoms.

Ipsilateral means on the same side as the headache.

Autonomic symptoms include:

- Tearing.
- Conjunctival injection.
- Nasal congestion.
- Rhinorrhoea.
- Eyelid swelling.
- Ptosis.
- Miosis.

These symptoms arise from activation of trigeminal-autonomic pathways.

### A. Cluster headache

Cluster headache produces very severe unilateral orbital or temporal pain.

Typical features:

- Severe stabbing or boring pain.
- Orbital, supraorbital or temporal location.
- Attacks lasting 15–180 minutes.
- Tearing and conjunctival injection.
- Nasal congestion or rhinorrhoea.
- Ptosis or miosis may occur.
- Patient often becomes restless and paces.

Cluster headache occurs in attacks that may recur several times per day during a cluster period.

**Important distinction:** A patient with migraine often prefers to lie still in a quiet, dark room. A patient with cluster headache often becomes restless and unable to remain still.

### B. Paroxysmal hemicrania

Characterised by:

- Severe unilateral pain.
- Short, frequent attacks.
- Ipsilateral autonomic symptoms.
- Complete response to indomethacin.

### C. SUNCT

SUNCT means **Short-lasting Unilateral Neuralgiform headache attacks with Conjunctival injection and Tearing**.

It produces brief, frequent attacks of unilateral pain associated with both conjunctival injection and tearing.

### D. SUNA

SUNA means **Short-lasting Unilateral Neuralgiform headache attacks with cranial Autonomic symptoms**.

It resembles SUNCT but does not require both conjunctival injection and tearing.

### E. Hemicrania continua

Characterised by:

- Continuous unilateral headache.
- Exacerbations of more severe pain.
- Autonomic features may occur.
- Complete response to indomethacin.

### TAC comparison

| Disorder | Main distinguishing feature |
|---|---|
| Cluster | Severe orbital/temporal attacks, restlessness |
| Paroxysmal hemicrania | Frequent short attacks; indomethacin response |
| SUNCT | Short attacks with conjunctival injection and tearing |
| SUNA | Short attacks with autonomic symptoms, not necessarily both injection and tearing |
| Hemicrania continua | Continuous unilateral headache with exacerbations; indomethacin response |

## 17. Other primary headache disorders

The presentation includes:

| Disorder | Description |
|---|---|
| Primary cough headache | Triggered by coughing or straining |
| Primary exercise headache | Occurs during or after strenuous physical activity |
| Headache associated with sexual activity | Occurs during sexual activity and may peak at orgasm |
| Primary thunderclap headache | Abrupt, severe headache; diagnosis of exclusion |
| Primary stabbing headache | Brief spontaneous stabbing pains |
| Nummular headache | Pain in a small, sharply circumscribed scalp area |
| Hypnic headache | Develops only during sleep and wakes the patient |
| New daily persistent headache | Clearly remembered onset, becoming continuous within 24 hours |

### Important clinical warning

Do not diagnose primary cough, exercise, sexual activity or thunderclap headache without considering secondary causes.

For example, a sudden headache during exercise could be SAH, dissection or RCVS.

A primary diagnosis is appropriate only after the relevant secondary causes have been excluded.

## 18. Primary headaches compared

| Feature | Migraine | Tension-type | Cluster |
|---|---|---|---|
| Duration | 4–72 hours | 30 minutes–7 days | 15–180 minutes |
| Site | Often unilateral | Usually bilateral | Unilateral orbital/temporal |
| Intensity | Moderate–severe | Mild–moderate | Very severe |
| Quality | Pulsating | Pressing/tightening | Stabbing/boring |
| Activity | Worsens; prefers rest | Not worsened | Restless, paces |
| Associated symptoms | Nausea, photophobia, phonophobia | No nausea/vomiting; limited migraine features | Tearing, rhinorrhoea, ptosis, miosis |

### Clinical approach to differentiation

- **Unilateral pulsating pain with nausea and photophobia:** Think migraine.
- **Bilateral pressure-like pain without worsening on activity:** Think tension-type headache.
- **Severe unilateral orbital pain with tearing and restlessness:** Think cluster headache.

Do not diagnose solely from pain location. Evaluate the complete pattern and exclude secondary causes where indicated.

# PART V. SECONDARY HEADACHES NOT TO MISS

## 19. Important emergency diagnoses

| Condition | Key clinical clues |
|---|---|
| SAH | Thunderclap, maximal at onset, neck stiffness |
| Meningitis/encephalitis | Fever, neck stiffness, altered mental status |
| GCA | Age over 50, jaw claudication, scalp tenderness |
| CVST | Pregnancy, postpartum, oral contraceptives, papilloedema |
| Arterial dissection | Neck pain, trauma, Horner syndrome, focal deficit |
| Space-occupying lesion | Progressive headache, worse lying down, papilloedema |
| Hypertensive emergency | Severe BP elevation with visual changes or confusion |
| CO poisoning | Others at home unwell, exposure to heaters, dizziness |
| Angle-closure glaucoma | Painful red eye, halos, fixed mid-dilated pupil |

### Additional clinical explanations

**SAH:** Blood enters the subarachnoid space, causing meningeal irritation and potentially a sudden rise in intracranial pressure.

**Meningitis:** Infection and inflammation of the meninges cause headache, fever and possible neck stiffness.

**Encephalitis:** Inflammation of brain parenchyma can produce altered behaviour, confusion, seizures and focal deficits.

**GCA:** Inflammation of arteries can compromise blood supply to the optic nerve, causing irreversible visual loss.

**CVST:** Venous obstruction impairs drainage and CSF absorption, potentially producing raised ICP and venous infarction.

**Arterial dissection:** An injury to the arterial wall can cause pain and lead to thrombus formation or embolisation.

**Space-occupying lesion:** A tumour, abscess or haemorrhage can produce mass effect, oedema and raised ICP.

**Hypertensive emergency:** Severe blood pressure elevation with acute target-organ injury can cause neurological complications, including PRES.

**CO poisoning:** Carboxyhaemoglobin reduces oxygen delivery. A normal standard pulse oximeter reading does not reliably exclude poisoning.

**Angle-closure glaucoma:** Obstruction of aqueous humour outflow produces rapid elevation of intraocular pressure and can threaten vision.

# PART VI. EMERGENCY INVESTIGATION AND MANAGEMENT

## 20. Emergency headaches: first actions

The presentation provides this summary:

| Condition | Key test | First action |
|---|---|---|
| SAH | Urgent non-contrast CT | Specialist and neurosurgical care |
| Meningitis | Cultures, LP when safe | Empirical IV antibiotics without delay |
| GCA | ESR, CRP | Corticosteroids promptly if suspected |
| CVST | CT or MR venography | Anticoagulation, specialist-guided |
| Raised pressure/IIH | MRI, MRV, then LP pressure | Protect vision, acetazolamide |
| Angle-closure glaucoma | Urgent eye pressure assessment | Emergency ophthalmology |
| Hypertensive emergency | BP and end-organ assessment | Controlled BP reduction |
| CO poisoning | Carboxyhaemoglobin | High-flow oxygen, remove exposure |
| Cervical artery dissection | CT or MR angiography | Specialist stroke care |
| Brain tumour/mass | MRI or CT head | Neurosurgical referral, manage raised ICP |
| Stroke | CT head, then specialist imaging | Acute stroke pathway |

### Clinical principle

The investigation should answer a specific clinical question.

For example:

- Suspected haemorrhage: CT brain without contrast.
- Suspected mass: MRI brain, often with contrast.
- Suspected CVST: CT venography or MR venography.
- Suspected meningitis: CSF analysis when safe.
- Suspected GCA: inflammatory markers and temporal artery assessment.

## 21. Thunderclap headache pathway

**Sudden severe headache**

**Urgent non-contrast CT brain**

Blood seen

**SAH suspected/identified**

Urgent specialist and neurosurgical care.

CT normal

**Do not automatically stop**

Consider time since onset, scan quality and remaining clinical suspicion.

**Further evaluation where indicated**

LP or CT angiography according to the clinical situation and local pathway.

### Why non-contrast CT?

Acute blood is usually hyperdense on CT. A non-contrast scan can identify acute intracranial haemorrhage without contrast obscuring the appearance of blood.

### Why does timing matter?

The sensitivity of CT for SAH decreases with time after onset as blood becomes less conspicuous.

The presentation emphasises that CT is less sensitive beyond six hours.

A high-quality modern CT performed within six hours in an appropriately selected patient may be sufficient to exclude SAH under validated pathways. However, this depends on factors such as scan quality, interpretation and clinical circumstances.

If suspicion remains after a negative CT, further testing may be necessary.

**Important:** A normal CT does not automatically exclude every cause of thunderclap headache.

## 22. Investigations: be selective

The presentation gives this general framework:

| Clinical situation | Investigation approach |
|---|---|
| No red flags | Usually no imaging; reassure and treat |
| Suspected bleed, trauma or sudden onset | Non-contrast CT head |
| Structural, venous or posterior fossa concern | MRI brain; add venography when indicated |
| Suspected infection or SAH after negative CT | LP when safe and indicated |
| Age over 50 with suspected arteritis | ESR and CRP |

### CT versus MRI

**CT brain**

- Fast.
- Useful for acute haemorrhage.
- Useful after head trauma.
- Useful in emergencies.
- Uses ionising radiation.

**MRI brain**

- Better soft-tissue detail.
- Useful for tumours and structural abnormalities.
- Useful for posterior fossa lesions.
- Can be combined with venography.
- Usually takes longer than CT.

### CT for bleeding

Non-contrast CT is particularly useful for acute intracranial haemorrhage, including SAH and ICH.

### MRI for masses

MRI provides better soft-tissue characterisation and is generally preferred when a brain tumour or other structural lesion is suspected.

### Venography for venous thrombosis

CT venography or MR venography evaluates venous sinuses and can identify CVST.

A normal non-contrast CT does not exclude CVST.

### Why not image everyone?

Unnecessary imaging can produce:

- Radiation exposure from CT.
- Incidental findings.
- Anxiety.
- Additional investigations.
- Increased cost.

Imaging should be based on the clinical presentation and suspected pathology.

## 23. CT and lumbar puncture pitfalls

The presentation identifies five important points.

1. CT can miss SAH. If clinical suspicion remains high, CSF assessment for red cells or xanthochromia may be needed.
2. A high-quality CT within six hours of onset may exclude SAH without LP in appropriately selected patients following a validated pathway.
3. Suspected raised intracranial pressure or a mass lesion requires appropriate imaging before LP.
4. Never delay antibiotics for imaging or LP in suspected bacterial meningitis.
5. D-dimer can help exclude venous thrombosis in selected low-risk patients, but high-risk patients need appropriate venous imaging.

### What is xanthochromia?

Xanthochromia is a yellowish discoloration of CSF caused by the breakdown of red blood cells and formation of haemoglobin breakdown products, particularly bilirubin.

It may support a diagnosis of SAH when the CT is negative but suspicion remains.

Its detection and interpretation depend on timing and laboratory methodology.

### D-dimer and CVST

D-dimer is a fibrin degradation product.

A raised D-dimer can occur with thrombosis, but it is nonspecific.

A normal D-dimer does not reliably exclude CVST in all patients, particularly those with isolated headache or prolonged symptoms.

If clinical suspicion is high, obtain CT venography or MR venography.

## 24. Lumbar puncture: indications and deferral

### Indications in the presentation

**A. Meningitis or encephalitis**

CSF is examined for:

- Cell count.
- Protein.
- Glucose.
- Culture.
- PCR.

**B. Suspected SAH**

LP may be indicated when CT is negative but suspicion remains, depending on timing and the local diagnostic pathway.

**C. Suspected IIH**

LP is performed after appropriate neuroimaging to measure opening pressure and assess CSF composition.

**D. Other selected cases**

LP may be useful when CSF results will change management.

### When should LP be deferred?

| Situation | Why? | Action |
|---|---|---|
| Mass effect, midline shift or obstructive hydrocephalus | Risk of herniation | Do not proceed |
| Infection at puncture site or spinal epidural infection | Risk of spreading infection | Do not proceed |
| Significant coagulopathy or uncorrected anticoagulation | Risk of spinal haematoma | Defer until corrected |
| Haemodynamic or respiratory instability | Patient needs stabilisation | Stabilise first |
| Unprotected airway or uncontrolled seizures | Immediate safety risk | Stabilise first |

### Why can LP cause herniation?

In a patient with a significant intracranial mass lesion or pressure gradient, removal of CSF from the spinal compartment can worsen downward displacement of intracranial structures.

This can precipitate brain herniation, which is life-threatening.

**A normal CT does not make every LP safe.** The full clinical assessment is still necessary.

## 25. Lumbar puncture: CT first or not?

The presentation provides a practical decision pathway.

### Step 1: Stabilise

Assess ABC, consciousness, vital signs and immediate threats.

### Step 2: Blood cultures if appropriate

Obtain cultures before antibiotics if this does not delay treatment.

### Step 3: Antibiotics now

If bacterial meningitis is suspected, start empirical IV antibiotics promptly. Do not wait for CT or LP if doing so would delay treatment.

### Step 4: Decide whether CT is needed before LP

**CT first when there is concern for intracranial mass effect or other significant intracranial pathology**, such as:

- Focal neurological deficit.
- New seizure.
- Posturing.
- Abnormal pupils.
- Markedly reduced or falling consciousness.
- Known or suspected mass lesion.

**LP may proceed without CT first** in selected patients with suspected meningitis who have no focal deficit, new seizure, pupil change, falling consciousness or suspected mass, provided no other contraindication exists.

**Defer LP** when there is:

- Coagulopathy.
- Haemodynamic instability.
- Respiratory instability.
- Unprotected airway.
- Uncontrolled seizures.

Stabilise and reassess before proceeding.

### Essential clinical pearl

Never delay antibiotics for CT or LP in suspected bacterial meningitis.

## 26. Lumbar puncture: anatomy and technique

### Position

The presentation recommends the lateral position with knees drawn towards the chest.

This helps flex the lumbar spine and open the spaces between vertebral processes.

### Level

LP is performed between:

- L3–L4, or
- L4–L5.

The adult spinal cord usually ends around L1–L2. Therefore, lumbar puncture is performed below the usual termination of the spinal cord to reduce the risk of cord injury.

### What do we send?

- Opening pressure.
- Cell count and differential.
- Protein.
- Glucose.
- Culture.
- Appropriate PCR testing.

### Understanding CSF results

| Condition | Typical CSF pattern |
|---|---|
| Bacterial meningitis | Neutrophils increased, protein increased, glucose reduced |
| Viral meningitis | Usually lymphocytes increased, mild protein increase, glucose often preserved |
| TB meningitis | Usually lymphocytes increased, protein increased, glucose reduced |
| Cryptococcal meningitis | Often lymphocytes increased, protein increased, glucose may be reduced; findings can be subtle in immunocompromised patients |

These are typical patterns, not absolute rules. Interpret CSF in the context of clinical presentation, microbiology and prior treatment.

## 27. Grading and assessment tools

The presentation includes several tools.

### A. Hunt and Hess grading

A clinical grading system for SAH, from grade I to grade V.

It ranges from mild symptoms to deep coma and is used to assess clinical severity after SAH has been diagnosed.

### B. WFNS grading

The World Federation of Neurosurgical Societies grading system uses:

- Glasgow Coma Scale.
- Presence or absence of motor deficit.

It ranges from grade I to grade V.

### C. Modified Fisher scale

A radiological grading system based on the amount and distribution of blood seen on CT after SAH.

It ranges from 0 to 4 and helps assess the risk of delayed cerebral ischaemia related to vasospasm.

**Important:** Hunt and Hess, WFNS and Modified Fisher are grading systems after SAH diagnosis. They are not screening tools for patients presenting with headache.

### D. Other tools

| Tool | Purpose |
|---|---|
| GCS | Level of consciousness |
| MIDAS | Migraine-related disability |
| HIT-6 | Headache impact on daily life |
| Frisén scale | Grading papilloedema |
| Headache diary | Frequency, duration, triggers and medication use |

# PART VII. MANAGEMENT

## 28. Migraine management

The presentation divides management into behavioural measures, acute treatment and prophylaxis.

### A. Behavioural management

- Regular sleep.
- Regular meals.
- Trigger identification and avoidance where appropriate.
- Stress management.
- Exercise.
- Headache diary.

The objective is to reduce avoidable triggers and improve control.

### B. Acute treatment

The presentation recommends:

**First line:**

- NSAID or paracetamol.
- An antiemetic where appropriate.

**Second line:**

- Triptan if required.

Treatment should be taken early in the attack, when appropriate.

#### Why use an antiemetic?

Migraine can cause nausea and vomiting. Antiemetics improve symptoms and can facilitate administration of oral medication.

Some antiemetics also have direct antimigraine effects.

#### Why use a triptan?

Triptans are serotonin 5-HT1B/1D receptor agonists. They act on trigeminovascular pathways and can relieve migraine attacks.

They are not suitable for every patient. Important contraindications include significant vascular disease and uncontrolled hypertension, depending on the medicine and clinical context.

### C. Prophylaxis

Consider preventive treatment when attacks are frequent, disabling or inadequately controlled with acute treatment.

The presentation lists:

- Riboflavin.
- Magnesium.
- Propranolol.
- Amitriptyline.
- Topiramate.
- Candesartan.

### Important medication considerations

| Drug | Important consideration |
|---|---|
| Propranolol | Avoid or use caution in asthma, bradycardia and certain conduction disorders |
| Topiramate | Can cause paraesthesia, cognitive effects and weight loss; important pregnancy-related precautions |
| Amitriptyline | Sedation, anticholinergic effects and cardiac considerations |
| Candesartan | Monitor BP, renal function and potassium; avoid in pregnancy |
| Magnesium | Gastrointestinal adverse effects can occur |
| Riboflavin | Used as a preventive supplement |

Also screen for depression and anxiety, and counsel about medication overuse.

## 29. Acute primary headache in the emergency department

| Treatment | Role and notes |
|---|---|
| Prochlorperazine | Antiemetic; may also reduce migraine pain |
| Metoclopramide | Antiemetic and prokinetic; can cause extrapyramidal reactions |
| Diphenhydramine | May be used for extrapyramidal adverse effects |
| Paracetamol | Short-term pain relief; recurrence may occur |
| NSAIDs | Effective analgesia; consider renal, gastrointestinal and bleeding risks |
| Sumatriptan | A triptan; parenteral administration may be useful when vomiting prevents oral treatment |
| Dexamethasone | May reduce migraine recurrence, especially in prolonged attacks |
| IV fluids | Correct dehydration; not a specific analgesic |
| Opioids | Avoid where possible because of dependence, recurrence and increased healthcare utilisation |

### Why parenteral treatment?

If the patient is vomiting and cannot tolerate oral medication, parenteral routes may be necessary.

### Why avoid opioids?

Opioids are generally not preferred for migraine because they can:

- Promote medication-overuse headache.
- Cause dependence.
- Lead to recurrent healthcare visits.
- Provide less appropriate long-term control than migraine-specific treatment.

### Dexamethasone

The presentation notes that dexamethasone can reduce recurrence, particularly in prolonged attacks.

It is not a routine substitute for appropriate acute migraine therapy.

## 30. Chronic migraine management

The presentation sets realistic expectations:

The goal is fewer and milder attacks, not necessarily complete elimination.

Factors that may worsen migraine include:

- Excessive caffeine.
- Poor sleep.
- Analgesic overuse.
- Untreated anxiety and depression.

### Preventive treatment

The presentation lists:

**First line:**

- Propranolol.
- Topiramate.
- Amitriptyline.

**Second line:**

- Botulinum toxin A.

**If other options fail:**

- CGRP-targeted antibodies: erenumab, fremanezumab and galcanezumab.

Resistant cases may require specialist assessment for nerve blocks or other procedures.

### Why botulinum toxin A?

Botulinum toxin A is used in selected patients with chronic migraine. It affects neurotransmitter release and can reduce headache frequency.

### CGRP antibodies

These target the CGRP pathway involved in migraine signalling.

- Erenumab targets the CGRP receptor.
- Fremanezumab and galcanezumab target the CGRP ligand.

The choice of preventive treatment depends on comorbidities, contraindications, availability and response to previous treatment.

## 31. Tension-type and cluster headache treatment

### A. Tension-type headache

**Acute treatment:**

- Paracetamol.
- NSAID.

**Frequent or chronic headache:**

- Amitriptyline.

Also address:

- Stress.
- Sleep.
- Physical activity.
- Neck posture.

Limit analgesic days to reduce medication-overuse headache.

### B. Cluster headache

**Acute treatment:**

- 100% oxygen through a non-rebreather mask at 12–15 L/min.
- Subcutaneous sumatriptan.

Oral analgesics are too slow for the rapid, severe attacks of cluster headache.

**Prevention:**

- Verapamil, with ECG monitoring.

Refer to a specialist.

### Why ECG monitoring with verapamil?

Verapamil is a calcium-channel blocker that can slow atrioventricular conduction and cause bradycardia or heart block.

It is often titrated gradually, and ECG monitoring is important when initiating and increasing doses.

## 32. Drug of choice by headache type

The presentation provides this table:

| Headache type | First choice | Notes |
|---|---|---|
| Paroxysmal hemicrania | Indomethacin | Complete response is characteristic |
| Hemicrania continua | Indomethacin | Continuous headache with exacerbations |
| Primary stabbing headache | Indomethacin | Primary forms only |
| Hypnic headache | Indomethacin | Primary forms only |
| Primary cough headache | Indomethacin | Primary forms only |
| Primary exercise headache | Indomethacin | Primary forms only |
| Chronic cluster | Verapamil | Titrate slowly; steroids or dihydroergotamine may be used for exacerbations |
| Chronic SUNCT/SUNA | Lamotrigine | Topiramate or gabapentin as alternatives |
| Chronic tension-type | Amitriptyline | Screen cardiac risk; ECG if over 40, as stated in the slide |
| Chronic migraine | Propranolol, topiramate, amitriptyline | Preventive treatment |

### Important qualification

Indomethacin is particularly important in the diagnosis and treatment of paroxysmal hemicrania and hemicrania continua.

However, it is not appropriate to assume that every cough or exercise headache is primary. Secondary causes must first be considered.

Indomethacin also has important gastrointestinal, renal and cardiovascular risks, so suitability and monitoring matter.

# PART VIII. MEDICATION-OVERUSE HEADACHE

## 33. Medication-overuse headache

Medication-overuse headache (MOH) occurs when a patient with a pre-existing headache disorder regularly uses acute headache medications too frequently.

The presentation gives the following definition:

- Headache on 15 or more days per month.
- Regular medication overuse for more than three months.

### Formal ICHD-3 thresholds

| Medication | Overuse threshold |
|---|---|
| Triptans | 10 or more days/month |
| Opioids | 10 or more days/month |
| Ergots | 10 or more days/month |
| Combination analgesics | 10 or more days/month |
| Paracetamol | 15 or more days/month |
| NSAIDs | 15 or more days/month |

### Clinical clues

- Morning headache.
- Headache when a dose is delayed.
- Temporary relief after taking medication.
- Increasing frequency of analgesic use.
- Frequent use of over-the-counter medication.

Always ask about non-prescription medicines. Patients may not consider paracetamol or combination analgesics to be important medications when giving their history.

## 34. Managing medication-overuse headache

The presentation divides management into three steps.

### Step 1: Recognise

Ask about:

- Number of headache days.
- Number of medication-use days.
- Types of analgesics.
- Over-the-counter medicines.
- Whether headache worsens when a dose is delayed.

### Step 2: Withdraw

Stop or withdraw the overused medication using an appropriate plan.

The presentation notes that withdrawal symptoms may include:

- Nausea.
- Anxiety.
- Worsening headache.

These symptoms commonly last around 2–10 days, although the duration varies.

The slide mentions possible bridge treatments:

- A long-acting NSAID.
- Prednisone.
- Dihydroergotamine.
- An antiemetic from another class.

These options require individual assessment. For example, a patient with renal disease or gastrointestinal bleeding risk may not be suitable for an NSAID.

Opioid or barbiturate overuse may require a more carefully supervised withdrawal strategy.

### Step 3: Prevent

Preventive treatment is selected according to the underlying headache disorder and the patient's comorbidities.

The presentation lists:

- Topiramate.
- Amitriptyline.
- Valproate.
- A beta-blocker.

### Important counselling point

Withdrawal can initially worsen headache before improvement occurs.

Patients need education and follow-up so they understand this possibility and do not immediately return to the overused medication.

# PART IX. ADMISSION, FOLLOW-UP AND CLINICAL APPLICATION

## 35. Admission and follow-up

### Admit or refer urgently

The presentation identifies:

- Suspected SAH, meningitis, encephalitis or stroke.
- Reduced consciousness.
- Seizure.
- New neurological deficit.
- Papilloedema or visual loss.
- Suspected intracranial mass or raised pressure.
- Concerning headache during pregnancy or postpartum.
- Severe headache with diagnostic uncertainty.

### Safety-net and follow up

For patients who are appropriately discharged:

1. Explain which new symptoms require urgent reassessment.
2. Encourage a headache diary.
3. Review treatment response and adverse effects.
4. Check analgesic-use days at each visit.
5. Screen for low mood and anxiety.

### What should a headache diary contain?

A useful headache diary records:

- Date and time of each attack.
- Duration.
- Severity.
- Location and character.
- Associated symptoms.
- Possible triggers.
- Menstrual relationship where relevant.
- Medication taken.
- Response to treatment.
- Number of headache days and medication-use days.

This helps identify patterns and assess preventive treatment.

## 36. Return to the opening case

**Patient:** 28-year-old woman.

**Presentation:** Sudden severe headache during exercise, worst headache of her life, with vomiting.

### What is your working diagnosis?

Treat as possible **subarachnoid haemorrhage until adequately excluded**.

Other important differentials:

- Cervical artery dissection.
- CVST.
- Hypertensive emergency.
- Pregnancy-related vascular causes.
- RCVS.
- Other intracranial haemorrhage.

### What do you do first?

**Initial assessment:**

- Airway, breathing and circulation.
- GCS.
- Blood pressure.
- Blood glucose.
- Vital signs.

**Focused examination:**

- Full neurological examination.
- Fundoscopy.
- Neck stiffness.
- Assessment for meningism.
- Pregnancy test where appropriate.

**First investigation:**

Urgent non-contrast CT head.

### What happens next?

**If blood is seen on CT:**

- Urgent specialist assessment.
- Neurosurgical/neurovascular care.
- Investigate and manage the aneurysm and complications.

**If CT is normal:**

Do not automatically conclude that the patient has a primary headache.

Consider:

- Time since headache onset.
- CT quality and interpretation.
- Remaining clinical suspicion.
- LP or CT angiography according to the local pathway and suspected cause.

**Central lesson:** A normal CT does not end the work-up when the clinical suspicion remains high.

# PART X. THE TWO CLINICAL CASES

## 37. Case 1: Migraine

**Patient:** 24-year-old woman.

**Presentation:** Recurrent unilateral throbbing headaches associated with nausea and photophobia, worse with activity.

### Question 1: Likely diagnosis?

Migraine without aura, assuming the complete diagnostic criteria are met and no secondary cause is suspected.

### Question 2: Does she need a CT?

Not routinely, if:

- The history is typical of migraine.
- The neurological examination is normal.
- There are no red flags.
- There is no concerning change in headache pattern.

### Question 3: What is the acute treatment plan?

- NSAID or paracetamol.
- Antiemetic where indicated.
- Triptan if needed and suitable.
- Give acute treatment early in the attack.

### Question 4: What if attacks are frequent or disabling?

Consider preventive treatment:

- Propranolol.
- Topiramate.
- Amitriptyline.

Also address sleep, meals, triggers, stress and analgesic overuse.

## 38. Case 2: Subarachnoid haemorrhage

**Patient:** 38-year-old man.

**Presentation:** Sudden severe headache, described as the worst of his life, associated with vomiting.

### Question 1: Immediate concern?

Subarachnoid haemorrhage.

### Question 2: First investigation?

Urgent non-contrast CT head after initial assessment and stabilisation.

### Question 3: When is LP appropriate?

When CT is negative but clinical suspicion remains and further CSF assessment is indicated, considering time since onset and the local pathway.

### Question 4: Definitive pathway?

Urgent specialist and neurosurgical/neurovascular care.

Management may involve securing the ruptured aneurysm, monitoring for rebleeding, managing hydrocephalus and preventing or treating delayed cerebral ischaemia.

# PART XI. FINAL CONSOLIDATION

## 39. High-yield clinical distinctions

| Clinical presentation | Think of |
|---|---|
| Sudden, maximal-at-onset headache | SAH and other vascular causes |
| Fever, headache and neck stiffness | Meningitis |
| Headache, fever, confusion and seizures | Encephalitis |
| Progressive headache with papilloedema | Raised ICP or intracranial lesion |
| Postpartum headache with seizures | CVST and pregnancy-related emergencies |
| Headache with neck pain and Horner syndrome | Carotid artery dissection |
| New headache after age 50 with jaw claudication | GCA |
| Severe unilateral orbital pain with tearing | Cluster headache, after considering ocular causes |
| Painful red eye with halos and fixed mid-dilated pupil | Acute angle-closure glaucoma |
| Several household members with headache and dizziness | CO poisoning |
| Bilateral pressing headache without nausea or activity aggravation | Tension-type headache |
| Unilateral pulsating headache with nausea and photophobia | Migraine |

## 40. Important clinical pearls

1. A thunderclap headache is a clinical emergency until dangerous causes have been excluded.
2. Most headaches are primary, but prevalence should never replace clinical assessment.
3. The brain parenchyma itself is not pain-sensitive; surrounding structures generate much intracranial pain.
4. A normal neurological examination does not exclude a secondary headache.
5. Papilloedema is a warning sign of raised intracranial pressure.
6. A normal non-contrast CT does not exclude CVST.
7. Do not perform LP when significant mass effect or a dangerous pressure gradient is suspected.
8. Never delay empirical antibiotics for CT or LP in suspected bacterial meningitis.
9. A painful red eye with visual disturbance is an ophthalmological emergency until proven otherwise.
10. In suspected GCA, prompt corticosteroid treatment is important to prevent irreversible visual loss.
11. Medication overuse can transform episodic headache into chronic daily headache.
12. Do not diagnose primary thunderclap headache before excluding secondary causes.
13. Treat migraine early and avoid excessive acute medication use.
14. A normal CT does not necessarily end the evaluation of a patient with thunderclap headache.
15. Admission is appropriate when a dangerous cause is suspected, the patient is unstable, or diagnostic uncertainty remains significant.

## 41. Take-home points from the original presentation

The original presentation concludes with four central messages:

1. Screen for red flags using SNOOP.
2. Most headache diagnoses come from history and physical examination.
3. Image selectively when red flags or clinical suspicion justify it.
4. Treat migraine early and limit analgesic days.

The broader lesson is this:

**A good clinician does not simply identify the type of headache. A good clinician first establishes whether the headache is safe to classify as primary, identifies the dangerous secondary causes that must not be missed, chooses investigations that answer the clinical question, and treats the patient appropriately.**

Use these to test whether you can explain the presentation rather than simply memorise it.

**Question 1. A 28-year-old woman develops a thunderclap headache during exercise. What is your immediate concern, and why?**

**Question 2. Why can a patient with a large brain tumour have no headache?**

**Question 3. Why can a normal neurological examination not exclude SAH?**

**Question 4. Why do we perform CT before LP in selected patients?**

**Question 5. Why should antibiotics not be delayed for CT or LP in suspected bacterial meningitis?**

**Question 6. What distinguishes migraine from cluster headache clinically?**

**Question 7. Why is verapamil used in cluster headache, and why do we monitor ECG?**

**Question 8. A postpartum patient has progressive headache, papilloedema and a normal non-contrast CT. What investigation should you consider?**

**Question 9. Why can CO poisoning produce a normal pulse oximeter reading?**

**Question 10. What is the difference between chronic daily headache and chronic migraine?**
