| Grade   | Description                                              |
| ------- | -------------------------------------------------------- |
| Grade 1 | Mild, detectable only by ultrasound.                     |
| Grade 2 | Moderate, symmetrical abdominal distension.              |
| Grade 3 | Large or tense ascites with marked abdominal distension. |

### **Step 1: Confirm the cause**

Perform ultrasound and diagnostic paracentesis for new-onset ascites.

Check SAAG and ascitic fluid cell count.

Do not assume every patient with abdominal distension has cirrhotic ascites. Consider heart failure, malignancy, tuberculosis and other causes.

### **Step 2: Dietary sodium restriction**

Your Rwanda guideline recommends approximately 80–120 mmol sodium per day.

A practical modern target is approximately 2 g of sodium daily, equivalent to about 5 g of table salt.

Why?

The kidneys retain sodium in cirrhosis. Reducing sodium intake decreases the amount of fluid retained in the body and helps control ascites.

Do not confuse sodium with salt: 2 g sodium is approximately 5 g sodium chloride.

Avoid excessive dietary restriction that causes malnutrition.

**Fluid restriction is not routinely necessary.** It is mainly considered in significant dilutional hyponatraemia.

### **Step 3: Diuretics**

The preferred combination is spironolactone and furosemide.

**A. Spironolactone**

First-line diuretic

Starting dose: **100 mg orally once daily.**

Why?

In cirrhosis, reduced effective arterial blood volume activates RAAS, increasing aldosterone.

Aldosterone acts on the collecting ducts of the kidneys to increase sodium reabsorption and potassium excretion.

Spironolactone blocks mineralocorticoid receptors, reducing sodium retention and helping eliminate excess fluid.

**B. Furosemide**

Starting dose: **40 mg orally once daily.**

Why?

Furosemide is a loop diuretic. It inhibits the Na-K-2Cl cotransporter in the thick ascending limb of the loop of Henle.

This increases sodium and water excretion.

It is combined with spironolactone to improve fluid removal and help balance potassium disturbances.

**Practical regimen**

| Spironolactone | Furosemide |
| -------------- | ---------- |
| 100 mg         | 40 mg      |
| 200 mg         | 80 mg      |
| 300 mg         | 120 mg     |
| 400 mg         | 160 mg     |

The usual starting ratio is 100:40.

Your supplied Rwanda guideline specifies a maximum of spironolactone 400 mg/day and furosemide 80 mg twice daily.

Increase gradually according to response, blood pressure, renal function and electrolytes.

### **Monitoring during diuretic therapy**

Monitor:

- Daily body weight.
- Blood pressure.
- Serum sodium and potassium.
- Creatinine and urea.
- Urine output.
- Symptoms of hepatic encephalopathy and muscle cramps.

Why monitor weight?

It tells you whether the patient is losing excess fluid.

In patients without peripheral oedema, aim for weight loss not exceeding approximately 0.5 kg/day. With peripheral oedema, up to approximately 1 kg/day may be tolerated.

Excessively rapid fluid loss can reduce circulating volume and precipitate AKI.

### **When should we stop diuretics?**

Stop or reduce them when there is:

- Severe hyponatraemia, particularly sodium below 125 mmol/L.
- Acute kidney injury.
- Severe hepatic encephalopathy.
- Severe muscle cramps.
- Potassium below 3 mmol/L with furosemide.
- Potassium above 6 mmol/L with spironolactone.

**Why?**

These findings indicate that diuretic treatment is producing dangerous physiological disturbances or worsening renal perfusion.

### **Step 4: Abdominal paracentesis**

[Paracentesis — The Interventional Initiative](https://images.openai.com/static-rsc-4/M7PdeUrVoSXWe5kqW9Nuoe3YJrBC55eKDWN8ogC5D7mvlyCCah7YmNlN9_FMf2pyGVSeeYvIf7qeqjgw2PO0zQL6mhBLoQO7VaEMlVud2z2vkc7n0spEzk20AxxkFAArHUS_k0tAZ6_vjDIx6q9A4eUhWEy_i2XcCHGW3_2LWIM?purpose=inline)

Paracentesis involves inserting a needle or catheter into the peritoneal cavity to remove ascitic fluid.

It has two main purposes:

1. Diagnostic: to investigate the cause of ascites and exclude infection.
2. Therapeutic: to relieve symptomatic or tense ascites.

**When do we perform therapeutic paracentesis?**

- Grade 3 or tense ascites.
- Painful abdominal distension.
- Respiratory difficulty caused by raised intra-abdominal pressure.
- Refractory ascites that does not respond to medical treatment.

### **Large-volume paracentesis (LVP)**

This is particularly important in grade 3 ascites.

Remove the ascitic fluid in a therapeutic session, with appropriate albumin replacement.

**Why give albumin after removing large amounts of fluid?**

When large volumes of ascitic fluid are removed, effective circulating blood volume may fall.

This can activate vasoconstrictor systems, reduce renal perfusion and produce post-paracentesis circulatory dysfunction.

This may precipitate:

- Hyponatraemia.
- AKI.
- Hepatorenal syndrome.
- Hepatic encephalopathy.

**Albumin dose:**

Give 6–8 g of IV albumin for every litre of ascitic fluid removed when more than 5 L is removed.

Your Rwanda guideline uses 8 g/L.

Example:

A patient undergoes removal of 6 L of ascites.

\\[ 6 \times 8 = 48\text{ g albumin} \\]

Therefore, give 48 g of IV albumin.

Albumin is particularly important after large-volume paracentesis. Consider it even with smaller volumes in patients with hypotension, AKI or other high-risk features.

### **Step 5: Refractory ascites**

This means ascites that cannot be adequately controlled despite sodium restriction and appropriate diuretic therapy, or that rapidly recurs after treatment.

There are two important categories:

- Diuretic-resistant ascites: fails to respond despite adequate diuretic doses.
- Diuretic-intractable ascites: effective diuretic doses cannot be used because of complications such as AKI or electrolyte disturbances.

**Management:**

1. Repeated large-volume paracentesis with albumin.
2. Assess for TIPS in suitable patients.
3. Evaluate for liver transplantation.

TIPS reduces portal pressure by creating a low-resistance channel between the portal and hepatic venous systems.

It can improve control of ascites, but may worsen hepatic encephalopathy and is unsuitable for some patients with advanced cardiac or liver dysfunction.

## **7.3. Hepatic encephalopathy**

This is one of the most important complications to understand.

**Definition:** Hepatic encephalopathy is a potentially reversible disturbance in brain function occurring in patients with liver dysfunction and/or portosystemic shunting.

### **Why does it happen?**

The liver normally detoxifies substances absorbed from the intestine.

One important substance is ammonia.

Ammonia is generated through:

- Bacterial breakdown of proteins in the intestine.
- Intestinal metabolism of nitrogen-containing compounds.
- Metabolism of amino acids.

Normally, ammonia travels through the portal vein to the liver, where hepatocytes convert it into urea through the urea cycle.

Urea is then eliminated by the kidneys.

In cirrhosis:

1. Damaged hepatocytes cannot adequately detoxify ammonia.
2. Portosystemic shunts allow portal blood to bypass the liver.
3. More ammonia reaches the systemic circulation.
4. Ammonia enters the brain and is metabolised by astrocytes into glutamine.
5. Excess glutamine contributes to astrocyte swelling, altered neurotransmission and cerebral dysfunction.

Other neuroactive substances and systemic inflammation also contribute.

The patient develops altered cognition, behaviour and consciousness.

### **Clinical presentation**

Hepatic encephalopathy ranges from subtle cognitive changes to coma.

**Early manifestations:**

- Sleep-wake cycle reversal.
- Poor concentration.
- Irritability.
- Forgetfulness.
- Mild confusion.

**More advanced manifestations:**

- Disorientation.
- Inappropriate behaviour.
- Drowsiness.
- Asterixis.
- Stupor.
- Coma.

[Asterixis meaning, causes, diagnosis & treatment](https://images.openai.com/static-rsc-4/WyeBIU0Covb_7DqJ65jB5mdkkYgoDHWULrR2apjJa9pvDjfw5UmXdd_OOO02HAgzafNUyLM8CxadBc5j520F1oVxRMUF1m5dOnbL_D50XZIxvCnc1HjC7O_RHaFCCPmsbhQKj8-WQYpTBPbw8IwdoD5zn_OFOGb3JS7Vvr18OcE?purpose=inline)

### **What is asterixis?**

Asterixis is a negative myoclonus, characterised by brief interruptions in sustained muscle contraction.

Ask the patient to extend both arms, dorsiflex the wrists and spread the fingers.

The hands intermittently drop and return to position, producing a flapping movement.

It is associated with hepatic encephalopathy but is not exclusive to it.

### **West Haven classification**

| Grade | Clinical features                                                             |
| ----- | ----------------------------------------------------------------------------- |
| 0     | No obvious clinical encephalopathy; subtle cognitive abnormalities may exist. |
| I     | Impaired attention, altered sleep pattern, mild confusion or euphoria.        |
| II    | Lethargy, disorientation to time, inappropriate behaviour and asterixis.      |
| III   | Marked confusion, somnolence and gross disorientation.                        |
| IV    | Coma.                                                                         |

### **Investigations**

Hepatic encephalopathy is primarily a clinical diagnosis.

Investigate possible precipitating factors:

- FBC and cultures if infection is suspected.
- Electrolytes, particularly sodium and potassium.
- Urea and creatinine.
- Blood glucose.
- Liver tests.
- Urinalysis.
- Ascitic fluid analysis when ascites is present and SBP is possible.
- Gastrointestinal bleeding assessment.

Ammonia may be elevated, but an ammonia level alone cannot establish the diagnosis, grade severity or guide treatment.

Always consider other causes of altered consciousness, including hypoglycaemia, stroke, sepsis, uraemia, intoxication and intracranial bleeding.

### **Management**

Admit patients with overt encephalopathy

**Step 1: Identify and correct the precipitating factor.**

Common triggers include:

- Gastrointestinal bleeding.
- Spontaneous bacterial peritonitis.
- Other infections.
- Constipation.
- Dehydration.
- Excessive diuretic use.
- Hypokalaemia.
- Hyponatraemia.
- Renal failure.
- Sedatives and opioids.

Treating the trigger is as important as treating the encephalopathy itself.

**Step 2: Lactulose**

First-line treatment

Initial dose: **25–30 mL orally every 1–2 hours until bowel movement occurs**, then titrate to achieve 2–3 soft stools daily.

The Rwanda guideline gives an initial dose of 30 mL once or twice daily, with titration. In overt acute encephalopathy, more frequent initial dosing is commonly needed.

Why does lactulose work?

Lactulose is a non-absorbable synthetic disaccharide.

It reaches the colon, where bacteria metabolise it into organic acids.

This produces two effects:

1. The acidic colonic environment converts diffusible ammonia (NH₃) into ammonium (NH₄⁺), which is less readily absorbed.
2. Its osmotic effect increases stool frequency, helping eliminate ammonia and other nitrogen-containing substances through faeces.

**Important:** The target is 2–3 soft stools daily, not severe diarrhoea. Excessive diarrhoea causes dehydration and electrolyte disturbances, which can worsen encephalopathy.

If the patient cannot swallow safely, lactulose may be administered through a nasogastric tube after assessing aspiration risk. Rectal administration is another option in selected patients.

**Step 3: Rifaximin**

Dose: **550 mg orally twice daily.**

Why?

Rifaximin is a minimally absorbed intestinal antibiotic.

It reduces intestinal bacteria responsible for producing ammonia and other nitrogenous substances.

It is particularly useful as an add-on to lactulose in patients with recurrent hepatic encephalopathy.

**Step 4: Nutrition**

An important correction to your supplied guideline:

Routine protein restriction is NOT recommended.

Why?

Patients with cirrhosis already have increased muscle breakdown and are vulnerable to sarcopenia.

Muscle tissue helps metabolise ammonia. Severe protein restriction worsens muscle wasting and may actually impair ammonia clearance.

Aim for adequate protein, commonly 1.2–1.5 g/kg/day, with appropriate nutritional support.

### **When do we refer?**

- Grade III or IV encephalopathy.
- Inability to protect the airway.
- Recurrent episodes despite appropriate therapy.
- Failure to improve after correcting precipitating factors.
- Associated AKI, sepsis or gastrointestinal bleeding.

Grade III–IV patients may require ICU care.

## **7.4. Spontaneous bacterial peritonitis (SBP)**

**Definition:** SBP is an infection of ascitic fluid occurring without an identifiable surgically treatable intra-abdominal source.

Why are patients with cirrhosis susceptible?

Cirrhosis causes immune dysfunction, impaired intestinal barrier function and increased bacterial translocation.

Bacteria from the intestinal lumen can cross the intestinal wall, enter lymphatic channels and bloodstream, and eventually infect the ascitic fluid.

Common organisms include:

- *Escherichia coli*.
- *Klebsiella* species.
- Other enteric Gram-negative organisms.
- Some Gram-positive organisms.

### **Clinical presentation**

- Fever.
- Abdominal pain or tenderness.
- Worsening ascites.
- Vomiting.
- Hypotension.
- Worsening renal function.
- New or worsening hepatic encephalopathy.

Important: SBP can occur without fever or obvious abdominal tenderness. A patient may present only with confusion or AKI.

### **Diagnosis**

Diagnostic criterion

Perform diagnostic paracentesis.

The key finding is:

**Ascitic fluid polymorphonuclear neutrophil count (PMN) ≥250 cells/mm³.**

This is diagnostic of SBP in the appropriate clinical setting, even if culture is negative.

Do not confuse total white blood cell count with PMN count.

Send fluid for culture, ideally using bedside inoculation into blood culture bottles.

### **Management**

Admit the patient.

**Step 1: Start empirical antibiotics.**

For example:

Ceftriaxone 1–2 g IV once daily, usually for 5 days, adjusted according to clinical response and local susceptibility.

Why ceftriaxone?

It is a third-generation cephalosporin with activity against many enteric Gram-negative bacteria, including susceptible *E. coli* and *Klebsiella*.

In healthcare-associated infections or patients with recent antibiotic exposure, resistance patterns may require a different regimen.

**Step 2: Give IV albumin.**

The commonly recommended regimen is:

- Day 1: 1.5 g/kg IV.
- Day 3: 1 g/kg IV.

Why?

SBP can produce severe systemic inflammation and splanchnic vasodilation.

This reduces effective arterial blood volume and renal perfusion, increasing the risk of AKI and hepatorenal syndrome.

Albumin helps preserve circulatory function and reduces the risk of renal deterioration.

The greatest benefit is seen in patients with renal dysfunction or significant hepatic dysfunction.

**Step 3: Monitor response.**

Monitor:

- Vital signs.
- Renal function.
- Urine output.
- Electrolytes.
- Mental status.

Repeat paracentesis after approximately 48 hours if the patient is not responding or secondary peritonitis is suspected. A falling PMN count supports response.

### **Prevention of SBP**

Secondary prophylaxis is indicated after an episode of SBP because recurrence is common.

Possible regimens, depending on availability and local resistance:

- Norfloxacin 400 mg orally once daily.
- Ciprofloxacin 500 mg orally once daily.
- Trimethoprim-sulfamethoxazole 160/800 mg orally once daily.

The choice should follow local protocols and consider renal function, adverse effects and resistance.

Primary prophylaxis may be considered in selected high-risk patients, such as those with low ascitic protein plus advanced liver or renal dysfunction, and in patients with cirrhosis presenting with acute gastrointestinal bleeding.

Do not prescribe lifelong antibiotics to every patient with ascites.

## **7.5. Renal impairment and acute kidney injury (AKI)**

The kidneys are particularly vulnerable in advanced cirrhosis.

### **Why does AKI occur?**

Portal hypertension causes marked splanchnic vasodilation.

This reduces effective arterial blood volume.

The body responds by activating:

- RAAS.
- Sympathetic nervous system.
- ADH.

These systems cause sodium and water retention and renal vasoconstriction.

In advanced disease, renal blood flow may become severely compromised.

Other causes of AKI include:

- SBP and other infections.
- Gastrointestinal bleeding.
- Dehydration.
- Excessive diuresis.
- NSAIDs.
- Other nephrotoxic drugs.
- Large-volume paracentesis without adequate albumin.

### **How do we identify AKI?**

Do not rely only on the historical creatinine threshold of 1.5 mg/dL in your guideline.

Modern cirrhosis-associated AKI criteria include an increase in serum creatinine of at least 0.3 mg/dL within 48 hours, or at least 50% from baseline within seven days, and/or reduced urine output.

### **Management**

1. Stop diuretics temporarily if they are contributing to volume depletion or AKI.
2. Stop nephrotoxic drugs, especially NSAIDs.
3. Investigate infection and treat it.
4. Assess fluid status and haemodynamic state.
5. Correct genuine volume depletion with appropriate fluids.
6. Monitor urine output, creatinine and electrolytes.

Albumin is used in selected patients with suspected HRS-AKI and other specific indications, rather than automatically in every patient with AKI.

## **7.6. Hepatorenal syndrome (HRS)**

**Definition:** HRS is a form of kidney dysfunction occurring in advanced liver disease, primarily due to severe circulatory disturbances, with intense renal vasoconstriction.

The kidneys may initially have no major structural damage.

The problem is predominantly functional: the kidneys are receiving inadequate effective perfusion.

### **How does it develop?**

1. Advanced portal hypertension causes severe splanchnic vasodilation.
2. Effective arterial blood volume falls.
3. RAAS and sympathetic activity increase.
4. Renal vasoconstriction becomes intense.
5. Renal perfusion and GFR fall.
6. The patient develops AKI.

### **Clinical presentation**

- Reduced urine output.
- Rising serum creatinine.
- Increasing ascites.
- Hypotension or low-normal blood pressure.
- Advanced hepatic dysfunction.

### **Diagnosis**

HRS-AKI is a diagnosis of exclusion and requires careful evaluation for other causes of AKI.

Look for:

- Infection.
- Hypovolaemia.
- Shock.
- Nephrotoxic medication exposure.
- Structural renal disease.
- Urinary obstruction.

The historical classification into HRS type 1 and type 2 has been replaced by newer terminology, including HRS-AKI, HRS-AKD and HRS-CKD.

### **Management**

Urgent specialist management

**1. Stop precipitating medications.**

Stop or reassess diuretics, NSAIDs and other nephrotoxic drugs.

**2. Albumin and vasoconstrictor therapy.**

Terlipressin plus IV albumin is a preferred treatment where available and appropriate.

Terlipressin causes splanchnic vasoconstriction, reducing portal-systemic pooling and improving effective arterial circulation.

Albumin expands plasma volume.

Together, they can improve renal perfusion.

Alternative regimens may include noradrenaline with albumin in an appropriately monitored critical-care setting.

Midodrine plus octreotide is a less effective alternative when preferred treatments are unavailable.

**3. Consider renal replacement therapy.**

Dialysis may be required for standard indications, such as refractory hyperkalaemia, severe acidosis, pulmonary oedema or uraemic complications.

**4. Liver transplantation.**

This is the definitive treatment for eligible patients because it corrects the underlying liver disease and associated circulatory abnormalities.

## **7.7. Hepatocellular carcinoma (HCC)**

Cirrhosis is a major risk factor for primary liver cancer.

Repeated hepatocyte injury, inflammation, regeneration and genetic alterations promote malignant transformation.

### **Clinical features**

- Unexplained weight loss.
- Right upper quadrant pain.
- Worsening jaundice.
- Sudden deterioration in previously stable cirrhosis.
- New or worsening ascites.

### **Investigations**

- Liver ultrasound every six months for surveillance.
- AFP as an adjunct.
- Multiphasic contrast-enhanced CT or MRI when a suspicious lesion is identified.

A characteristic enhancement pattern in an at-risk patient can establish HCC diagnosis without biopsy.

### **Management**

Depends on tumour stage and underlying liver function.

Options include:

- Surgical resection in carefully selected patients.
- Liver transplantation in selected patients.
- Local ablative treatments.
- Transarterial chemoembolisation.
- Systemic therapy.

Refer to a specialist hepatobiliary or oncology service.

## **7.8. Hepatopulmonary syndrome and portopulmonary hypertension**

These are two different cardiopulmonary complications of cirrhosis.

**Hepatopulmonary syndrome (HPS)**

Portal hypertension and liver dysfunction cause pulmonary vascular dilatation.

Blood passes through abnormally dilated pulmonary vessels, impairing efficient oxygen exchange.

The patient develops hypoxaemia and dyspnoea.

A characteristic finding is platypnoea: breathlessness that worsens when standing or sitting upright and improves when lying down.

Diagnosis involves evidence of liver disease or portal hypertension, abnormal oxygenation and intrapulmonary vascular dilatation, often assessed by contrast echocardiography.

Liver transplantation is the definitive treatment in suitable patients.

**Portopulmonary hypertension**

This is pulmonary arterial hypertension associated with portal hypertension.

Unlike HPS, the problem is increased pulmonary vascular resistance.

The patient may develop:

- Progressive exertional dyspnoea.
- Fatigue.
- Syncope.
- Right-sided heart failure.

Echocardiography is used for screening, while right heart catheterisation confirms the diagnosis.

These two conditions are important because they can significantly affect transplant eligibility and perioperative risk.

## **7.9. Acute-on-chronic liver failure (ACLF)**

This occurs when a patient with chronic liver disease, usually cirrhosis, develops acute deterioration associated with organ failure and high short-term mortality.

Possible triggers include:

- Bacterial infection.
- Acute viral hepatitis.
- Alcohol-associated hepatitis.
- Gastrointestinal bleeding.
- Drug-induced liver injury.

The patient may develop:

- Hepatic failure.
- Renal failure.
- Respiratory failure.
- Circulatory failure.
- Coagulation dysfunction.
- Severe encephalopathy.

Management requires urgent admission, treatment of the precipitating cause, organ support and early specialist/transplant-centre assessment.

# **8. Preventing further liver damage**

Treating complications is not enough. We must also address the underlying cause.

| Cause                        | Treatment                                                           | Why?                                                                    |
| ---------------------------- | ------------------------------------------------------------------- | ----------------------------------------------------------------------- |
| Alcohol-associated cirrhosis | Complete alcohol abstinence and appropriate addiction support       | Removes the ongoing hepatotoxic exposure.                               |
| Hepatitis B                  | Appropriate antiviral therapy, commonly tenofovir or entecavir      | Suppresses viral replication and reduces ongoing liver injury.          |
| Hepatitis C                  | Direct-acting antiviral therapy                                     | Can achieve sustained virological cure and reduce further liver damage. |
| Autoimmune hepatitis         | Corticosteroids, often with azathioprine                            | Suppresses immune-mediated hepatocyte injury.                           |
| PBC                          | Ursodeoxycholic acid, commonly 13–15 mg/kg/day                      | Improves bile flow and reduces cholestatic injury.                      |
| Haemochromatosis             | Therapeutic phlebotomy                                              | Removes excess iron and reduces further tissue injury.                  |
| Wilson disease               | Copper-lowering therapy, such as chelation                          | Reduces toxic copper accumulation.                                      |
| MASH                         | Weight reduction, exercise and management of metabolic risk factors | Improves insulin resistance and metabolic liver injury.                 |

Important: treatment of the underlying disease can improve outcomes, but established cirrhosis and its complications may persist even after the original cause is controlled.

## **9. General care and prevention**

Patients with cirrhosis require ongoing care.

### **Nutrition**

- Provide adequate calories and protein.
- Avoid prolonged fasting.
- Consider a late-evening snack to reduce overnight catabolism.
- Assess for vitamin and mineral deficiencies.
- Refer for nutritional support when malnutrition is present.

### **Vaccination**

Assess eligibility for:

- Hepatitis A vaccination.
- Hepatitis B vaccination if non-immune.
- Influenza vaccination.
- Pneumococcal vaccination.
- Other routine vaccinations according to national recommendations.

### **Medication precautions**

Avoid or carefully assess:

- NSAIDs, because they can cause renal hypoperfusion, sodium retention and AKI.
- Unnecessary sedatives and benzodiazepines, because they may precipitate or worsen encephalopathy.
- Unnecessary hepatotoxic drugs.
- Excessive doses of paracetamol.

### **Surveillance**

Patients need:

- Regular assessment of liver function and renal function.
- Surveillance for hepatocellular carcinoma every six months.
- Assessment for portal hypertension and varices.
- Monitoring for nutritional deficiencies and sarcopenia.
- Review for liver transplantation when indicated.

# **10. Liver transplantation**

Cirrhosis causes irreversible architectural changes.

Although treating the underlying cause may slow progression and sometimes improve liver function, advanced cirrhosis may continue to deteriorate.

Liver transplantation replaces the diseased liver with a functioning donor liver.

Consider referral when patients develop:

- Decompensated cirrhosis.
- Recurrent ascites.
- Recurrent variceal haemorrhage.
- Recurrent hepatic encephalopathy.
- HRS.
- HCC within transplant eligibility criteria.
- Other evidence of progressive liver failure.

Do not wait until the patient is critically ill before considering transplantation assessment.

# **11. When do we discharge, admit or refer?**

This is where all the previous knowledge comes together.

Outpatient management

**Compensated cirrhosis or stable decompensated disease**

Appropriate when the patient:

- Has stable vital signs.
- Has no active gastrointestinal bleeding.
- Has no overt encephalopathy.
- Has no suspected SBP or AKI.
- Has manageable ascites.
- Can take oral medication and attend follow-up.

Ensure the underlying cause is addressed and surveillance is arranged.

Hospital admission

**New or worsening decompensation**

Admit patients with:

- New-onset or worsening ascites requiring assessment.
- Suspected SBP.
- New hepatic encephalopathy.
- AKI or significant electrolyte abnormalities.
- Jaundice with acute deterioration.
- Suspected gastrointestinal bleeding.
- Significant infection.

Urgent referral / ICU

**Life-threatening complications**

Urgent escalation for:

- Massive variceal bleeding or haemorrhagic shock.
- Grade III–IV hepatic encephalopathy or inability to protect the airway.
- Septic shock.
- Severe AKI or suspected HRS-AKI.
- Acute respiratory failure.
- ACLF with organ failure.
- Uncontrolled complications requiring endoscopy, TIPS, dialysis or transplantation assessment.

**A practical rule:** A patient with cirrhosis who suddenly becomes confused, develops abdominal pain, has fever, produces less urine or vomits blood should be considered to have a potentially serious complication until proven otherwise.

# **12. Clinical approach: a patient presenting with suspected cirrhosis**

Here is the approach I want you to internalise.

1. **Assess ABCDE and stability.**

   Look for shock, active bleeding, hypoxaemia, altered consciousness and severe infection. Stabilise immediately if necessary.
2. **Take a focused history.**

   Ask about alcohol, hepatitis exposure, medications, metabolic disease, previous jaundice, abdominal distension, haematemesis, melaena and confusion.
3. **Perform a targeted examination.**

   Look for jaundice, spider naevi, palmar erythema, ascites, peripheral oedema, hepatosplenomegaly, muscle wasting and asterixis.
4. **Request investigations.**

   FBC, liver tests, albumin, INR, renal function, electrolytes, hepatitis testing and abdominal ultrasound. Perform diagnostic paracentesis if ascites is present and accessible.
5. **Establish the diagnosis and cause.**

   Combine clinical, laboratory, imaging and non-invasive fibrosis findings. Investigate the underlying aetiology.
6. **Stage the disease.**

   Distinguish compensated from decompensated cirrhosis. Calculate Child-Pugh and MELD-Na when appropriate.
7. **Look actively for complications.**

   Assess for ascites, SBP, varices, hepatic encephalopathy, renal dysfunction and HCC.
8. **Treat the underlying cause and complications.**

   Select treatment according to the specific problem, monitor response and avoid precipitating factors.
9. **Decide disposition.**

   Discharge stable patients with a clear follow-up plan, admit decompensated patients and urgently refer patients with complications beyond the facility's capacity.

# **13. Important corrections to your Rwanda 2022 notes**

There are several points I want you to remember because they matter in actual clinical practice.

| Your supplied notes                           | Important clinical clarification                                                                                                                                      |
| --------------------------------------------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
| Protein restriction in hepatic encephalopathy | Routine protein restriction is discouraged. Maintain adequate protein intake.                                                                                         |
| SBP: WBC above 250                            | The diagnostic criterion is ascitic PMN ≥250 cells/mm³, not simply total WBC.                                                                                         |
| Albumin for SBP: 1 g/kg TDS                   | The standard regimen is 1.5 g/kg on day 1 and 1 g/kg on day 3.                                                                                                        |
| Lactulose 30 mL once or twice daily           | Acute overt encephalopathy often requires more frequent initial dosing, followed by titration to 2–3 soft stools daily.                                               |
| Historical HRS types 1 and 2                  | Current terminology includes HRS-AKI, HRS-AKD and HRS-CKD.                                                                                                            |
| Propranolol for variceal bleeding             | Propranolol is for prevention, not immediate control of active bleeding. Acute bleeding requires vasoactive medication, antibiotics and urgent endoscopic management. |
| Creatinine ≥1.5 mg/dL for renal impairment    | Use modern AKI criteria based on change from baseline, not only an absolute creatinine threshold.                                                                     |
| Albumin after every paracentesis              | It is particularly indicated after removal of more than 5 L; individualise smaller-volume cases.                                                                      |
| Fluid restriction for all ascites             | Not routinely necessary. Consider it in significant hyponatraemia.                                                                                                    |

These updates are supported by the AASLD ascites/SBP/HRS guidance, Baveno VII portal hypertension consensus and the newer ACG hepatic encephalopathy guideline.&#x20;

# **1. Understanding shock**

## **1.1 Definition**

Shock is an acute, life-threatening circulatory failure in which the cardiovascular system cannot deliver sufficient oxygen to meet the metabolic requirements of tissues.

This results in inadequate tissue perfusion, cellular dysfunction and, if prolonged, multiple organ failure and death.

Let's understand what this means.

Your organs require a continuous supply of oxygen to produce ATP through aerobic metabolism.

When tissue perfusion becomes inadequate:

1. Cells receive insufficient oxygen.
2. Oxidative phosphorylation becomes impaired.
3. Cells increasingly depend on anaerobic metabolism.
4. Lactate accumulates and metabolic acidosis may develop.
5. Cellular membrane pumps begin to fail.
6. Cellular swelling, inflammation and tissue injury occur.
7. If the process continues, organs begin to fail.

This explains why shock is not simply low blood pressure.

**A patient can be in shock even when their blood pressure is still normal.**

For example, a patient with early septic shock may have profound tissue hypoperfusion while maintaining blood pressure through compensatory tachycardia and vasoconstriction.

## **1.2 Understanding the four determinants of circulation**

Before classifying shock, understand four physiological concepts.

**1. Preload**

The amount of blood filling the ventricles before contraction. It determines myocardial stretch and contributes to stroke volume.

**2. Contractility**

The intrinsic ability of the myocardium to contract and eject blood.

**3. Afterload**

The resistance or pressure the ventricles must overcome to eject blood. Systemic vascular resistance (SVR) is an important determinant of left ventricular afterload.

**4. Cardiac output**

The volume of blood pumped by the heart per minute.

\\[ CO = HR \times SV \\]

CO = cardiac output; HR = heart rate; SV = stroke volume.

Now connect these concepts to oxygen delivery.

\\[ DO_2 = CO \times CaO_2 \times 10 \\]

Where:

- DO₂ = oxygen delivery.
- CO = cardiac output.
- CaO₂ = arterial oxygen content.

This tells you something important: oxygen delivery can fall because the heart pumps too little blood, because there is insufficient circulating volume, or because the blood carries insufficient oxygen.

## **1.3 The four categories of shock**

There are four major mechanisms.

**1. Hypovolemic shock**

There is insufficient circulating blood volume.

Examples: haemorrhage, severe diarrhoea, vomiting, burns and dehydration.

[A nurse is caring for an adolescent who has been admitted | Nursing Exam](https://images.openai.com/static-rsc-4/LQ1wu9Uh2hCyqMNQpchxYjnhZMhyW3AUX7cockv_VtNDGE279hAPFVv10-HOWSOVD4uL7oaWXezRxGGCCdq6SICZBBANFEneU8jlFnM4ahXkruBuE1-J6HTqaQanxoLjRf1B-fBCnEsGpCvJxUSd9jdodNnAxrUAVEKTR7vEMzc?purpose=inline)

**2. Distributive shock**

Blood vessels become excessively dilated, and blood is distributed abnormally. Effective circulating volume falls.

Examples: sepsis, anaphylaxis and neurogenic shock.

**3. Cardiogenic shock**

The heart fails to pump enough blood despite having adequate circulating volume.

A mechanical obstruction prevents adequate cardiac filling or blood ejection.

Examples: massive pulmonary embolism, cardiac tamponade and tension pneumothorax.

## **1.4 Understanding the haemodynamic differences**

| Parameter      | Hypovolemic | Distributive      | Cardiogenic | Obstructive |
| -------------- | ----------- | ----------------- | ----------- | ----------- |
| Preload        | ↓           | Often ↓           | Often ↑     | Often ↓     |
| SVR            | ↑           | ↓                 | ↑           | ↑           |
| Cardiac output | ↓           | Variable, often ↓ | ↓           | ↓           |

These are typical patterns, not absolute rules. For example, early distributive shock may have increased cardiac output.

**The central distinction:**

- Hypovolemic: not enough fluid or blood.
- Distributive: the vascular system has lost its normal tone.
- Cardiogenic: the pump is failing.
- Obstructive: something is mechanically preventing circulation.

This distinction determines treatment. Giving large volumes of fluid to someone with cardiogenic shock and pulmonary oedema can make them worse. Giving only vasopressors to someone with uncontrolled haemorrhage does not replace the lost blood.

# **2. How do you recognise shock?**

This is where clinical diagnosis begins.

## **2.1. Common symptoms and signs**

Your Rwanda guideline lists several important clinical features. Let's understand why they occur.

| Clinical finding         | Why it happens                                                                                                           |
| ------------------------ | ------------------------------------------------------------------------------------------------------------------------ |
| Tachycardia              | The sympathetic nervous system increases heart rate to compensate for reduced stroke volume and maintain cardiac output. |
| Cold, clammy skin        | Sympathetic vasoconstriction redirects blood towards vital organs, reducing skin perfusion.                              |
| Pallor                   | Reduced blood flow through the skin and peripheral vasoconstriction.                                                     |
| Delayed capillary refill | Peripheral tissues receive inadequate blood flow.                                                                        |
| Weak peripheral pulse    | Reduced stroke volume and peripheral perfusion.                                                                          |
| Narrow pulse pressure    | Often caused by reduced stroke volume and compensatory vasoconstriction.                                                 |
| Hypotension              | Circulatory compensation is no longer sufficient to maintain arterial pressure.                                          |
| Confusion or agitation   | Reduced cerebral perfusion and oxygen delivery.                                                                          |
| Oliguria                 | Reduced renal perfusion activates the renin-angiotensin-aldosterone system and increases water and sodium retention.     |
| Tachypnoea               | Compensation for metabolic acidosis, increased oxygen demand or respiratory dysfunction.                                 |

### **Important: Is hypotension necessary to diagnose shock?**

No.

A patient may have:

- Tachycardia.
- Cold extremities.
- Delayed capillary refill.
- Altered mental status.
- Reduced urine output.

Yet their blood pressure may still be normal.

This is called compensated shock.

Once compensatory mechanisms fail, hypotension develops. This is decompensated shock.

**Never wait for hypotension before recognising and treating shock.**

## **2.2. Understanding mean arterial pressure (MAP)**

MAP represents the average arterial pressure driving blood through the systemic circulation during one cardiac cycle.

\\[ MAP \approx \frac{SBP+2(DBP)}{3} \\]

For example, if BP is 90/60 mmHg:

\\[ MAP=\frac{90+2(60)}{3}=70 \\]

Important target

A MAP of approximately 65 mmHg is a common initial resuscitation target in adult septic shock.

However, this is not a universal target for every patient. Individualise according to perfusion, chronic hypertension and clinical response.

## **2.3. What happens to the organs?**

Shock affects the entire body.

- **Brain:** confusion, agitation, reduced consciousness and eventually coma.
- **Kidneys:** reduced renal blood flow causes oliguria and acute kidney injury.
- **Heart:** myocardial ischaemia and impaired contractility may develop.
- **Lungs:** pulmonary oedema or acute respiratory distress syndrome may develop, depending on the underlying mechanism.
- **Liver:** reduced perfusion causes hepatocellular injury and elevated liver enzymes.
- **Gastrointestinal tract:** intestinal hypoperfusion can cause mucosal injury and impaired gut function.
- **Blood and coagulation system:** severe systemic inflammation can activate coagulation pathways, resulting in disseminated intravascular coagulation (DIC).

This explains why shock is a multisystem emergency rather than simply a cardiovascular problem.

# **3. First approach to ANY patient in shock**

Before identifying the type, stabilise the patient.

I want you to develop a routine that you can use every time.

## **3.1. ABCDE assessment**

**A – Airway**

Is the airway patent? Can the patient speak? Is there obstruction, facial swelling, vomitus or reduced consciousness?

If the airway is threatened, secure it urgently.

**B – Breathing**

Assess respiratory rate, chest movement, work of breathing and oxygen saturation.

Give supplemental oxygen if hypoxaemic or in respiratory distress. Assist ventilation if the patient cannot maintain adequate ventilation or oxygenation.

**C – Circulation**

Check pulse, blood pressure, capillary refill, skin temperature and peripheral perfusion.

Establish two large-bore IV lines, preferably 14–16G in an adult. If IV access cannot be obtained rapidly, consider intraosseous access.

Start appropriate resuscitation according to the suspected shock mechanism.

**D – Disability**

Assess consciousness using AVPU or GCS.

Check bedside blood glucose immediately. Hypoglycaemia can cause altered consciousness and must be corrected.

**E – Exposure**

Examine the entire patient for bleeding, burns, rash, urticaria, signs of infection, trauma, dehydration and peripheral oedema.

Prevent hypothermia.

## **3.2. Immediate monitoring**

Monitor:

- Heart rate and rhythm.
- Blood pressure and MAP.
- Respiratory rate.
- Oxygen saturation.
- Temperature.
- Capillary refill time.
- Consciousness.
- Urine output, ideally hourly in severe shock.

Insert a urinary catheter when indicated to monitor output accurately, unless contraindicated.

**Urine output target:** generally at least 0.5 mL/kg/hour in adults.

Why is urine output important?

The kidneys are highly dependent on adequate blood flow. A falling urine output can be an early indication that renal perfusion is inadequate, although it is not specific to shock.

## **3.3. Initial investigations**

Do not order every investigation blindly. Select tests that help identify the cause, assess organ damage and guide treatment.

| Investigation               | Why are we requesting it?                                                                                            |
| --------------------------- | -------------------------------------------------------------------------------------------------------------------- |
| FBC                         | Detect anaemia, blood loss clues, leukocytosis, leukopenia and thrombocytopenia.                                     |
| Urea and creatinine         | Assess renal function and possible acute kidney injury.                                                              |
| Electrolytes                | Identify abnormalities such as hyperkalaemia and sodium disturbances.                                                |
| Blood glucose               | Detect hypoglycaemia or hyperglycaemia.                                                                              |
| Lactate                     | Assess tissue hypoperfusion and metabolic stress; trend it alongside clinical perfusion.                             |
| Blood gas                   | Assess pH, metabolic acidosis, oxygenation and ventilation, depending on sample type.                                |
| Liver function tests        | Identify hepatic injury and dysfunction.                                                                             |
| Coagulation profile         | Detect coagulation abnormalities and possible DIC.                                                                   |
| Blood group and cross-match | Prepare for transfusion if haemorrhage is suspected.                                                                 |
| Blood cultures              | Identify bloodstream infection before antibiotics, provided this does not significantly delay treatment.             |
| ECG                         | Identify myocardial infarction, arrhythmias and conduction abnormalities.                                            |
| Bedside ultrasound          | Assess cardiac function, pericardial effusion, ventricular filling, lung findings and possible fluid responsiveness. |

### **Understanding lactate**

Lactate is particularly important.

When oxygen delivery becomes inadequate relative to cellular demand, anaerobic metabolism may contribute to lactate accumulation.

However, lactate can also increase through other mechanisms, including adrenergic stimulation, impaired hepatic clearance and certain medications.

Therefore:

- Elevated lactate supports concern about physiological stress and possible hypoperfusion.
- A normal lactate does not exclude shock.
- A falling lactate can suggest improvement, but must be interpreted alongside clinical perfusion.

# **4. Management principles common to all shock**

There are interventions that apply to most patients, but the actual fluid and medication choices differ.

| Intervention                    | Clinical reason                                                                                |
| ------------------------------- | ---------------------------------------------------------------------------------------------- |
| Oxygen when indicated           | Correct hypoxaemia and improve arterial oxygen content.                                        |
| IV/IO access                    | Allow rapid administration of fluids, blood products and medications.                          |
| Appropriate fluid resuscitation | Restore effective circulating volume when volume depletion or fluid responsiveness is present. |
| Temperature control             | Prevent hypothermia, which can worsen coagulopathy and metabolic stress.                       |
| Urine output monitoring         | Assess renal perfusion and response to resuscitation.                                          |
| Treat underlying cause          | Resuscitation alone cannot correct the original pathology.                                     |
| ICU referral when indicated     | Provide advanced haemodynamic and respiratory support.                                         |

**A critical distinction:** Do not automatically give a large fluid bolus to every patient with shock.

- Hypovolemic shock usually requires volume replacement.
- Septic shock usually requires initial crystalloid resuscitation, followed by reassessment.
- Cardiogenic shock may worsen with excessive fluids.
- Obstructive shock requires relief of the obstruction.
- Anaphylactic shock requires immediate adrenaline, alongside appropriate fluids.

# **5. Hypovolemic shock**

Let's start with the first type.

## **5.1. Definition**

Hypovolemic shock is a state of circulatory failure caused by a significant reduction in intravascular circulating volume, resulting in inadequate venous return, reduced cardiac output and insufficient tissue perfusion.

In simple terms: **the patient does not have enough circulating blood volume to maintain adequate circulation.**

## **5.2. Causes**

There are two major categories.

**A. Haemorrhagic hypovolemia**

Actual blood loss:

- Trauma.
- Gastrointestinal bleeding.
- Postpartum haemorrhage.
- Ruptured ectopic pregnancy.
- Ruptured abdominal aortic aneurysm.

**B. Non-haemorrhagic hypovolemia**

Loss of fluid without equivalent loss of red blood cells:

- Severe diarrhoea.
- Persistent vomiting.
- Severe dehydration.
- Burns.
- Excessive diuresis.
- Third spacing, such as severe pancreatitis or bowel obstruction.

### **What is third spacing?**

Normally, fluid is distributed between the intravascular and extravascular compartments.

In conditions such as severe pancreatitis, inflammation increases vascular permeability. Fluid moves from blood vessels into surrounding tissues and body cavities.

The patient may have considerable total-body fluid but insufficient effective circulating volume.

That is why third spacing can produce hypovolemic shock.

## **5.3. Pathophysiology: what happens?**

Let's follow the sequence:

**Loss of circulating volume**

Haemorrhage, dehydration or fluid loss

**Reduced venous return**

Less blood returns to the heart

**Reduced preload**

Ventricles fill less before contraction

**Reduced stroke volume**

Less blood is ejected per heartbeat

**Reduced cardiac output**

**Tissue hypoperfusion and organ dysfunction**

The body tries to compensate by activating the sympathetic nervous system.

This produces:

- Tachycardia to increase cardiac output.
- Peripheral vasoconstriction to preserve blood flow to vital organs.
- Increased renin and aldosterone activity to retain sodium and water.
- Increased ADH secretion to retain water.

These mechanisms explain why the patient develops tachycardia, cold extremities and reduced urine output.

## **5.4. Clinical presentation**

Think of a patient who has had severe diarrhoea for three days or a patient with massive gastrointestinal bleeding.

You may find:

- Tachycardia.
- Weak peripheral pulses.
- Cold, clammy extremities.
- Pallor, especially with blood loss.
- Delayed capillary refill.
- Hypotension in advanced shock.
- Narrow pulse pressure.
- Reduced urine output.
- Confusion or reduced consciousness.

An important distinction: a patient with acute haemorrhage may initially have a normal haemoglobin because plasma and red cells are lost together. Do not exclude significant bleeding because the first haemoglobin result is normal.

## **5.5. Investigations**

- FBC: assess haemoglobin, haematocrit and platelets.
- Urea and creatinine: assess renal impairment.
- Electrolytes: identify sodium and potassium disturbances.
- Blood glucose: detect hypoglycaemia.
- Blood gas and lactate: assess metabolic acidosis and tissue hypoperfusion.
- Blood group and cross-match: prepare for transfusion.
- Bedside ultrasound: assess cardiac filling and look for free fluid in trauma or internal bleeding.
- Coagulation profile: particularly important in significant haemorrhage.

## **5.6. Management: what do we give and why?**

The most important principle is to replace what the patient has lost and stop ongoing losses.

### **A. Control the source**

If there is external bleeding, apply direct pressure and appropriate haemorrhage control.

If there is internal bleeding, urgent surgical or interventional assessment may be necessary.

You cannot successfully treat haemorrhagic shock simply by giving fluids while bleeding continues.

### **B. IV crystalloid fluids**

For significant non-haemorrhagic volume depletion, give isotonic crystalloid.

**Normal saline 0.9% or Ringer's lactate** can be used.

Your Rwanda 2022 guideline gives an initial regimen of 30 mL/kg over 30 minutes, with reassessment and further fluid according to response.

However, this should not be applied indiscriminately to every cause of hypovolemia. Give fluid in appropriate boluses and reassess blood pressure, perfusion, lung findings and urine output.

### **C. Blood transfusion**

In haemorrhagic shock, the patient is losing both plasma and red blood cells.

Crystalloids restore some circulating volume but do not replace oxygen-carrying capacity or clotting components.

Therefore, significant ongoing haemorrhage requires blood products, often through a major haemorrhage protocol, rather than repeated large crystalloid infusions.

### **D. Monitoring**

The initial goals include:

- Improving mental status.
- Improving peripheral perfusion.
- MAP generally at least 65 mmHg.
- Urine output at least 0.5 mL/kg/hour.
- Improving lactate trend.

### **E. Referral**

Urgently refer for surgical intervention if there is uncontrolled internal bleeding, and to ICU if the patient requires ongoing circulatory or respiratory support.

# **2. Cardiogenic shock**

## **1. Definition**

Cardiogenic shock is a state of circulatory failure caused by the heart's inability to pump enough blood to meet the metabolic demands of the body.

The central problem is **pump failure**, not necessarily a lack of circulating blood volume.

## **2. Causes**

| Category                 | Examples                                                                         |
| ------------------------ | -------------------------------------------------------------------------------- |
| Myocardial damage        | Acute myocardial infarction, myocarditis, cardiomyopathy                         |
| Arrhythmias              | Severe bradycardia, ventricular tachycardia, ventricular fibrillation            |
| Mechanical complications | Papillary muscle rupture, ventricular septal rupture, free-wall rupture after MI |
| Valvular disease         | Acute severe mitral or aortic regurgitation                                      |
| Advanced cardiac disease | End-stage heart failure                                                          |

**Most important cause to remember:** acute myocardial infarction (MI). When a large portion of the myocardium becomes ischaemic or necrotic, the ventricle loses its ability to contract effectively.

## **3. Pathophysiology**

Let's follow the sequence.

**Myocardial dysfunction**

The heart muscle cannot contract effectively

**Reduced stroke volume**

Less blood ejected with each heartbeat

**Reduced cardiac output**

CO = heart rate × stroke volume

**Reduced tissue perfusion**

Brain, kidneys, liver and other organs receive inadequate blood flow

**Organ dysfunction and potentially death**

But there is another important process.

### **Why does cardiogenic shock cause pulmonary oedema?**

Imagine the left ventricle cannot pump blood forward effectively.

1. Blood accumulates in the left ventricle.
2. Left ventricular end-diastolic pressure increases.
3. Pressure is transmitted backwards to the left atrium.
4. Pulmonary venous pressure increases.
5. Hydrostatic pressure in pulmonary capillaries rises.
6. Fluid moves into the lung interstitium and alveoli.

The result is **pulmonary congestion and potentially pulmonary oedema**.

This explains why a patient with cardiogenic shock may have:

- Severe dyspnoea.
- Orthopnoea.
- Basal lung crackles.
- Hypoxaemia.
- Pink frothy sputum in severe pulmonary oedema.

### **Why does the skin become cold?**

The body detects reduced cardiac output and activates the sympathetic nervous system.

This causes peripheral vasoconstriction to preserve blood flow to vital organs, particularly the brain and heart.

Consequently:

- Skin becomes cold and clammy.
- Peripheral pulses become weak.
- Capillary refill is delayed.
- Systemic vascular resistance increases.

Unfortunately, increased vascular resistance also increases the workload against which the failing left ventricle must pump.

This can worsen cardiac output.

## **4. Clinical presentation**

A useful way to understand cardiogenic shock is to classify patients according to perfusion and congestion.

### **Cold versus warm; wet versus dry**

**COLD**

# **↓ Perfusion**

Cold extremities, delayed CRT, oliguria, confusion, weak pulses.

**WARM**

# **Adequate perfusion**

Warm extremities and relatively preserved peripheral perfusion.

**WET**

# **Congestion**

Raised JVP, pulmonary crackles, orthopnoea, peripheral oedema.

**DRY**

# **No congestion**

No significant pulmonary or systemic fluid overload.

**The classic cardiogenic shock presentation is cold and wet:** poor tissue perfusion together with fluid congestion.

### **Important clinical findings**

| Finding               | Explanation                                                                       |
| --------------------- | --------------------------------------------------------------------------------- |
| Hypotension           | Reduced cardiac output                                                            |
| Tachycardia           | Sympathetic compensation                                                          |
| Narrow pulse pressure | Reduced stroke volume                                                             |
| Raised JVP            | Increased right-sided filling pressure, often due to congestion or RV dysfunction |
| Basal crackles        | Pulmonary fluid accumulation                                                      |
| Oliguria              | Reduced renal perfusion                                                           |
| Confusion             | Reduced cerebral perfusion                                                        |
| Peripheral oedema     | Increased systemic venous pressure and fluid retention                            |

Remember: cardiogenic shock can occur without obvious pulmonary crackles, particularly in right ventricular infarction or predominantly right-sided pump failure.

## **5. Investigations**

| Investigation                  | Why do we request it?                                                                  |
| ------------------------------ | -------------------------------------------------------------------------------------- |
| ECG                            | Identify MI, arrhythmias and conduction abnormalities                                  |
| Troponin                       | Detect myocardial injury                                                               |
| Echocardiography               | Assess ventricular function, valves, mechanical complications and pericardial effusion |
| Chest X-ray                    | Identify pulmonary congestion, oedema and alternative thoracic causes                  |
| Blood gas and lactate          | Assess acidosis, oxygenation and tissue hypoperfusion                                  |
| FBC                            | Detect anaemia or infection                                                            |
| Urea, creatinine, electrolytes | Assess renal injury and electrolyte abnormalities                                      |
| Liver function tests           | Detect hepatic congestion or hypoperfusion                                             |
| BNP/NT-proBNP                  | Support assessment of heart failure, although not diagnostic of shock                  |

**Echocardiography is particularly important.** It helps determine whether the problem is left ventricular failure, right ventricular failure, severe valvular disease, or a mechanical complication.

## **6. Management**

Cardiogenic shock is a medical emergency. The patient needs urgent senior, cardiology and critical-care involvement.

### **A. Initial stabilisation**

1. Assess airway, breathing and circulation.
2. Give oxygen if hypoxaemic or in respiratory distress; support ventilation when necessary.
3. Establish IV access.
4. Continuous ECG, BP and oxygen saturation monitoring.
5. Monitor urine output using a urinary catheter when appropriate.
6. Obtain urgent ECG and bedside echocardiography.

### **B. Treat the underlying cause**

This is essential.

- **Acute MI:** urgent coronary reperfusion, usually PCI where available.
- **Severe bradycardia:** treat according to the bradycardia algorithm; pacing may be required.
- **Unstable tachyarrhythmia:** urgent synchronised cardioversion where indicated.
- **Acute mechanical complication:** urgent cardiothoracic/surgical assessment.
- **Severe valvular dysfunction:** urgent specialist intervention.

### **C. Understand the drugs**

There are two important medications to distinguish.

**Norepinephrine**

Vasopressor

- Causes predominantly alpha-1-mediated vasoconstriction.
- Increases systemic vascular resistance.
- Raises blood pressure and helps restore organ perfusion pressure.
- Used when hypotension is present.

**Dobutamine**

Inotrope

- Stimulates beta-1 receptors.
- Increases myocardial contractility.
- Improves stroke volume and cardiac output.
- Can lower blood pressure because it also causes some vasodilation.

**Clinical distinction:** norepinephrine helps maintain blood pressure; dobutamine helps a poorly contracting heart pump more effectively. They may be used together in selected patients.

Typical adult infusion ranges, administered in a monitored critical-care setting:

| Drug           | Common starting dose       |
| -------------- | -------------------------- |
| Norepinephrine | 0.05–0.1 micrograms/kg/min |
| Dobutamine     | 2–5 micrograms/kg/min      |

Both require titration according to response and local protocols. Monitor for arrhythmias, ischaemia and changes in blood pressure.&#x20;

### **D. Should we give IV fluids?**

This is a very important examination and clinical question.

**Do not automatically give large fluid boluses in cardiogenic shock.**

The heart is already failing to pump effectively. Adding more fluid may increase filling pressures and worsen pulmonary oedema.

However, some patients, particularly those with right ventricular infarction or genuine preload depletion, may benefit from cautious fluid administration.

For example:

- Consider a small 250 mL isotonic crystalloid bolus if there is evidence of inadequate preload and no pulmonary congestion.
- Reassess BP, JVP, lung findings, perfusion and ultrasound immediately.
- Stop if congestion or respiratory distress worsens.

### **E. What about furosemide?**

Furosemide is a loop diuretic. It promotes sodium and water excretion, reducing fluid overload.

Consider IV furosemide when the patient has significant pulmonary or systemic congestion and can tolerate diuresis.

However, it is **not a treatment for the low cardiac output itself**. In a profoundly hypotensive, poorly perfused patient, indiscriminate diuresis can worsen renal and systemic perfusion.

## **7. When do we refer or admit?**

Emergency admission

Every patient with suspected cardiogenic shock requires emergency hospital management, usually in ICU or a high-dependency setting.

Urgent referral is particularly important when there is:

- Persistent hypotension or signs of hypoperfusion.
- Rising lactate or worsening metabolic acidosis.
- Acute MI or suspected mechanical complication.
- Severe pulmonary oedema or respiratory failure.
- Serious arrhythmia.
- Oliguria or worsening renal function.
- Need for vasopressors, inotropes or ventilatory support.

**Discharge is not appropriate for cardiogenic shock.**

# **3. Septic shock**

Septic shock is one of the most important forms of shock in clinical medicine. It is particularly important because a patient can develop severe circulatory failure from an infection even when there is no primary cardiac pump failure or major blood loss.

Our focus is to recognise it early, identify the source of infection, start treatment promptly, and know when the patient needs ICU care.

## **1. Definitions**

**Sepsis:** Life-threatening organ dysfunction caused by a dysregulated host response to infection.

**Septic shock:** A severe subset of sepsis in which profound circulatory and cellular/metabolic abnormalities occur, associated with a substantially increased risk of mortality.

In adults, the Sepsis-3 clinical definition of septic shock includes:

- Need for vasopressors to maintain a mean arterial pressure (MAP) of at least 65 mmHg; and
- Serum lactate greater than 2 mmol/L despite adequate fluid resuscitation.

Do not wait for these criteria before treating a patient with suspected sepsis and signs of hypoperfusion.

## **2. Causes and sources of infection**

Almost any infection can cause sepsis. The most important task is to identify the source.

| Source                 | Possible infections / organisms                                              |
| ---------------------- | ---------------------------------------------------------------------------- |
| Lungs                  | Pneumonia; *Streptococcus pneumoniae*, *Klebsiella*, *Staphylococcus aureus* |
| Urinary tract          | Pyelonephritis, complicated UTI; *E. coli*, *Klebsiella*                     |
| Abdomen                | Peritonitis, perforated bowel, cholangitis, intra-abdominal abscess          |
| Skin and soft tissue   | Cellulitis, necrotising fasciitis, infected wounds                           |
| Central nervous system | Meningitis, encephalitis                                                     |
| Bloodstream            | Catheter-related infection, endocarditis                                     |

Other important organisms include *Neisseria meningitidis*, group A streptococci and enterococci.

**Clinical principle:** Sepsis is not a diagnosis of the infection source alone. It is infection accompanied by life-threatening organ dysfunction.

## **3. Pathophysiology: how does infection cause shock?**

This is the most important concept to understand.

In septic shock, the immune response becomes dysregulated. Instead of controlling infection without harming the host, the inflammatory response produces widespread physiological disturbances.

**Infection**

Bacteria, viruses or fungi trigger immune activation

**Dysregulated inflammatory response**

Inflammatory mediators, including cytokines, are released

**Three major physiological effects**

**Vasodilation**

Reduced SVR and blood pressure

**Capillary leakage**

Fluid leaves vessels, reducing effective circulating volume

**Cardiac dysfunction**

Myocardial depression may reduce cardiac output

**Tissue hypoperfusion and cellular dysfunction**

Organ injury, metabolic abnormalities and potentially multiple organ failure

### **Understand the three effects**

**A. Vasodilation**

Inflammatory mediators increase nitric oxide production and relax vascular smooth muscle.

Consequently:

- Blood vessels dilate.
- Systemic vascular resistance decreases.
- Blood pressure falls.
- The effective circulating volume becomes inadequate relative to the enlarged vascular capacity.

This is why septic shock is classified as distributive shock.

**B. Increased capillary permeability**

Inflammation damages the endothelial barrier lining blood vessels.

Fluid moves from the intravascular compartment into surrounding tissues.

This causes:

- Reduced effective circulating volume.
- Tissue oedema.
- Potential worsening of pulmonary oxygen exchange if lung tissue is involved.

**C. Myocardial depression**

Inflammatory mediators can impair myocardial contractility.

The heart may therefore pump less effectively, adding a cardiogenic component to septic shock.

### **Why can septic patients initially have warm extremities?**

In early distributive shock, peripheral vasodilation can produce:

- Warm skin.
- Bounding pulses.
- Wide pulse pressure.

As shock progresses, cardiac output may fall and peripheral vasoconstriction may develop, producing cold extremities.

Therefore, **a warm patient can still be in shock.**

## **4. Clinical presentation**

Sepsis can present with many different clinical features. Look for evidence of infection together with evidence of organ dysfunction.

### **A. General features**

- Fever or hypothermia.
- Chills and rigors.
- Malaise and fatigue.
- Tachycardia.
- Tachypnoea.
- Hypotension.
- Altered mental status.
- Poor peripheral perfusion.
- Oliguria.

Important: Some severely septic patients, especially older or immunocompromised patients, may not develop fever.

### **B. Evidence of organ dysfunction**

| Organ system   | Clinical manifestations                       | Why it happens                                                                           |
| -------------- | --------------------------------------------- | ---------------------------------------------------------------------------------------- |
| Brain          | Confusion, agitation, reduced consciousness   | Cerebral dysfunction from inflammation and impaired perfusion                            |
| Kidneys        | Oliguria, rising creatinine                   | Renal injury from impaired perfusion and inflammatory damage                             |
| Lungs          | Hypoxaemia, respiratory distress, ARDS        | Inflammatory injury increases pulmonary capillary permeability                           |
| Cardiovascular | Hypotension, weak pulses                      | Vasodilation, capillary leakage and sometimes myocardial depression                      |
| Liver          | Jaundice, elevated bilirubin                  | Hepatic dysfunction and impaired perfusion                                               |
| Haematological | Thrombocytopenia, prolonged coagulation tests | Inflammatory activation of coagulation and consumption of platelets and clotting factors |

**ARDS** means acute respiratory distress syndrome. It is a form of acute inflammatory lung injury causing increased permeability, pulmonary oedema and impaired oxygenation.

## **5. How do we recognise sepsis?**

The most important approach is to identify infection and actively look for organ dysfunction.

### **qSOFA score**

The quick Sequential Organ Failure Assessment (qSOFA) is a bedside warning tool.

| Parameter                | Score |
| ------------------------ | ----- |
| Respiratory rate ≥22/min | 1     |
| Systolic BP ≤100 mmHg    | 1     |
| Altered mentation        | 1     |

A score of 2 or more identifies a patient at increased risk of poor outcomes.

However, **qSOFA is not a diagnostic test and must not be used alone to screen out sepsis.** A score of 0 or 1 does not exclude sepsis.

### **SOFA score**

The Sequential Organ Failure Assessment (SOFA) evaluates dysfunction in six systems:

1. Respiratory.
2. Coagulation.
3. Liver.
4. Cardiovascular.
5. Central nervous system.
6. Renal.

An acute increase of at least 2 points in SOFA in the context of infection supports the diagnosis of sepsis.

For clinical practice, you do not need to calculate SOFA before starting treatment in an unstable patient.

## **6. Investigations**

The objectives are to:

1. Identify the infection source.
2. Assess organ dysfunction.
3. Assess the severity of circulatory failure.
4. Identify the causative organism.
5. Monitor response to treatment.

| Investigation                  | Why?                                                                                  |
| ------------------------------ | ------------------------------------------------------------------------------------- |
| FBC                            | Leukocytosis, leukopenia, anaemia and thrombocytopenia                                |
| CRP / procalcitonin            | Support assessment of inflammation; neither independently confirms or excludes sepsis |
| Blood cultures                 | Identify bloodstream pathogens and guide antibiotics                                  |
| Urine analysis and culture     | Investigate urinary infection                                                         |
| Sputum culture                 | Investigate respiratory infection where appropriate                                   |
| Urea, creatinine, electrolytes | Assess renal dysfunction and electrolyte abnormalities                                |
| Blood glucose                  | Detect hypoglycaemia or hyperglycaemia                                                |
| Lactate                        | Assess metabolic stress and possible tissue hypoperfusion                             |
| ABG/VBG                        | Assess acid-base status and lactate; ABG also assesses oxygenation                    |
| LFTs                           | Detect hepatic dysfunction                                                            |
| Coagulation profile            | Assess coagulopathy and DIC                                                           |
| Chest X-ray                    | Investigate pneumonia and pulmonary complications                                     |
| Ultrasound                     | Look for abdominal infection, obstruction, collections or other sources               |
| ECG                            | Identify arrhythmias and possible myocardial involvement                              |

### **Why is lactate important?**

When tissue oxygen delivery is inadequate, cells may increase anaerobic metabolism, producing lactate.

However, lactate can also rise because of:

- Increased adrenergic stimulation.
- Impaired hepatic clearance.
- Certain medications.
- Other metabolic disturbances.

Therefore, elevated lactate does not automatically prove tissue hypoxia, and normal lactate does not completely exclude shock.

**What matters is the clinical picture and lactate trend.**

## **7. Management of septic shock**

Time-critical emergency

The management has five major priorities:

1. Stabilise the patient.
2. Give appropriate antibiotics.
3. Restore circulation and tissue perfusion.
4. Control the infection source.
5. Monitor and support failing organs.

### **A. Initial resuscitation: ABCDE**

- Assess and secure the airway.
- Give oxygen when hypoxaemic or in respiratory distress.
- Establish two large-bore IV lines.
- Monitor BP, HR, RR, SpO₂, temperature and consciousness.
- Measure urine output.
- Check bedside glucose.
- Obtain blood tests and cultures.

Do not delay resuscitation while waiting for investigation results.

### **B. Antibiotics**

Ideally within 1 hour

In septic shock, administer appropriate broad-spectrum IV antibiotics immediately, ideally within one hour of recognising the condition.

Why?

Because ongoing bacterial infection drives the inflammatory response. Delaying effective antimicrobial treatment allows infection and organ dysfunction to progress.

**Before antibiotics:** Obtain blood cultures and relevant source cultures if this can be done without substantial delay.

Antibiotic selection depends on:

- Suspected infection source.
- Likely organisms.
- Community versus hospital acquisition.
- Previous antibiotic exposure.
- Local resistance patterns.
- Renal and hepatic function.

For example:

| Suspected source                    | Considerations                                                              |
| ----------------------------------- | --------------------------------------------------------------------------- |
| Severe community-acquired pneumonia | Cover typical respiratory pathogens and consider atypical organisms         |
| Complicated UTI / pyelonephritis    | Cover likely Gram-negative urinary pathogens                                |
| Intra-abdominal infection           | Cover Gram-negative organisms and anaerobes                                 |
| Skin and soft tissue infection      | Cover streptococci and staphylococci; consider MRSA when risk factors exist |
| Meningitis                          | Use a meningitis-specific empirical regimen urgently                        |

Do not assume one antibiotic regimen is appropriate for every septic patient. Adapt to the source and local protocols, then narrow treatment when culture results become available.

### **C. IV fluid resuscitation**

The 2026 Surviving Sepsis Campaign supports initial crystalloid resuscitation, commonly around **30 mL/kg within the first 3 hours** for adults with sepsis-induced hypoperfusion or septic shock.

Examples of crystalloids:

- Ringer's lactate (RL).
- 0.9% normal saline.

Balanced crystalloids such as RL are generally preferred when available.

But there is an important clinical distinction:

**Thirty millilitres/kg is an initial guide, not an instruction to give fluid blindly.**

After each bolus, reassess:

- BP and MAP.
- Heart rate.
- Capillary refill.
- Mental status.
- Urine output.
- Lung crackles and oxygen requirements.
- Evidence of fluid responsiveness.

A patient with pre-existing heart failure, renal failure or pulmonary oedema may tolerate fluids poorly.

If the patient remains hypotensive despite appropriate fluid resuscitation, do not keep giving fluid indefinitely. Start vasopressor support.
