# **Infective Endocarditis: Part 3**

## **Diagnosis and investigations**

The central principle is this: **infective endocarditis (IE) is diagnosed by combining clinical suspicion, blood cultures, cardiac imaging, and evidence of endocardial infection.**

No single finding is sufficient in every patient. For example, a patient can have IE without a clearly audible murmur, and an early echocardiogram may fail to show a vegetation.

Let's work through how you would investigate a patient suspected of having IE in clinical practice.

## **1. When should you suspect infective endocarditis?**

Think about IE when a patient has:

- Persistent or unexplained fever, particularly with no obvious source.
- Fever plus a new or changing cardiac murmur.
- Fever in someone with a prosthetic heart valve, previous IE, or known structural heart disease.
- Fever in a person who injects drugs.
- Unexplained stroke or systemic embolism, especially with fever.
- Persistent bacteraemia, particularly with organisms such as *Staphylococcus aureus* or *Enterococcus faecalis*.

**Important:** A patient does not need to have all these features. IE can present with fever alone, especially early in the disease.

## **2. Blood cultures: the most important microbiological investigation**

Blood cultures identify the organism responsible for the infection and determine which antibiotics are likely to work.

### **Why are blood cultures essential?**

IE usually involves bacteria continuously or intermittently entering the bloodstream from infected vegetations.

A vegetation is a mass of platelets, fibrin and microorganisms attached to the endocardium, usually a heart valve. Organisms can detach from this mass or be released into the blood, producing bacteraemia.

Blood cultures allow you to:

1. Identify the causative organism.
2. Determine antibiotic susceptibility.
3. Select targeted antibiotic treatment rather than relying indefinitely on empirical therapy.

### **How do you collect blood cultures?**

**For a patient with suspected IE**

1. Collect **three sets of blood cultures** from separate peripheral venepuncture sites.
2. Ideally collect them before administering antibiotics.
3. Each set usually includes an aerobic and an anaerobic bottle.
4. Use adequate blood volume according to the patient's age and the laboratory protocol.
5. Do not wait for fever spikes. Bacteraemia in IE is often continuous.

**What is a blood culture set?**

A set is a collection of bottles filled from one blood draw, commonly one aerobic and one anaerobic bottle.

Why collect separate sets? Because organisms recovered from multiple independent blood draws are more convincing evidence of genuine bacteraemia than growth from just one bottle, which may represent skin contamination.

**Why collect before antibiotics?**

Antibiotics can kill or suppress circulating bacteria, making cultures negative even when IE is present. This is why cultures should be collected first whenever it is safe to do so.

However, if the patient is haemodynamically unstable or septic, collect cultures rapidly and start appropriate IV antibiotics immediately. Do not delay life-saving treatment while trying to complete an ideal sampling schedule.

The 2023 European Society of Cardiology (ESC) guideline recommends at least three blood culture sets, collected approximately 30 minutes apart, before antibiotics when feasible. Each set should contain about 10 mL of blood, divided between aerobic and anaerobic bottles.

### **What if blood cultures are negative?**

This does **not** automatically exclude IE.

Possible explanations include:

- **Antibiotics given before cultures:** bacteria may have been suppressed or killed.
- **Fastidious organisms:** some bacteria are difficult to grow using routine culture methods.
- **Fungal IE:** fungal organisms may require specialised investigation.

This is called *blood culture-negative infective endocarditis*.

Depending on the patient's exposure history and local epidemiology, further tests may include serology or molecular testing for organisms such as *Coxiella burnetii*, *Bartonella* species and *Tropheryma whipplei*. If cultures remain negative after 48 hours despite strong clinical suspicion, discuss the case with microbiology or an infectious disease specialist.

## **3. Echocardiography: looking directly at the heart**

Blood cultures tell you which organism is circulating. Echocardiography helps you establish whether the heart valves or other endocardial structures are infected.

The two main techniques are:

- Transthoracic echocardiography (TTE).
- Transoesophageal echocardiography (TEE), also called TOE in some guidelines.

### **A. Transthoracic echocardiography (TTE)**

The ultrasound probe is placed on the patient's chest, and sound waves pass through the chest wall to produce images of the heart.

It allows you to assess:

- Vegetations on valves.
- Valve regurgitation or stenosis.
- Ventricular function.
- Cardiac chamber size.
- Some complications, such as large abscesses.

**Why is TTE performed first?**

It is non-invasive, widely available, relatively quick and does not require passing a probe into the oesophagus.

However, it has an important limitation: small vegetations and lesions around prosthetic valves may be difficult to see.

### **B. Transoesophageal echocardiography (TEE)**

A specialised ultrasound probe is passed through the mouth into the oesophagus.

Why does this improve the images?

The oesophagus lies directly behind the heart. Therefore, the probe can obtain detailed images without the chest wall and lungs interfering as much.

TEE is particularly useful for detecting:

- Small vegetations.
- Prosthetic valve infection.
- Perivalvular abscesses.
- Valve perforation.
- Prosthetic valve dehiscence.
- Infection involving intracardiac devices.

### **TTE versus TEE**

| Feature | TTE | TEE |
| --- | --- | --- |
| Probe position | Chest wall | Oesophagus |
| Invasiveness | Non-invasive | Semi-invasive |
| Image detail | Generally lower | Generally higher |
| Small vegetations | May miss them | Better detection |
| Prosthetic valves | Limited sensitivity | Better assessment |
| Perivalvular abscess | May miss it | Better assessment |

### **When should you request TEE?**

According to the 2023 ESC guideline:

1. TTE is negative or inconclusive but clinical suspicion remains high.
2. The patient has a prosthetic heart valve.
3. The patient has an intracardiac device and IE is suspected.
4. TTE is positive and you need to assess complications, except in selected isolated right-sided native-valve cases with unequivocal, good-quality TTE findings.

If the initial examination is negative or inconclusive but suspicion remains high, repeat TTE and/or TEE after approximately **5–7 days**.

### **What exactly are you looking for on echocardiography?**

**1. Vegetation**

A mobile or irregular mass attached to a valve or other endocardial structure.

Remember its composition:

- Platelets.
- Fibrin.
- Microorganisms.
- Inflammatory cells.

Why is it dangerous?

It can damage the valve, cause regurgitation and break off, producing emboli.

**2. Valve perforation**

The infection destroys part of a valve leaflet, creating an abnormal opening.

Blood can then flow backwards through the damaged valve, causing acute regurgitation.

**3. Perivalvular abscess**

An abscess is a collection of pus within tissue surrounding the valve.

It is particularly important in aortic valve IE because the infection can extend into nearby cardiac tissue and interfere with the electrical conduction system.

This can produce new conduction abnormalities, such as PR prolongation or AV block.

**4. Prosthetic valve dehiscence**

The infected process can damage the tissue anchoring a prosthetic valve, causing partial separation from the surrounding tissue.

This can produce severe leakage around the prosthetic valve.

These echocardiographic findings are important because they demonstrate structural damage caused by IE, not simply the presence of bacteria in the bloodstream.

## **4. Other investigations**

Echocardiography and blood cultures are central, but you also need investigations to assess the severity of infection, organ damage and complications.

| Investigation | What you may find | Why it matters |
| --- | --- | --- |
| Full blood count | Anaemia, raised or sometimes low WBC, thrombocytopenia | Assesses inflammation, chronic disease and severity |
| CRP and ESR | Often elevated | Supports inflammation and helps monitor response |
| Urea, creatinine, electrolytes | Raised creatinine, electrolyte abnormalities | Detects renal injury and guides antibiotic dosing |
| Urinalysis | Haematuria, proteinuria, red cell casts | Suggests glomerulonephritis |
| Liver function tests | Abnormal liver enzymes or bilirubin | Assesses organ dysfunction or congestion |
| ECG | PR prolongation, AV block, arrhythmias | May indicate conduction system involvement or cardiac complications |
| Chest X-ray | Pulmonary oedema or pulmonary infiltrates | Assesses heart failure or septic pulmonary emboli |

### **Why is the ECG important?**

Remember the anatomy: the AV node and His bundle lie close to the aortic valve and membranous interventricular septum.

If an aortic valve infection extends into surrounding tissue and forms an abscess, it may damage the conduction system.

The result may be:

- PR interval prolongation.
- First-degree AV block.
- Higher-degree AV block.
- Other rhythm abnormalities.

**Clinical warning:** New AV block in a patient with suspected or confirmed aortic valve IE should raise serious concern for a perivalvular abscess. It requires urgent specialist assessment.

### **Why investigate renal function and urine?**

IE can affect the kidneys in two important ways:

1. **Renal infarction:** a fragment of infected vegetation travels to a renal artery and blocks blood flow, producing renal tissue ischaemia.
2. **Immune-complex glomerulonephritis:** antibodies and microbial antigens form immune complexes that deposit in glomeruli, activating inflammation and damaging the filtration barrier.

The second mechanism can produce:

- Haematuria.
- Proteinuria.
- Red cell casts.
- Reduced renal function.

These findings help distinguish renal involvement from an isolated urinary tract infection.

## **5. Modified Duke criteria: putting the evidence together**

You may have a patient with fever, positive blood cultures and a vegetation on echocardiography. But how do you formally classify the likelihood of IE?

This is where the **Duke criteria** are useful.

They combine microbiological, imaging and clinical evidence to classify IE as:

- Definite IE.
- Possible IE.
- Rejected IE.

The criteria are not a substitute for clinical judgement. A patient can still require urgent treatment and specialist assessment before all criteria are fulfilled.

### **A. Major criteria**

Major criteria are findings that provide strong evidence of IE.

**Major criterion 1: Positive blood cultures**

Examples include:

- Typical IE organisms isolated from two or more separate blood culture sets.
- Persistent positive cultures meeting the specified microbiological requirements.
- Certain specific microbiological tests, such as evidence of *Coxiella burnetii* infection.

Typical organisms include:

- *Staphylococcus aureus*.
- Viridans group streptococci and other oral streptococci.
- *Streptococcus gallolyticus*.
- *Enterococcus faecalis*.
- HACEK organisms.

HACEK refers to a group of bacteria that can cause IE:

- *Haemophilus* species.
- *Aggregatibacter* species.
- *Cardiobacterium hominis*.
- *Eikenella corrodens*.
- *Kingella* species.

**Major criterion 2: Evidence of endocardial involvement on imaging**

Examples:

- Vegetation.
- Abscess.
- Pseudoaneurysm.
- Intracardiac fistula.
- Valve perforation.
- New significant valvular regurgitation.
- New partial dehiscence of a prosthetic valve.

Echocardiography is the usual first-line imaging method. Cardiac CT and selected nuclear imaging techniques can also demonstrate characteristic lesions.

### **B. Minor criteria**

Minor criteria are findings that support the diagnosis but are less specific.

| Minor criterion | Examples |
| --- | --- |
| Predisposition | Previous IE, prosthetic valve, structural heart disease, injection drug use |
| Fever | Temperature above 38°C |
| Vascular phenomena | Arterial emboli, septic pulmonary infarcts, Janeway lesions, intracranial haemorrhage |
| Immunological phenomena | Osler nodes, Roth spots, glomerulonephritis, positive rheumatoid factor |
| Microbiological evidence | Positive cultures that do not fulfil a major criterion |

Notice that many clinical features we discussed in Part 2 appear here.

For example:

- Janeway lesions are vascular phenomena.
- Osler nodes are immunological phenomena.
- Glomerulonephritis is an immunological phenomenon.
- Fever is a minor criterion.

### **C. How do you classify the patient?**

The 2023 ESC clinical criteria use the following combinations:

Definite IE

- Two major criteria.
- One major criterion plus at least three minor criteria.
- Five minor criteria.

Possible IE

- One major criterion plus one or two minor criteria.
- Three or four minor criteria.

Rejected IE

- The patient does not fulfil the criteria for definite or possible IE, or a convincing alternative diagnosis explains the presentation.

**Important distinction:** The 2023 Duke-ISCVID criteria and 2023 ESC criteria are related but not identical. They update the older Modified Duke framework and include additional microbiological and imaging evidence. In clinical practice, use the diagnostic framework adopted by your institution and specialist team.

## **6. What if echocardiography is negative but you still suspect IE?**

A negative echocardiogram does not always exclude IE.

Possible reasons include:

- The vegetation is too small to be detected.
- The infection is at an early stage.
- The vegetation is in a difficult-to-visualise location.
- Prosthetic material interferes with imaging.
- The infection involves surrounding tissue rather than producing an obvious vegetation.

What should you do?

1. Reassess the clinical probability of IE.
2. Review the quality of the initial echocardiogram.
3. Request TEE if it has not already been performed and suspicion remains high.
4. Repeat TTE or TEE after 5–7 days when appropriate.
5. Discuss cardiac CT or other advanced imaging with the specialist team if uncertainty persists, particularly with prosthetic valve infection.

Do not dismiss IE simply because the first TTE was normal.

## **7. A practical diagnostic approach at the bedside**

## **Suspected infective endocarditis**

**Clinical suspicion**

Fever, risk factors, murmur, embolic event or unexplained bacteraemia

**Collect three blood culture sets**

Before antibiotics, if this does not delay urgent treatment

**Request TTE**

Assess vegetations, valve function and cardiac complications

**If TTE is negative or inconclusive but suspicion remains high, request TEE**

Also assess prosthetic valves and suspected complications

**Integrate all findings**

Apply Duke/ESC criteria, assess complications and involve the specialist team

## **8. Test your clinical reasoning**

A 32-year-old man who injects drugs presents with five days of fever and chills. On examination, you find:

- Temperature: 39°C.
- A new pansystolic murmur at the lower left sternal border.
- Multiple small pulmonary infiltrates on chest X-ray.
- Blood cultures from two separate sets grow *Staphylococcus aureus*.
- TTE demonstrates a mobile vegetation on the tricuspid valve.

**Clinical case questions**

**1. Which two major diagnostic criteria does this patient fulfil?**

- Positive blood cultures and positive cardiac imaging
- Fever and injection drug use
- Murmur and pulmonary infiltrates
- Anaemia and raised CRP

**2. Which diagnosis best explains the pulmonary infiltrates?**

- Left-sided systemic embolisation
- Septic pulmonary embolisation
- Immune-complex glomerulonephritis
- Pulmonary oedema from mitral stenosis

**3. How would you classify this case using the 2023 ESC criteria?**

- Possible IE
- Definite IE
- Rejected IE
- Insufficient evidence even to suspect IE

# **Infective Endocarditis: Part 4**

## **Treatment, antibiotics, surgery, referral and discharge**

The treatment of infective endocarditis (IE) has two main goals:

1. **Eradicate the infection** using prolonged, appropriate antimicrobial therapy.
2. **Control the damage caused by the infection**, including valve destruction, heart failure, abscesses and embolisation.

A crucial principle: IE is not usually treated with a short course of oral antibiotics. Most patients require hospital admission and prolonged intravenous (IV) antimicrobial treatment, guided by blood cultures, susceptibility results and specialist assessment.

## **1. Initial management: what do you do first?**

A patient with suspected IE should generally be admitted because complications can develop rapidly, including acute heart failure, sepsis, valve destruction and embolic stroke.

### **Step 1: Assess and stabilise the patient**

Start with ABCDE.

| Assessment | What to look for | What to do |
| --- | --- | --- |
| Airway | Reduced consciousness, inability to protect airway | Secure airway if necessary |
| Breathing | Hypoxaemia, pulmonary oedema, respiratory distress | Oxygen if hypoxaemic; respiratory support if needed |
| Circulation | Hypotension, tachycardia, poor perfusion, shock | IV access, haemodynamic assessment, cautious fluid resuscitation where indicated |
| Disability | Confusion, seizures, focal neurological deficits | Assess for cerebral embolism or haemorrhage |
| Exposure | Fever, petechiae, peripheral signs, possible infection source | Complete examination |

**Important:** Do not automatically give large fluid boluses to every hypotensive patient with IE. If severe valve regurgitation has caused acute heart failure, excessive fluid can worsen pulmonary oedema. Resuscitation must be guided by the patient's haemodynamics.

### **Step 2: Collect blood cultures**

- Obtain three blood culture sets before antibiotics if possible.
- Request FBC, renal function, liver function, CRP and other investigations according to clinical condition.
- Perform echocardiography.

### **Step 3: Start empirical IV antibiotics**

Do not wait several days for culture results before treating a seriously ill patient.

However, the choice of empirical antibiotics depends on:

- Native valve versus prosthetic valve.
- Community-acquired versus healthcare-associated infection.
- Previous antibiotic exposure.
- Risk of MRSA.
- Local antimicrobial resistance patterns.

The empirical regimen must cover the likely organisms and then be narrowed once cultures and susceptibility results are available.

## **2. Antibiotic treatment: understanding the specific drugs**

This is the most important part of pharmacological management.

Why does IE require prolonged treatment?

Vegetations contain large numbers of bacteria embedded within fibrin and platelets. Bacteria deep inside vegetations may have reduced metabolic activity and are relatively protected from antibiotics and host immune defences.

Therefore, you need antibiotics that:

- Reach adequate concentrations in the infected tissue.
- Kill the responsible organism.
- Remain effective over a prolonged period.
- Are selected according to susceptibility results.

### **A. Empirical antibiotic treatment**

Before identifying the organism, empirical treatment should cover the likely pathogens.

The 2023 ESC guideline recommends coverage of:

- Staphylococci.
- Streptococci.
- Enterococci.

For early prosthetic valve IE and healthcare-associated IE, broader coverage is needed, including resistant staphylococci and potentially Gram-negative organisms.

One possible community-acquired native-valve empirical combination described in the ESC guideline is:

**Ampicillin + ceftriaxone**

- Ampicillin: 2 g IV every 4 hours (12 g/day).
- Ceftriaxone: 2 g IV every 12 hours (4 g/day).

An ESC-listed empirical option, not a universal regimen. Selection depends on the clinical setting, allergies, local resistance and specialist advice.

Another ESC-listed option is:

- (Flu)cloxacillin 2 g IV every 4 hours (12 g/day).
- Gentamicin 3 mg/kg IV once daily.

Gentamicin requires particular caution because it can cause nephrotoxicity and ototoxicity. It should not be added routinely to treatment of staphylococcal native-valve IE.

**Rwanda context:** The Rwanda Ministry of Health 2022 antibiotic guideline lists penicillin G or ampicillin-based treatment with gentamicin, and vancomycin when MRSA is suspected. Its extracted adult dose table has some formatting and unit ambiguities, so verify the original institutional protocol before prescribing from it.

### **B. Targeted treatment: once the organism is identified**

This is where you must understand why the antibiotic changes.

#### **1. Staphylococcus aureus**

This organism is particularly important because it can cause rapid valve destruction, abscess formation and severe sepsis.

**MSSA: methicillin-sensitive Staphylococcus aureus**

Preferred treatment

- Cloxacillin 2 g IV every 4 hours.
- Total: 12 g/day.
- Usually 4–6 weeks for left-sided native-valve IE, depending on the clinical circumstances.

Why cloxacillin?

It is a penicillinase-resistant penicillin. MSSA produces penicillinase, which destroys ordinary penicillin, but cloxacillin resists this enzyme.

Cefazolin 2 g IV every 8 hours is an alternative in appropriate patients.

**MRSA: methicillin-resistant Staphylococcus aureus**

- Vancomycin IV, generally 30–60 mg/kg/day divided into 2–3 doses, adjusted using renal function and therapeutic drug monitoring.
- Usually 6 weeks for left-sided MRSA IE.

Why vancomycin?

MRSA has altered penicillin-binding proteins, making most beta-lactam antibiotics ineffective. Vancomycin inhibits bacterial cell-wall synthesis through a different mechanism.

Daptomycin is another specialist option. The ESC guideline recommends high-dose daptomycin, 10 mg/kg IV once daily, with an appropriate second agent in selected cases.

**Important:** Do not routinely add gentamicin to staphylococcal native-valve IE. It increases renal toxicity without demonstrated clinical benefit.

#### **2. Viridans streptococci**

These organisms commonly originate from the oral cavity.

For susceptible isolates, options include:

- Penicillin G 18–30 million units/day IV, divided or by continuous infusion.
- Ceftriaxone 2 g IV once daily.

Treatment is commonly 4 weeks for susceptible native-valve infection.

Why ceftriaxone?

It is a third-generation cephalosporin with good activity against susceptible streptococci and a convenient once-daily administration schedule.

Selected uncomplicated cases may qualify for shorter regimens, but these require strict eligibility criteria and specialist supervision.

#### **3. Enterococcus faecalis**

Enterococci are particularly important because they can be relatively difficult to eradicate from vegetations.

A commonly used regimen is:

- Ampicillin 2 g IV every 4 hours.
- Ceftriaxone 2 g IV every 12 hours.
- Duration: usually 6 weeks.

Why use two antibiotics?

Ampicillin acts on bacterial cell-wall synthesis. Ceftriaxone binds additional penicillin-binding proteins, producing complementary activity and synergistic bacterial killing.

This combination is particularly useful when aminoglycoside toxicity is a concern.

### **Summary of common adult targeted regimens**

These are educational reference regimens for adults with normal renal function, not prescriptions for an individual patient.

| Organism | Common treatment example | Typical duration |
| --- | --- | --- |
| MSSA | Cloxacillin 2 g IV 4-hourly | 4–6 weeks |
| MRSA | Vancomycin IV, therapeutic drug monitoring | 6 weeks |
| Susceptible viridans streptococci | Ceftriaxone 2 g IV daily | 4 weeks |
| Enterococcus faecalis | Ampicillin 2 g IV 4-hourly + ceftriaxone 2 g IV 12-hourly | 6 weeks |

**Remember:** Prosthetic valve IE generally requires at least 6 weeks of treatment. Renal function, allergy history, microbiological susceptibility and the specific valve infection determine the final regimen.

## **3. Why do we monitor blood cultures during treatment?**

After starting antibiotics, repeat blood cultures to establish whether bacteraemia is clearing.

Why?

If the organism continues to grow despite appropriate antibiotics, it may indicate:

- Inadequate antimicrobial activity.
- An undrained abscess.
- A large infected vegetation.
- An infected prosthetic valve or cardiac device.
- Another source of persistent infection.

Persistent positive blood cultures after 48–72 hours are concerning and should trigger reassessment. Persistent infection despite approximately 7 days of appropriate treatment is a major warning sign for uncontrolled IE and possible surgery.

Other monitoring includes:

| Parameter | Why monitor it? |
| --- | --- |
| Temperature | Resolution of systemic infection |
| Blood cultures | Clearance of bacteraemia |
| CRP | Trend in systemic inflammation |
| Creatinine/eGFR | Detect renal injury and adjust antibiotics |
| Full blood count | Monitor anaemia, leukocyte changes and thrombocytopenia |
| ECG | Detect new conduction abnormalities |
| Echocardiography | Monitor valve function, vegetation and abscess progression |
| Clinical fluid status | Detect developing heart failure |

## **4. When do we need cardiac surgery?**

This is a major examination topic.

**Antibiotics alone are not sufficient for every patient.**

Surgery may be needed to remove infected tissue, repair or replace a damaged valve, drain an abscess or prevent further embolisation.

There are three main indications:

1. Heart failure

The infection destroys valve tissue, producing severe regurgitation or obstruction. The heart can no longer maintain adequate circulation.

Examples:

- Acute severe mitral regurgitation.
- Acute severe aortic regurgitation.
- Pulmonary oedema.
- Cardiogenic shock.

2. Uncontrolled infection

Antibiotics cannot adequately control the infection or it has spread into surrounding cardiac tissue.

Examples:

- Persistent bacteraemia despite appropriate treatment.
- Perivalvular abscess.
- New AV block suggesting extension of infection.
- Increasing vegetation size.
- Fungal IE.
- Infection with multidrug-resistant organisms.

3. Prevention of embolisation

A large vegetation may break off and travel to the brain, spleen, kidneys or lungs.

Surgery may be indicated when embolic risk is high, particularly with large mobile vegetations and previous embolic events.

### **A. Heart failure: the most urgent surgical indication**

Imagine a patient with aortic valve IE.

The infection destroys the aortic valve leaflet, causing acute severe aortic regurgitation.

During diastole, blood flows backwards from the aorta into the left ventricle.

This suddenly increases left ventricular volume and pressure. The left ventricle has not had time to adapt through remodelling, so left atrial and pulmonary venous pressures rise, producing pulmonary oedema.

Clinical findings include:

- Severe dyspnoea.
- Orthopnoea.
- Bilateral crackles.
- Hypoxaemia.
- Pulmonary oedema.
- Cardiogenic shock in severe cases.

Emergency surgery

If IE causes pulmonary oedema or cardiogenic shock due to severe valve dysfunction, emergency surgery, generally within 24 hours, is recommended when intervention is appropriate.

Do not wait for the full antibiotic course to finish.

### **B. Uncontrolled infection**

Consider a patient with aortic valve IE who initially improves on antibiotics but develops:

- Persistent fever.
- Persistently positive blood cultures.
- New PR prolongation.
- A newly detected perivalvular abscess on TEE.

What is happening?

The infection has extended beyond the valve into surrounding tissue and is affecting the cardiac conduction system.

Antibiotics may not adequately penetrate or eradicate a mature abscess. Surgical debridement and drainage may be required.

This generally requires urgent surgical assessment, often with surgery within 3–5 days when indicated.

### **C. Prevention of embolisation**

A vegetation can detach and become an infected embolus.

For example:

- Mitral valve vegetation → cerebral artery → ischaemic stroke.
- Aortic valve vegetation → splenic artery → splenic infarction.
- Tricuspid valve vegetation → pulmonary artery → septic pulmonary embolism.

The risk is particularly concerning with large, mobile vegetations.

A vegetation measuring 10 mm or more may contribute to a surgical decision, especially when there has already been an embolic event or other surgical indications exist. Size alone does not mean every patient requires surgery.

### **Timing of surgery**

| Timing | Meaning | Examples |
| --- | --- | --- |
| Emergency | Within 24 hours | Severe valve dysfunction causing pulmonary oedema or cardiogenic shock |
| Urgent | Usually within 3–5 days | Abscess, locally uncontrolled infection, persistent infection, high embolic risk |
| Non-urgent | During the same admission | Other established surgical indications where immediate intervention is not required |

## **5. Management of important complications**

Treating the infection is only part of management. You must also treat its complications.

### **A. Acute heart failure and pulmonary oedema**

Management includes:

- Oxygen if hypoxaemic.
- Non-invasive ventilation where appropriate.
- IV furosemide, for example 20–40 mg initially in a diuretic-naive adult, titrated to response.
- Strict fluid balance.
- Haemodynamic monitoring.
- Urgent cardiology and cardiac surgical assessment.

Why furosemide?

It increases renal sodium and water excretion, reducing circulating volume and pulmonary congestion.

But remember: diuretics are supportive treatment. They do not correct the destroyed valve. Severe acute regurgitation may require surgery.

### **B. Septic embolic stroke**

A vegetation can travel into cerebral circulation and obstruct an artery.

Management includes:

- Urgent neurological assessment.
- Immediate brain imaging.
- Assessment for haemorrhagic transformation and infective aneurysm.
- Appropriate stroke supportive care.
- Specialist cardiology, neurology and neurosurgical discussion where needed.

**Important:** Do not automatically administer thrombolysis for an ischaemic stroke caused by IE. Intracranial haemorrhage and infective aneurysm are important risks. Mechanical thrombectomy may be considered in selected patients with large-vessel occlusion.

### **C. Septic pulmonary embolism**

This is especially associated with tricuspid valve IE.

Management includes:

- Appropriate IV antibiotics.
- Oxygen and respiratory support as needed.
- Evaluation for lung abscesses or empyema.
- Assessment of persistent infection and right ventricular function.
- Surgical assessment if there are recurrent pulmonary emboli with respiratory compromise, persistent bacteraemia or severe tricuspid regurgitation causing right ventricular dysfunction.

### **D. Renal complications**

Remember the two mechanisms:

- Renal infarction due to embolisation.
- Immune-complex glomerulonephritis.

Management involves monitoring renal function, correcting electrolyte disturbances, avoiding nephrotoxic drugs where possible and adjusting antibiotic doses.

This is particularly important if the patient is receiving vancomycin or gentamicin.

## **6. Referral: who needs specialist care?**

All confirmed or strongly suspected IE needs hospital-based specialist assessment.

The ideal approach is a multidisciplinary Endocarditis Team.

| Specialist | Role |
| --- | --- |
| Cardiologist | Diagnosis, echocardiography, cardiac monitoring |
| Cardiothoracic surgeon | Valve repair/replacement and abscess drainage |
| Infectious disease specialist | Antibiotic selection and duration |
| Microbiologist | Culture interpretation and susceptibility |
| Neurologist | Cerebral embolism and stroke complications |
| Nephrologist | Acute kidney injury and renal complications |

In settings without cardiac surgery facilities, early referral or transfer to an appropriate tertiary centre is essential when surgical indications arise.

Do not wait until the patient develops shock before arranging transfer.

## **7. Can a patient with IE be discharged?**

Yes, but only after the acute phase has been controlled and a safe continuation plan has been established.

Discharge does not necessarily mean that antibiotics are finished.

Some carefully selected patients can complete treatment through outpatient parenteral antibiotic therapy (OPAT) or specialist-supervised oral step-down therapy.

The 2023 ESC guideline describes an initial critical phase requiring at least 10 days of IV treatment in most patients, followed by possible outpatient treatment in selected stable patients. TEE should be used to assess local disease progression and complications before switching where appropriate.

### **Discharge criteria**

Before discharge, assess:

- Clinical stability and resolution of sepsis.
- No uncontrolled heart failure.
- No uncontrolled infection or undrained abscess.
- No ongoing major embolic complication requiring hospital care.
- Stable or improving cardiac function.
- A clear antibiotic plan with confirmed doses and completion date.
- Reliable access to medication, laboratory monitoring and follow-up.
- Patient understanding of warning signs.

### **What should the patient be told?**

Return immediately for:

- Recurrent fever or chills.
- New or worsening shortness of breath.
- Chest pain.
- Sudden weakness, facial asymmetry or speech difficulty.
- Severe headache or altered consciousness.
- New painful or swollen limb.
- Reduced urine output.

Long-term follow-up is important because patients can develop recurrent IE, persistent valve dysfunction or heart failure after the infection has resolved.

## **8. Final clinical case: putting everything together**

A 29-year-old man who injects drugs presents with fever, chills, pleuritic chest pain and haemoptysis.

Examination reveals:

- Temperature 39°C.
- Heart rate 122 beats/min.
- Blood pressure 105/65 mmHg.
- Respiratory rate 28/min.
- Oxygen saturation 90% on room air.
- Pansystolic murmur at the lower left sternal border.

Blood cultures grow MSSA. Echocardiography reveals a 15 mm mobile tricuspid vegetation with severe tricuspid regurgitation.

Chest CT shows multiple peripheral cavitating pulmonary lesions.

### **Questions**

**Test your management decisions**

**1. What is the most likely diagnosis?**

- Mitral valve IE
- Tricuspid valve IE
- Aortic valve IE
- Pulmonary valve stenosis

**2. What explains the cavitating lung lesions?**

- Systemic arterial embolisation
- Septic pulmonary emboli
- Left ventricular failure
- Pulmonary tuberculosis alone

**3. Which antibiotic is preferred for MSSA IE?**

- Cloxacillin
- Vancomycin as first choice
- Azithromycin
- Metronidazole

**4. Which finding would strongly support surgical assessment?**

- Fever for one day
- Persistent bacteraemia despite appropriate antibiotics
- Mild anaemia
- Raised CRP alone

## **9. The most important things to remember for examinations**

1. **IE requires prolonged, culture-directed antibiotic treatment**, usually IV initially.
2. Obtain blood cultures before antibiotics whenever safely possible.
3. MSSA: use an antistaphylococcal beta-lactam such as cloxacillin.
4. MRSA: vancomycin or an appropriate specialist alternative.
5. Enterococcus: ampicillin plus ceftriaxone is an important synergistic regimen.
6. Do not routinely add gentamicin to staphylococcal native-valve IE.
7. The three major indications for surgery are heart failure, uncontrolled infection and prevention of embolisation.
8. New AV block in aortic IE suggests a possible perivalvular abscess.
9. Tricuspid IE can cause septic pulmonary emboli.
10. Discharge requires clinical stability and a safe plan to complete treatment.

**Guidelines used:** Rwanda Ministry of Health, *Standard Treatment Guidelines for the Use of Antibiotics in Rwanda* (2022), and the *2023 ESC Guidelines for the Management of Endocarditis*. The ESC document provides more detailed contemporary recommendations; local hospital protocols and microbiology susceptibility patterns must guide actual prescribing.

You can read the [full 2023 ESC guideline](https://academic.oup.com/eurheartj/article/44/39/3948/7243107?searchresult=1&utm_source=chatgpt.com) and [Rwanda 2022 antibiotic guideline](https://www.moh.gov.rw/index.php?eID=dumpFile&f=92525&t=f&token=65bb1585f37424835c9eeb4c9ad4747b38a80514&utm_source=chatgpt.com).

function render(n){
 const L=n.md.split('\n'),out=[],toc=[];let i=0,k=0,title='',sub='',gotTitle=false,wantSub=false;
 const isList=l=>/^(- |\d+\. )/.test(l),isTab=l=>/^\|/.test(l),isHead=l=>/^#{1,4} /.test(l),isHr=l=>/^---+\s*$/.test(l);
 while(i<L.length){

  if(!l.trim()||isHr(l)){i++;continue}
  if(isHead(l)){
   const m=l.match(/^(#{1,4}) (.*)/),lv=m[1].length,t=m[2];i++;
   if(lv===1&&!gotTitle){gotTitle=true;title=t;wantSub=true;continue}
   if(wantSub&&lv===2){sub=t;wantSub=false;continue}
   wantSub=false;
   const id=n.id+'--s'+(++k);toc.push({lv,t,id});
   out.push(`<h${lv+1} id="${id}">${inl(t)}</h${lv+1}>`);continue;

  if(isList(l)){

   const tag=ord?'ol':'ul';
   out.push(`<${tag}${ord&&start!==1?` start="${start}"`:''}>${items.map(x=>`<li>${inl(x)}</li>`).join('')}</${tag}>`);continue;
  }
  if(isTab(l)){
   const rows=[];while(i<L.length&&isTab(L[i]))rows.push(L[i++]);
   const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());

   out.push(`<div class="tw"><table><thead><tr>${head.map((c,j)=>td(c,j,'th')).join('')}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${cells(r).map((c,j)=>td(c,j,'td')).join('')}</tr>`).join('')}</tbody></table></div>`);continue;
  }
  const p=[];while(i<L.length&&L[i].trim()&&!isHead(L[i])&&!isList(L[i])&&!isTab(L[i])&&!isHr(L[i]))p.push(L[i++]);
  out.push(`<p>${p.map(inl).join('<br>')}</p>`);
 }
 return {title,sub,toc,html:out.join('\n')};
}
