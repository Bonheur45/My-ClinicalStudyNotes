# MALARIA: CLINICAL STUDY NOTES
## Diagnosis, pathophysiology, investigations, treatment and clinical decision-making

**Reference:** Rwanda Integrated Malaria Control Guidelines, Edition 2024, with explanations of the underlying clinical mechanisms.

---

# 1. DEFINITION AND GENERAL OVERVIEW

Malaria is an acute febrile illness caused by protozoan parasites of the genus *Plasmodium*. It is transmitted to humans through the bite of an infected female *Anopheles* mosquito.

The five Plasmodium species that infect humans are:

1. *Plasmodium falciparum*
2. *Plasmodium vivax*
3. *Plasmodium malariae*
4. *Plasmodium ovale*
5. *Plasmodium knowlesi*

**Clinical importance:** *P. falciparum* is particularly important in Rwanda because it is responsible for most severe malaria and malaria-related deaths. It can cause cerebral malaria, severe anaemia, acute kidney injury, pulmonary oedema and shock.

## 1.1. Why is malaria dangerous?

The disease is not simply about having parasites in the blood. The parasites invade red blood cells, multiply inside them and eventually destroy them.

In falciparum malaria, infected red blood cells also develop adhesive properties that allow them to attach to the vascular endothelium. This phenomenon is called sequestration.

Sequestration causes:
- Obstruction of small blood vessels.
- Reduced tissue perfusion.
- Reduced oxygen delivery to organs.
- Inflammation and endothelial dysfunction.
- Organ damage, particularly in the brain, kidneys and lungs.

This explains why a patient with severe malaria may develop coma, renal failure, respiratory distress or shock.

---

# 2. LIFE CYCLE AND PATHOPHYSIOLOGY

Understanding the life cycle helps explain the clinical manifestations and the action of antimalarial drugs.

## 2.1. Infection and liver stage

When an infected female Anopheles mosquito bites a person, it injects Plasmodium sporozoites into the bloodstream.

The sporozoites travel to the liver and invade hepatocytes.

Inside the hepatocytes, they multiply and develop into schizonts. These schizonts eventually rupture, releasing thousands of merozoites into the bloodstream.

An important exception is *P. vivax* and *P. ovale*. Some parasites remain dormant in the liver as hypnozoites and can reactivate later, causing relapses.

## 2.2. Blood stage

The released merozoites invade red blood cells.

Inside the red blood cells, the parasite develops through several stages:

- Ring stage.
- Trophozoite stage.
- Schizont stage.

The infected red blood cell eventually ruptures, releasing more merozoites, which invade other red blood cells.

This repeated destruction of red blood cells contributes to:
- Fever.
- Chills and sweating.
- Anaemia.
- Jaundice.
- Haemoglobinuria in severe intravascular haemolysis.

## 2.3. Why does malaria cause fever?

When infected red blood cells rupture, they release merozoites and parasite products into the circulation.

These substances stimulate immune cells to release inflammatory cytokines, particularly:
- Tumour necrosis factor-alpha (TNF-α).
- Interleukin-1 (IL-1).
- Interleukin-6 (IL-6).

These cytokines act on the hypothalamus and increase the body's temperature set point.

The patient therefore develops fever.

When the set point rises, the body perceives its current temperature as too low. This explains why the patient experiences chills and shivering even while their temperature is increasing.

When the set point returns towards normal, the patient begins sweating to lose heat.

## 2.4. Why does falciparum malaria cause severe disease?

Infected red blood cells express parasite-derived adhesive proteins, particularly PfEMP1, on their surfaces.

These proteins allow infected red blood cells to adhere to vascular endothelial cells.

The consequences include:

1. **Sequestration:** infected red blood cells accumulate in small blood vessels.
2. **Microvascular obstruction:** blood flow through small vessels becomes impaired.
3. **Tissue hypoxia:** organs receive insufficient oxygen.
4. **Endothelial activation and inflammation:** vascular permeability and organ dysfunction increase.

In cerebral malaria, these mechanisms contribute to impaired cerebral microcirculation and altered consciousness.

In the kidneys, haemolysis, reduced perfusion and microvascular injury can contribute to acute kidney injury.

In the lungs, endothelial dysfunction and increased permeability can contribute to pulmonary oedema and ARDS.

---

# 3. CLINICAL PRESENTATION

The clinical manifestations of malaria vary according to parasite burden, host immunity, age, pregnancy status and the presence of complications.

## 3.1. Common symptoms

A patient may present with:

- Fever or history of fever.
- Headache.
- Chills and rigors.
- Sweating.
- Generalised weakness.
- Loss of appetite.
- Myalgia.
- Arthralgia.
- Nausea.
- Vomiting.
- Abdominal discomfort.
- Sometimes diarrhoea.

These manifestations are nonspecific. Malaria can resemble many other infections, including pneumonia, urinary tract infection, meningitis and bloodstream infections.

Therefore, fever alone is not sufficient to diagnose malaria.

## 3.2. Three clinical classifications used in Rwanda

Rwanda's 2024 guidelines distinguish:

1. Simple or uncomplicated malaria.
2. Simple malaria with minor digestive symptoms.
3. Severe malaria.

### A. Simple malaria

The patient has:

- Axillary temperature ≥37.5°C or a history of fever within the preceding 24 hours.
- Compatible symptoms such as headache, chills, weakness, myalgia or arthralgia.
- Positive malaria RDT or blood smear.
- No severe malaria manifestations.

The patient is generally conscious, haemodynamically stable and able to swallow and retain oral medication.

### B. Simple malaria with minor digestive symptoms

This is malaria with vomiting that prevents oral medication, with or without moderate diarrhoea, but without severe malaria criteria.

Why does this classification matter?

Oral antimalarial drugs need to be absorbed from the gastrointestinal tract. If the patient repeatedly vomits and cannot retain medication, adequate drug concentrations may not be achieved.

The patient therefore requires injectable treatment initially and observation at a health centre.

Importantly, vomiting does not automatically mean severe malaria. You must assess the patient for other danger signs.

### C. Severe malaria

Severe malaria is confirmed malaria parasitaemia accompanied by one or more recognised manifestations of severity.

It is a medical emergency requiring hospitalisation.

The patient does not need to have all the manifestations. One qualifying severe manifestation is sufficient.

---

# 4. SEVERE MALARIA: DANGER SIGNS AND THEIR MECHANISMS

The following manifestations are particularly important because they indicate organ dysfunction.

## 4.1. Impaired consciousness and cerebral malaria

Cerebral malaria is a severe neurological complication, particularly associated with *P. falciparum*.

Infected red blood cells adhere to cerebral vascular endothelium and become sequestered in small cerebral vessels.

This contributes to:
- Impaired cerebral microcirculation.
- Endothelial dysfunction.
- Inflammation.
- Cerebral metabolic disturbance.
- Neurological dysfunction.

Clinical manifestations include confusion, abnormal behaviour, reduced consciousness, seizures and coma.

The Rwanda 2024 guideline defines impaired consciousness as:
- Adult Glasgow Coma Scale (GCS) <11.
- Child Blantyre Coma Score <3.

A patient with altered consciousness requires immediate assessment. Do not automatically attribute every coma in a malaria-positive patient to cerebral malaria. Consider hypoglycaemia, meningitis, postictal states, intoxication and other causes.

## 4.2. Severe anaemia

Malaria causes anaemia through several mechanisms.

First, infected red blood cells rupture to release merozoites.

Second, the spleen removes infected and sometimes uninfected red blood cells from circulation.

Third, inflammation suppresses effective red blood cell production in the bone marrow.

The result is reduced haemoglobin and reduced oxygen-carrying capacity.

The heart compensates by increasing cardiac output, producing tachycardia. The patient may develop dyspnoea, weakness, pallor and eventually cardiac failure.

The 2024 Rwanda guideline gives the following severe anaemia criteria:

- Children under 12 years: Hb ≤5 g/dL or haematocrit ≤15%, with parasitaemia >10,000 parasites/µL and signs of compensation.
- Adults: Hb <7 g/dL or haematocrit <20%, with parasitaemia >10,000 parasites/µL and signs of compensation.

Clinical context is essential, particularly when deciding on transfusion.

## 4.3. Acute kidney injury

Acute kidney injury (AKI) occurs when kidney function deteriorates rapidly, causing impaired filtration and accumulation of metabolic waste products.

In malaria, the mechanisms include:

- Intravascular haemolysis releasing free haemoglobin.
- Reduced renal perfusion due to dehydration or shock.
- Microvascular obstruction.
- Inflammation and tubular injury.
- Pigment-related nephrotoxicity.

Free haemoglobin can damage renal tubular cells and contribute to tubular obstruction.

The Rwanda 2024 guideline includes creatinine >265 µmol/L (3 mg/dL) or blood urea >20 mmol/L as severe renal impairment criteria.

Look for:
- Reduced urine output.
- Oliguria or anuria.
- Rising creatinine.
- Fluid overload.
- Electrolyte disturbances, particularly hyperkalaemia.

## 4.4. Blackwater fever

Blackwater fever is a manifestation of massive intravascular haemolysis.

Normally, red blood cells circulate for approximately 120 days before being removed by the spleen.

In massive intravascular haemolysis, red blood cells rupture directly inside blood vessels, releasing large quantities of haemoglobin into plasma.

The plasma protein haptoglobin normally binds free haemoglobin. When this binding capacity is overwhelmed, free haemoglobin circulates and is filtered by the kidneys.

This produces haemoglobinuria, giving urine a dark red, brown or cola-like appearance.

### Why does it cause kidney injury?

Free haemoglobin causes oxidative damage to renal tubular cells. It can also contribute to tubular obstruction and renal vasoconstriction.

The patient may develop:
- Dark urine.
- Pallor.
- Jaundice.
- Tachycardia.
- Falling haemoglobin.
- Oliguria or anuria.
- Rising creatinine.

### How do you investigate it?

- FBC: falling haemoglobin.
- Reticulocyte count: may increase as the bone marrow responds.
- LDH: increased due to cell destruction.
- Indirect bilirubin: increased.
- Haptoglobin: reduced.
- Urine dipstick: positive for blood.
- Urine microscopy: few or no red blood cells despite a positive blood reaction, suggesting haemoglobinuria.
- Urea and creatinine: assess renal injury.

Differentiate:
- Haematuria: intact red blood cells in urine.
- Haemoglobinuria: free haemoglobin in urine.
- Myoglobinuria: myoglobin released from damaged skeletal muscle.

Management requires urgent admission, treatment of severe malaria, monitoring of renal function and urine output, correction of significant anaemia, careful fluid management and dialysis when indicated.

## 4.5. Hypoglycaemia

Hypoglycaemia is a dangerous complication because the brain depends heavily on glucose for energy.

In severe malaria, glucose can fall because:

1. The parasite consumes glucose during its metabolism.
2. The host's immune response increases metabolic glucose consumption.
3. Severe illness may impair hepatic glucose production.
4. Quinine stimulates insulin release from pancreatic beta cells, increasing the risk of hypoglycaemia.

### Why does hypoglycaemia cause sweating, tremors and palpitations?

When blood glucose falls, glucose-sensing mechanisms in the brain activate counter-regulatory responses.

The sympathetic nervous system and adrenal medulla release adrenaline and noradrenaline.

These hormones attempt to restore glucose availability and prepare the body for an emergency.

Their effects explain the symptoms:

- Sweating: sympathetic cholinergic stimulation of sweat glands.
- Trembling: adrenergic stimulation increases skeletal muscle activity.
- Palpitations: adrenaline stimulates cardiac β1 receptors, increasing heart rate and contractility.
- Hunger: hypothalamic feeding pathways are activated.
- Anxiety: the fight-or-flight response produces a sensation of alarm.

These are autonomic or adrenergic manifestations.

If glucose continues to fall, the brain itself becomes glucose-deprived. This is called neuroglycopenia.

Neuroglycopenic manifestations include:
- Headache.
- Confusion.
- Abnormal behaviour.
- Poor concentration.
- Blurred vision.
- Seizures.
- Coma.

**Clinical distinction:** sweating and tremors are often early warning symptoms. Confusion and seizures suggest more serious glucose deprivation.

Always check bedside glucose immediately in a malaria patient who develops sweating, tremors, palpitations, seizures or altered consciousness.

## 4.6. Pulmonary oedema

Pulmonary oedema means abnormal accumulation of fluid in the lungs, particularly in the pulmonary interstitium and alveoli.

Normally, pulmonary capillaries contain blood while the alveoli contain air.

Fluid moves into the lung tissue when the balance between hydrostatic pressure, oncotic pressure and capillary permeability is disturbed.

In severe malaria, pulmonary oedema may develop because of:

- Increased pulmonary capillary permeability from endothelial injury.
- Excessive intravenous fluid administration.
- Renal impairment causing fluid retention.
- Associated cardiac dysfunction.

### Why does the patient develop respiratory distress?

When fluid enters the alveoli, it reduces the space available for air.

Oxygen must cross the alveolar-capillary membrane to enter the blood. Fluid accumulation increases the diffusion distance and impairs gas exchange.

Consequently, the patient develops hypoxaemia and respiratory distress.

Clinical features include:
- Tachypnoea.
- Dyspnoea.
- Hypoxaemia.
- Bilateral crackles.
- Orthopnoea.
- Sometimes pink, frothy sputum.

### Why is sputum pink and frothy?

Fluid accumulating in the alveoli may contain small amounts of red blood cells due to capillary leakage.

The blood gives the sputum a pink colour. When the fluid mixes with air during coughing, it becomes frothy.

Pink frothy sputum is a concerning sign of advanced pulmonary oedema.

Investigations include pulse oximetry, chest X-ray, blood gas analysis, renal function tests and cardiac assessment when indicated.

Management requires urgent hospital care, oxygen and respiratory support as needed, careful fluid assessment, treatment of associated anaemia and renal dysfunction, and diuretics when fluid overload is present and clinically appropriate.

## 4.7. Acute respiratory distress syndrome (ARDS)

ARDS is a form of acute inflammatory lung injury characterised by increased alveolar-capillary permeability and non-cardiogenic pulmonary oedema.

In severe malaria, inflammation and endothelial injury damage the pulmonary vascular barrier.

Fluid and proteins leak into the alveoli, causing:
- Impaired gas exchange.
- Surfactant dysfunction.
- Alveolar collapse.
- Reduced lung compliance.
- Severe hypoxaemia.

The lungs become stiff and require more effort to expand.

ARDS is not simply the same as ordinary fluid overload. Its main mechanism is inflammatory injury and increased permeability.

The Berlin definition includes:
- Onset within one week of a known clinical insult.
- Bilateral pulmonary opacities on imaging.
- Respiratory failure not fully explained by cardiac failure or fluid overload.
- Impaired oxygenation with PEEP or CPAP ≥5 cmH₂O.

ARDS severity is classified using PaO₂/FiO₂:
- Mild: 201–300 mmHg.
- Moderate: 101–200 mmHg.
- Severe: ≤100 mmHg.

Management is in a high-dependency or intensive care setting. It may require oxygen, non-invasive support or mechanical ventilation. When mechanical ventilation is required, lung-protective ventilation is used, commonly targeting approximately 6 mL/kg predicted body weight, with appropriate PEEP.

## 4.8. Disseminated intravascular coagulation (DIC)

DIC is a pathological state in which coagulation becomes excessively activated throughout the circulation.

Severe infection and endothelial injury can activate tissue factor and thrombin generation.

This produces widespread fibrin formation and small clots within blood vessels.

As coagulation continues, platelets and clotting factors are consumed.

The patient can therefore develop both:
- Microvascular thrombosis and organ injury.
- Bleeding because clotting factors and platelets have been consumed.

Clinical manifestations include:
- Petechiae and ecchymoses.
- Gum bleeding.
- Epistaxis.
- Bleeding from venepuncture sites.
- Haematuria.
- Gastrointestinal bleeding.
- Organ dysfunction.

Investigations:
- FBC: thrombocytopenia.
- PT: prolonged.
- aPTT: may be prolonged.
- Fibrinogen: often reduced.
- D-dimer: increased.
- Blood film: may show schistocytes.

Important: thrombocytopenia is common in malaria, but thrombocytopenia alone does not establish DIC.

Management focuses on treating the underlying infection and supporting the patient. Blood products are used according to active bleeding, laboratory abnormalities and planned procedures.

---

# 5. DIAGNOSIS AND INVESTIGATIONS

## 5.1. The central diagnostic principle

Malaria is a parasitologically confirmed diagnosis.

A patient with fever should not automatically receive antimalarial medication.

Rwanda's 2024 guideline requires confirmation using:
- Malaria rapid diagnostic test (RDT).
- Blood smear microscopy.

At hospital level, microscopy is preferred for diagnosis and assessment. RDT is used at community level and at health centres when microscopy is unavailable.

## 5.2. Rapid diagnostic test (RDT)

RDTs detect malaria parasite antigens in a small blood sample.

Depending on the test, they may detect:
- HRP2, commonly associated with *P. falciparum*.
- Parasite lactate dehydrogenase (pLDH).
- Other Plasmodium antigens.

Advantages:
- Rapid results.
- Easy to perform.
- Useful where microscopy is unavailable.
- Helps guide early treatment.

Limitations:
- Some tests do not identify all species.
- RDTs do not reliably quantify parasite density.
- HRP2 can remain positive for weeks after successful treatment because the antigen may persist after parasites have been cleared.
- Some parasites may escape detection because of low parasite density or antigen-related limitations.

Therefore, a positive RDT after recent treatment does not automatically mean treatment failure.

## 5.3. Blood smear microscopy

Microscopy identifies malaria parasites in peripheral blood.

Two preparations are particularly important.

### Thick blood film

A thick film concentrates blood cells and is more sensitive for detecting parasites, particularly when parasite density is low.

It is useful for answering:

"Are malaria parasites present?"

### Thin blood film

A thin film preserves red blood cell morphology.

It is useful for:
- Identifying the Plasmodium species.
- Assessing parasite morphology.
- Estimating parasitaemia.

Parasite density can be important in severe falciparum malaria.

## 5.4. Full blood count (FBC)

FBC helps identify complications and provides a baseline for monitoring.

Haemoglobin and haematocrit assess anaemia.

Platelets may be reduced because of platelet consumption, splenic sequestration and immune-mediated destruction.

White blood cell counts may vary. Neither a normal nor an abnormal WBC count independently confirms or excludes malaria.

## 5.5. Blood glucose

Check bedside glucose in all patients with suspected severe malaria, especially those with:
- Altered consciousness.
- Seizures.
- Severe weakness.
- Sweating and tremors.
- Treatment with quinine.

Hypoglycaemia is rapidly treatable but potentially fatal if missed.

## 5.6. Urea, creatinine and electrolytes

These assess renal function and identify complications.

Pay particular attention to:
- Rising creatinine.
- Hyperkalaemia.
- Metabolic acidosis.
- Sodium abnormalities.

Monitor urine output as well as laboratory values.

## 5.7. Liver function tests

Order when clinically indicated, particularly in patients with jaundice, suspected haemolysis or hepatic dysfunction.

Bilirubin may rise because of haemolysis, hepatic dysfunction or both.

## 5.8. Additional investigations in severe malaria

Depending on presentation, consider:
- Blood gas analysis: metabolic acidosis and oxygenation.
- Lactate: tissue hypoperfusion and severe metabolic disturbance.
- Chest X-ray: pulmonary oedema, ARDS or alternative respiratory pathology.
- Blood cultures: suspected bacterial sepsis.
- Coagulation profile: suspected DIC or significant bleeding.
- Blood grouping and crossmatching: anticipated transfusion.
- ECG: cardiac complications or electrolyte disturbances.
- CT brain: focal neurological signs, acute deterioration or seizures that cannot be controlled, according to clinical indication.

---

# 6. TREATMENT OF MALARIA

Treatment must be based on the clinical classification, the patient's weight, pregnancy status, ability to tolerate oral medication and the presence of complications.

The following doses are based on the Rwanda 2024 Integrated Malaria Control Guidelines.

## 6.1. SIMPLE MALARIA: FIRST-LINE TREATMENT

The first-line treatment is artemisinin-based combination therapy (ACT).

The most familiar regimen is:

**Artemether 20 mg + Lumefantrine 120 mg tablets (AL).**

Each tablet contains:
- Artemether 20 mg.
- Lumefantrine 120 mg.

The adult dose for a patient weighing ≥35 kg is:

**Four tablets per dose, twice daily for three days.**

This is a total of six doses.

### Exact dosing schedule for adults ≥35 kg

| Dose | Time | Number of tablets |
|---|---|---:|
| 1 | 0 hours | 4 |
| 2 | 8 hours | 4 |
| 3 | 24 hours | 4 |
| 4 | 36 hours | 4 |
| 5 | 48 hours | 4 |
| 6 | 60 hours | 4 |

Total: 24 tablets.

### Weight-based AL dosing

Each dose is given according to body weight:

| Body weight | Tablets per dose | Total tablets for 3 days |
|---|---:|---:|
| 5 to <15 kg | 1 | 6 |
| 15 to <25 kg | 2 | 12 |
| 25 to <35 kg | 3 | 18 |
| ≥35 kg | 4 | 24 |

### Why is it a combination?

Artemether acts rapidly against blood-stage parasites, reducing parasite burden.

Lumefantrine has a longer elimination half-life and helps eliminate remaining parasites.

Combining drugs with different pharmacological properties improves treatment effectiveness and reduces the risk of resistance compared with artemisinin monotherapy.

### Important administration instructions

- Give the first dose under medical supervision.
- The second dose is given eight hours after the first.
- Continue twice daily at approximately 12-hour intervals thereafter.
- AL should be taken with food or milk because lumefantrine absorption improves with dietary fat.
- Use dispersible formulations for children when appropriate.
- Ensure the patient completes all six doses.

If vomiting occurs soon after a dose, assess whether the dose needs repeating according to the product instructions and local protocol. Persistent vomiting requires reassessment.

Do not prescribe oral artemisinin monotherapy for uncomplicated malaria.

## 6.2. OTHER ACT OPTIONS IN RWANDA

The 2024 guideline also includes:

### A. Dihydroartemisinin-piperaquine (DHAP)

This is given once daily for three days.

| Weight | Daily dose |
|---|---|
| 5 to <8 kg | 20 mg + 160 mg |
| 8 to <11 kg | 30 mg + 240 mg |
| 11 to <17 kg | 40 mg + 320 mg |
| 17 to <25 kg | 60 mg + 480 mg |
| 25 to <36 kg | 80 mg + 640 mg |
| 36 to <60 kg | 120 mg + 960 mg |
| 60 to <80 kg | 160 mg + 1280 mg |
| >80 kg | 200 mg + 1600 mg |

The first figure is dihydroartemisinin and the second is piperaquine.

Piperaquine can prolong the QT interval. Review cardiac history, electrolyte disturbances and other QT-prolonging medications before prescribing.

### B. Artesunate-pyronaridine (ASPY)

This is another ACT option included in the 2024 Rwanda guideline.

The dose is given once daily for three days.

For patients weighing ≥20 kg:

| Weight | Daily dose |
|---|---|
| 20 to <24 kg | 60 mg artesunate + 180 mg pyronaridine |
| 24 to <45 kg | 120 mg + 360 mg |
| 45 to <65 kg | 180 mg + 540 mg |
| ≥65 kg | 240 mg + 720 mg |

For children weighing 5 to <20 kg, use the appropriate granule suspension formulation and weight-based dose.

ASPY is taken with water. It is contraindicated in the first trimester of pregnancy according to the Rwanda guideline.

The choice among ACTs should follow the current national treatment strategy and facility protocol.

## 6.3. SUPPORTIVE TREATMENT IN SIMPLE MALARIA

### Fever

Use paracetamol:

**15 mg/kg per dose orally or rectally.**

The interval and maximum daily dose should follow the patient's age, weight and local prescribing protocol.

Tepid sponging may be used when the temperature is high.

Avoid unnecessary aspirin and ibuprofen, particularly when bleeding risk, dehydration or renal impairment is a concern.

### Hydration

Encourage oral fluids when the patient can drink.

If there is vomiting or diarrhoea, assess dehydration and use oral rehydration solution where appropriate.

Do not administer intravenous fluids routinely to every patient with malaria.

---

# 7. SIMPLE MALARIA WITH MINOR DIGESTIVE SYMPTOMS

This category includes patients who have malaria with vomiting that prevents oral medication, with or without moderate diarrhoea, but without severe malaria criteria.

These patients should be admitted to a health centre for at least 24 hours of treatment and observation.

## First-line: injectable artesunate

The Rwanda guideline recommends:

- Patients weighing <20 kg: 3 mg/kg per dose.
- Patients weighing ≥20 kg: 2.4 mg/kg per dose.

Give IV or IM at:

- 0 hours.
- 12 hours.
- 24 hours.

After 24 hours, reassess the patient.

If symptoms improve and the patient can swallow and retain oral medication, switch to a complete three-day course of oral ACT.

If there is no improvement or the patient deteriorates, refer to the district hospital.

### Alternative: injectable artemether

If artesunate is unavailable or cannot be used:

- Loading dose: 3.2 mg/kg IM.
- Maintenance: 1.6 mg/kg IM once daily.

Use the anterior thigh for IM administration.

Continue for the appropriate initial period while assessing oral tolerance. Once the patient can swallow, complete a full three-day oral ACT course.

### Supportive treatment

Assess hydration carefully.

Use ORS if the patient can tolerate oral fluids. IV normal saline or Ringer's lactate may be needed according to the degree of dehydration.

Use antiemetics cautiously. Persistent vomiting should prompt reassessment and referral if necessary.

---

# 8. SEVERE MALARIA: EMERGENCY MANAGEMENT

Severe malaria requires urgent hospitalisation.

The first priority is to stabilise the patient while starting effective parenteral antimalarial treatment.

## 8.1. Initial assessment

Use an ABCDE approach.

**A: Airway**

Assess airway patency, particularly in patients with reduced consciousness or seizures.

**B: Breathing**

Assess respiratory rate, oxygen saturation, chest movement and signs of pulmonary oedema or acidosis.

**C: Circulation**

Assess pulse, blood pressure, capillary refill, peripheral temperature and perfusion.

Establish IV access and collect blood for investigations.

**D: Disability**

Assess GCS, pupils, seizures and bedside blood glucose.

**E: Exposure**

Measure temperature, look for pallor, jaundice, bleeding, dehydration and other possible sources of infection.

Do not delay treatment or referral while waiting for every investigation.

## 8.2. First-line antimalarial: IV or IM artesunate

Rwanda's 2024 guideline recommends:

- Body weight <20 kg: 3 mg/kg per dose.
- Body weight ≥20 kg: 2.4 mg/kg per dose.

Give at:

- 0 hours.
- 12 hours.
- 24 hours.
- Then once daily.

Continue parenteral treatment for a minimum of 24 hours once initiated, regardless of whether the patient becomes able to swallow earlier.

Continue parenteral artesunate until the patient can tolerate oral treatment, according to clinical response and the national protocol. The guideline allows continuation for a maximum of seven days.

Once the patient can tolerate oral medication, complete a full three-day course of ACT.

**Important:** Do not stop artesunate simply because the patient has become conscious or the fever has resolved. Complete the required parenteral phase and then the full oral ACT course.

## 8.3. Pre-referral treatment at a health centre

If severe malaria is confirmed and the patient requires transfer:

1. Give the appropriate single dose of injectable artesunate: 3 mg/kg if <20 kg or 2.4 mg/kg if ≥20 kg.
2. Record the exact dose and administration time.
3. Manage immediate complications, particularly hypoglycaemia, seizures and fever.
4. Arrange urgent transfer to the nearest district hospital.

Do not delay transfer while waiting for the patient to complete the artesunate schedule.

## 8.4. Alternative: injectable artemether

If artesunate is unavailable:

- Loading dose: 3.2 mg/kg IM.
- Maintenance dose: 1.6 mg/kg IM once daily.

Continue until oral medication can be tolerated, then complete a full three-day ACT course.

## 8.5. What about quinine?

Quinine is an antimalarial drug that has historically been used for uncomplicated and severe malaria.

It interferes with the parasite's ability to detoxify haem, a toxic product generated during haemoglobin digestion.

The parasite normally converts toxic free haem into an insoluble pigment called haemozoin. Quinine interferes with this process, allowing toxic haem-related products to accumulate and damage the parasite.

However, quinine has important disadvantages:
- It can stimulate insulin release and cause hypoglycaemia.
- It can cause cinchonism, including tinnitus, headache, nausea and visual disturbances.
- It can cause cardiac conduction abnormalities.
- It requires careful administration and monitoring.

The 2024 Rwanda guideline advises gradual phase-out of oral and injectable quinine. It should be avoided when recommended artemisinin-based options are available and reserved for situations specified by the national guideline, such as countrywide unavailability of the preferred options or allergy to artemisinin derivatives.

Therefore, do not routinely use the older 2022 quinine regimen as your first choice for severe malaria.

---

# 9. MANAGEMENT OF SPECIFIC COMPLICATIONS

## 9.1. Hypoglycaemia

Check bedside glucose immediately.

The Rwanda 2024 guideline gives intervention thresholds of:
- Children under 5 years: glucose <3.3 mmol/L (60 mg/dL).
- Older children and adults: glucose <3.9 mmol/L (70 mg/dL).

For adults:
- Give 20–50 mL of 50% dextrose IV over 5–10 minutes.

For children:
- Give 5 mL/kg of 10% glucose IV.
- If unavailable, dilute 1 mL/kg of 50% glucose in 4 mL/kg normal saline or 9 mL/kg of 5% glucose.

Recheck glucose after treatment and continue monitoring because hypoglycaemia can recur.

For an unconscious patient, do not give oral glucose because of aspiration risk.

Maintain glucose with an appropriate glucose-containing infusion when indicated.

## 9.2. Convulsions

A seizure in a malaria patient is an emergency.

First:
- Protect the airway.
- Position the patient safely.
- Give oxygen as indicated.
- Check bedside glucose.
- Treat hypoglycaemia if present.
- Look for other causes of seizures.

Rwanda 2024 pre-referral recommendations include:

Children:
- Diazepam 0.5 mg/kg rectally.

Adults:
- Diazepam 10 mg IV slowly.

If seizures persist, phenobarbital 10–15 mg/kg IM may be used according to the guideline.

Phenobarbital can cause respiratory depression. It should only be administered where respiratory support is available.

Persistent seizures require urgent hospital-level management.

## 9.3. Severe anaemia

Assess the patient's clinical condition, haemoglobin, haematocrit and signs of cardiovascular or respiratory compromise.

The Rwanda 2024 guideline recommends considering transfusion when:
- Haematocrit <18%.
- Haemoglobin <5.1 g/dL.
- Or clinical signs of cardiorespiratory distress are present, including pallor, tachypnoea and tachycardia.

The guideline gives the following paediatric transfusion volumes:
- Packed red blood cells: 10 mL/kg over approximately two hours.
- Whole blood: 20 mL/kg.
- In severe malnutrition, whole blood 10 mL/kg over at least three hours.

Use local transfusion protocols and monitor closely for fluid overload.

## 9.4. Acute pulmonary oedema

Management includes:
- Sit the patient upright, approximately 45 degrees.
- Give oxygen and monitor respiratory status.
- Stop unnecessary IV fluids.
- Assess for cardiac failure and renal impairment.
- Treat associated severe anaemia.
- Consider furosemide if clinically appropriate and fluid overload is present.

The Rwanda 2024 guideline gives:
- Furosemide 1 mg/kg; adult dose 40 mg.

In life-threatening hypoxaemia, the patient may require CPAP or mechanical ventilation.

Do not administer diuretics blindly to a patient who is intravascularly depleted or in shock.

## 9.5. Acute kidney injury

Management includes:
- Monitor urine output.
- Monitor creatinine, urea and electrolytes.
- Assess fluid balance.
- Correct dehydration carefully.
- Avoid nephrotoxic drugs where possible.
- Monitor for hyperkalaemia and metabolic acidosis.
- Refer for renal replacement therapy when indicated.

Indications for urgent dialysis include refractory hyperkalaemia, severe metabolic acidosis, pulmonary oedema from fluid overload, uraemic complications and persistent severe renal dysfunction.

## 9.6. Shock

In a malaria patient with shock, do not assume malaria is the only cause.

Consider bacterial sepsis, severe dehydration, bleeding and other causes.

Assess perfusion, blood pressure, capillary refill and lactate where available.

Take blood cultures when possible and initiate appropriate broad-spectrum antibiotics if bacterial sepsis is suspected.

Fluid resuscitation must be carefully guided by the patient's clinical condition because severe malaria is associated with pulmonary oedema and increased capillary permeability.

## 9.7. DIC and spontaneous bleeding

Investigate with:
- FBC and platelet count.
- PT/INR.
- aPTT.
- Fibrinogen.
- D-dimer.
- Liver function tests.

Treat the underlying severe malaria.

If there is significant bleeding, replace blood components according to the patient's clinical state and laboratory findings.

The Rwanda guideline includes fresh frozen plasma, platelets, cryoprecipitate and vitamin K in its management approach.

---

# 10. MALARIA IN PREGNANCY

Malaria during pregnancy can cause maternal anaemia, severe maternal disease, placental infection, fetal growth restriction, low birth weight and adverse pregnancy outcomes.

Pregnant women with fever should be tested for malaria.

## Simple malaria

The Rwanda 2024 guideline recommends:
- Artemether-lumefantrine (AL) in all trimesters.
- Dihydroartemisinin-piperaquine (DHAP) in all trimesters.
- Artesunate-pyronaridine (ASPY) in the second and third trimesters, but not the first trimester.

Use the standard weight-based ACT dose.

This is an important difference from the older 2022 guidance, which listed first-trimester AL as contraindicated.

## Simple malaria with minor digestive symptoms

Use injectable artesunate or the appropriate alternative, then complete a full oral ACT course once the patient can tolerate oral medication.

## Severe malaria

Treat immediately with injectable artesunate:

- 2.4 mg/kg IV or IM at 0 hours.
- Repeat at 12 hours.
- Repeat at 24 hours.
- Then once daily until oral treatment is possible.

Once improved, complete a full three-day oral ACT course.

Severe malaria in pregnancy requires hospital admission and close maternal and fetal monitoring.

---

# 11. WHEN TO ADMIT, REFER OR DISCHARGE

This is the practical decision-making section.

## 11.1. Discharge: uncomplicated malaria

A patient with simple malaria may be discharged when:
- Haemodynamically stable.
- No severe malaria manifestations.
- Able to swallow and retain oral medication.
- No significant dehydration or other complication.
- Appropriate ACT has been prescribed.
- The patient understands the dosing schedule and can return if symptoms worsen.

Provide counselling on completing treatment and returning if danger signs develop.

## 11.2. Admit or observe: minor digestive symptoms

Admit for at least 24 hours at the health centre for injectable treatment and observation.

Discharge only after:
- Clinical improvement.
- Adequate oral tolerance.
- No emerging severe malaria signs.
- A complete oral ACT regimen has been arranged.

If there is no improvement or the patient deteriorates, refer to the district hospital.

## 11.3. Refer or admit: severe malaria

All patients with severe malaria require urgent hospital-level care.

Refer urgently if there is:
- Altered consciousness.
- Recurrent convulsions.
- Hypoglycaemia.
- Severe anaemia.
- Acute kidney injury.
- Respiratory distress or pulmonary oedema.
- Shock.
- Significant bleeding.
- Severe acidosis.
- Hyperparasitaemia.

Patients who need dialysis, intensive care, mechanical ventilation or blood products should be transferred to a facility capable of providing these services.

**Never discharge a patient with severe malaria simply because the fever has settled.** Discharge requires clinical recovery, completion of the appropriate parenteral treatment phase, transition to oral ACT and assessment of any complications.

---

# 12. PREVENTION AND COUNSELLING

Prevention focuses on reducing mosquito bites and controlling mosquito populations.

Important interventions include:
- Sleeping under long-lasting insecticide-treated nets.
- Indoor residual spraying where indicated.
- Removing stagnant water and mosquito breeding sites.
- Using protective clothing and repellents.
- Early testing and treatment of fever.
- Malaria prevention interventions during antenatal care.
- Malaria vaccination programmes where eligible and available under national policy.

Explain to patients that early testing and completing the prescribed antimalarial course help prevent complications and reduce the risk of treatment failure.

---

# 13. IMPORTANT CLINICAL PEARLS

1. Fever does not equal malaria. Confirm malaria parasitologically.

2. A positive malaria test does not automatically mean severe malaria. Assess for organ dysfunction and danger signs.

3. Vomiting that prevents oral treatment is classified separately from severe malaria in Rwanda's guidelines.

4. Always check blood glucose in a patient with altered consciousness or seizures.

5. In a malaria patient with sudden sweating, tremors and palpitations, consider hypoglycaemia, particularly if receiving quinine.

6. Dark urine may indicate haemoglobinuria from intravascular haemolysis. Investigate for blackwater fever and AKI.

7. Pink frothy sputum suggests advanced pulmonary oedema and requires urgent respiratory assessment.

8. ARDS is caused by inflammatory injury and increased alveolar-capillary permeability. It is not simply ordinary fluid overload.

9. Thrombocytopenia alone does not diagnose DIC.

10. Severe malaria requires parenteral artesunate, followed by a complete oral ACT course.

11. Avoid unnecessary IV fluid loading in severe malaria because pulmonary oedema can develop.

12. Quinine is no longer the routine first-line treatment in Rwanda when recommended artemisinin-based options are available.

---

# 14. A PRACTICAL APPROACH TO A PATIENT WITH SUSPECTED MALARIA

When a patient presents with fever, use this sequence:

**Step 1: Assess the patient.**

Check vital signs, hydration, mental status, respiratory distress, perfusion and ability to drink.

**Step 2: Confirm malaria.**

Request an RDT or blood smear according to facility level and availability.

**Step 3: Classify the malaria.**

- Simple malaria: stable, no severe signs, tolerates oral medication.
- Simple malaria with minor digestive symptoms: vomiting prevents oral treatment, without severe signs.
- Severe malaria: parasitological confirmation plus at least one recognised severity manifestation.

**Step 4: Investigate according to severity.**

For simple malaria, confirm the diagnosis and assess clinically.

For severe malaria, request FBC, glucose, renal function, electrolytes, blood gas where available, and other investigations guided by complications.

**Step 5: Start treatment.**

- Simple: weight-based oral ACT.
- Minor digestive symptoms: injectable artesunate, observation and transition to oral ACT.
- Severe: urgent admission, injectable artesunate and management of complications.

**Step 6: Decide the appropriate disposition.**

Discharge uncomplicated malaria when safe, observe or admit minor digestive cases, and urgently refer or admit severe malaria.

**Step 7: Counsel and arrange follow-up.**

Explain the full medication schedule, warning signs and when to return.

---

# 15. REFERENCES

1. Rwanda Biomedical Centre. Rwanda Integrated Malaria Control Guidelines, Edition 2024. Ministry of Health, Republic of Rwanda.
2. Rwanda Standard Treatment Guidelines, Internal Medicine, 2022. Used as the historical foundation for the classification and clinical discussion.
3. World Health Organization. WHO Guidelines for Malaria. Consult the current WHO living guideline when applying recommendations beyond the Rwanda national protocol.

**Important clinical note:** These notes are for medical education and clinical revision. Always verify the latest national protocol, drug formulation, patient weight, pregnancy status, contraindications and facility capacity before prescribing. The 2024 Rwanda guideline is the principal dosing reference used here.
