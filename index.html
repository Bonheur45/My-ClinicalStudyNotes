# PNEUMONIA: CLINICAL MASTERCLASS

# 1. Definition: what exactly is pneumonia?

Pneumonia is an infection of the lung parenchyma, particularly the alveoli and surrounding lung tissue.

To understand this, remember the normal structure of the lungs:

- The bronchi carry air into the lungs.
- The bronchioles distribute air into smaller airways.
- The alveoli are tiny air sacs where oxygen enters the blood and carbon dioxide leaves it.

In pneumonia, microorganisms reach the lower respiratory tract and trigger an inflammatory response.

White blood cells, fluid, proteins and sometimes cellular debris accumulate in the affected alveoli. This material is called **inflammatory exudate**.

The alveoli that should contain air become partially or completely filled with inflammatory material.

This produces several consequences:

1. Less air reaches the affected alveoli.
2. Oxygen transfer into the blood becomes impaired.
3. The affected lung tissue becomes denser, producing consolidation.
4. The patient develops symptoms such as cough, fever, dyspnoea and sometimes chest pain.

## Pneumonia versus pneumonitis

These terms are related but not identical.

- **Pneumonia:** infection of the lung, usually involving inflammatory exudate in the alveoli.
- **Pneumonitis:** inflammation of lung tissue, particularly the interstitium, which may be infectious or non-infectious.

For example, aspiration of gastric acid can cause chemical pneumonitis without an initial bacterial infection.

**Important:** Pneumonia is not always purely alveolar, and pneumonitis is not always purely interstitial. There is overlap in real clinical disease.

# 2. Bronchopneumonia: what does the name mean?

Bronchopneumonia describes a pattern of infection that begins around the bronchi and bronchioles and spreads into adjacent alveoli.

Instead of affecting one continuous lobe, it produces multiple scattered areas of inflammation and consolidation.

Think of it this way:

- **Lobar pneumonia:** relatively continuous consolidation involving a large part of one lobe.
- **Bronchopneumonia:** multiple patchy areas of consolidation distributed around small airways, potentially involving several lobes.

The distinction is mainly anatomical and radiological. It does not reliably tell you which organism is responsible or which antibiotic to prescribe.

# 3. Classification of pneumonia

Pneumonia can be classified in several ways. These classifications answer different clinical questions.

## 3.1. According to where the infection was acquired

**A. Community-acquired pneumonia (CAP)**

Pneumonia acquired outside the hospital or presenting before the patient has been in hospital long enough for the infection to be considered hospital-acquired.

Common organisms include:

- *Streptococcus pneumoniae*
- *Haemophilus influenzae*
- *Mycoplasma pneumoniae*
- Respiratory viruses
- *Staphylococcus aureus* in selected situations

This is the main type addressed by the treatment pathways in your notes.

**B. Hospital-acquired pneumonia (HAP)**

Pneumonia developing at least 48 hours after hospital admission, which was not incubating at admission.

Why is this important?

Hospitalised patients may be exposed to organisms with greater antibiotic resistance. The likely pathogens and empirical antibiotics therefore differ from those used for ordinary CAP.

**C. Ventilator-associated pneumonia (VAP)**

Pneumonia developing more than 48 hours after endotracheal intubation.

The endotracheal tube bypasses normal airway defence mechanisms and can become colonised by bacteria, which may then enter the lower respiratory tract.

**D. Aspiration pneumonia**

This occurs when material from the mouth or stomach enters the lower respiratory tract and causes infection.

Aspiration is more likely in patients with:

- Reduced consciousness.
- Stroke with dysphagia.
- Seizures.
- Alcohol intoxication.
- Neuromuscular disorders.
- Impaired swallowing or cough reflexes.

An important distinction:

- Aspiration of gastric acid can initially cause chemical pneumonitis, which is inflammation rather than necessarily bacterial infection.
- Aspiration of bacteria-containing oral secretions can cause bacterial aspiration pneumonia.

Do not automatically prescribe additional anaerobic coverage for every aspiration event. It is particularly considered when there is lung abscess or empyema.

## 3.2. According to the causative organism

**A. Bacterial pneumonia**

Common bacterial causes include:

| Organism | Clinical relevance |
| --- | --- |
| *Streptococcus pneumoniae* | A major cause of community-acquired bacterial pneumonia |
| *Haemophilus influenzae* | Particularly associated with COPD and smoking |
| *Staphylococcus aureus* | Can cause severe pneumonia, including after influenza |
| *Klebsiella pneumoniae* | Important in selected patients, including those with alcoholism and certain comorbidities |
| *Moraxella catarrhalis* | Associated particularly with COPD |
| *Pseudomonas aeruginosa* | Important in patients with structural lung disease and previous respiratory isolation |
| Oral anaerobes | May contribute to aspiration-associated abscesses |

**B. Viral pneumonia**

Viruses infect respiratory epithelial cells, producing inflammation and damage to the respiratory tract.

Examples include:

- Influenza virus.
- Respiratory syncytial virus (RSV).
- SARS-CoV-2.
- Adenovirus.
- Human metapneumovirus.

Why does viral pneumonia sometimes lead to bacterial pneumonia?

Viral infection damages respiratory epithelium, impairs mucociliary clearance and alters local immune defence. Bacteria can then attach to the damaged airway and invade the lower respiratory tract.

This explains secondary bacterial pneumonia following influenza.

**C. Fungal pneumonia**

Fungal pneumonia is particularly important in immunocompromised patients.

Examples:

- *Aspergillus*: may cause invasive pulmonary aspergillosis, particularly in patients with profound immunosuppression.
- *Pneumocystis jirovecii*: causes Pneumocystis pneumonia (PCP), particularly in patients with advanced HIV and low CD4 counts.
- *Cryptococcus*: can cause pulmonary disease and disseminated infection.
- *Histoplasma*: causes pulmonary infection following inhalation of spores in endemic areas.

**Clinical point:** A patient with HIV and progressive dyspnoea, dry cough, fever and hypoxaemia may have Pneumocystis pneumonia rather than ordinary bacterial CAP. The treatment is completely different.

## 3.3. According to the radiological pattern

**Lobar pneumonia:** relatively homogeneous consolidation involving a lobe.

**Bronchopneumonia:** scattered, patchy areas of consolidation around bronchi and bronchioles.

**Interstitial or atypical pattern:** inflammation is more prominent in the interstitium and around the alveoli rather than producing dense alveolar consolidation.

Atypical pneumonia is commonly associated with *Mycoplasma pneumoniae*, *Chlamydia pneumoniae* and *Legionella pneumophila*.

Why is it called atypical?

Historically, these infections often presented with a less typical clinical picture and patchy or interstitial radiological changes. The organisms also differ from typical extracellular bacteria in their biology and susceptibility to antibiotics.

For example, *Mycoplasma pneumoniae* lacks a cell wall. Therefore, beta-lactam antibiotics such as amoxicillin and ceftriaxone cannot effectively treat it.

This is one reason a macrolide such as azithromycin may be added to a beta-lactam in selected patients.

# 4. Aetiology: how do risk factors help predict the organism?

You should not memorise the risk-factor table as an isolated list. Understand why each risk factor changes the likely organism.

| Risk factor | Organisms to consider | Why? |
| --- | --- | --- |
| Alcohol dependence | *S. pneumoniae*, *Klebsiella*, oral anaerobes | Alcohol can impair consciousness, swallowing and cough reflexes, increasing aspiration risk |
| COPD and smoking | *H. influenzae*, *M. catarrhalis*, *S. pneumoniae* | Damaged mucociliary clearance allows airway pathogens to persist |
| Bronchiectasis | *Pseudomonas*, *S. aureus* | Structurally abnormal airways retain secretions and become chronically colonised |
| Recent influenza | *S. aureus*, *S. pneumoniae*, *H. influenzae* | Viral damage to airway epithelium predisposes to secondary bacterial infection |
| Bird exposure | *Chlamydia psittaci* | Inhalation of contaminated bird secretions or droppings can cause psittacosis |
| Farm animal exposure | *Coxiella burnetii* | Inhalation of contaminated aerosols can cause Q fever |
| Lung abscess | Oral anaerobes and other bacteria | Aspiration introduces oral organisms into the lung, causing necrosis and abscess formation |
| Previous respiratory isolation of MRSA or *Pseudomonas* | The previously isolated organism | Previous isolation is a strong clue that the organism may recur |

**Important:** A risk factor raises suspicion; it does not prove the organism is present. Antibiotic selection should also consider illness severity, previous microbiology, local resistance and available investigations.

# 5. Pathophysiology: how pneumonia produces its symptoms and signs

This is one of the most important sections because it connects the disease mechanism to the clinical examination.

## 5.1. How does the infection reach the alveoli?

The respiratory tract has several protective mechanisms:

- Nasal hairs filter large particles.
- Mucus traps microorganisms.
- Cilia move mucus upwards towards the pharynx.
- Cough expels foreign material.
- Alveolar macrophages engulf microorganisms that reach the alveoli.

Pneumonia develops when microorganisms overcome these defences.

The common route is inhalation of infected droplets or aspiration of colonised upper-airway secretions.

Once organisms reach the alveoli, alveolar macrophages recognise them and release inflammatory mediators.

Neutrophils migrate into the alveoli, capillary permeability increases, and protein-rich fluid accumulates.

The result is alveolar consolidation.

## 5.2. Why does pneumonia cause fever?

Macrophages and other immune cells release cytokines such as IL-1, IL-6 and TNF-alpha.

These stimulate prostaglandin E2 production in the hypothalamus, raising the body's temperature set point.

The patient develops fever, chills and sometimes rigors.

## 5.3. Why does pneumonia cause cough?

Inflammation and secretions irritate airway sensory receptors.

This activates the cough reflex, which attempts to remove mucus, inflammatory material and microorganisms from the respiratory tract.

The cough may initially be dry. As secretions accumulate, it may become productive.

## 5.4. Why does pneumonia cause sputum production?

Neutrophils, mucus, cellular debris and inflammatory fluid accumulate in the airways.

When the patient coughs, this material is expelled as sputum.

Sputum may be:

- Mucoid: mainly mucus.
- Purulent: contains many neutrophils and cellular debris.
- Blood-streaked: may occur due to inflamed, damaged airway mucosa.

Yellow or green sputum reflects inflammatory cells, particularly neutrophils. It does not independently prove bacterial pneumonia.

## 5.5. Why does pneumonia cause dyspnoea?

Remember that alveoli are the sites of gas exchange.

When alveoli fill with inflammatory exudate, ventilation of the affected regions decreases.

However, blood may continue flowing through their pulmonary capillaries.

This creates a ventilation-perfusion mismatch.

In severely affected alveoli, ventilation may be almost absent while perfusion continues. This is an intrapulmonary shunt.

Consequently, poorly oxygenated blood enters the pulmonary veins and mixes with oxygenated blood from healthy lung regions.

The overall arterial oxygen level falls, producing hypoxaemia.

The patient develops tachypnoea and breathlessness as the body attempts to compensate.

## 5.6. Why does pneumonia cause pleuritic chest pain?

The lungs themselves have very limited pain sensation.

The parietal pleura, however, is pain-sensitive.

When infection or inflammation extends to the pleural surface, the parietal pleura becomes irritated.

Breathing, coughing and movement cause the inflamed pleural layers to move against each other, producing sharp chest pain.

This is called pleuritic chest pain.

## 5.7. Why do we hear crackles?

In pneumonia, fluid and inflammatory material accumulate in alveoli and small airways.

During inspiration, small airways and alveolar units may open suddenly, producing brief discontinuous sounds.

These are called **crackles**.

They are often heard over the affected lung region.

## 5.8. Why do we hear bronchial breath sounds over consolidation?

Normally, breath sounds heard over peripheral lung tissue are soft and relatively low-pitched because the air-filled alveoli filter and dampen sound transmitted from the larger airways.

In consolidation, alveoli become filled with fluid and inflammatory material.

The consolidated tissue transmits sound from the patent bronchial tree more effectively.

Consequently, breath sounds become louder, harsher and more bronchial in character over the affected area.

This is called bronchial breathing.

Other signs of consolidation include:

- Increased tactile vocal fremitus.
- Increased vocal resonance.
- Dullness to percussion.

Why does vocal fremitus increase?

The denser consolidated lung transmits vibrations generated by the patient's voice more effectively than normal air-filled lung tissue.

Why is percussion dull?

The affected region contains less air and more fluid and cellular material, so it produces a duller percussion note.

# 6. Clinical presentation and examination

The typical presentation of CAP includes:

- Cough, with or without sputum.
- Fever.
- Dyspnoea.
- Pleuritic chest pain.
- Fatigue and malaise.

Older adults may present atypically with confusion, falls, weakness or reduced appetite rather than obvious fever and cough.

## 6.1. History: what should you ask?

**Duration and progression:** When did the cough start? Is it worsening? Was the onset sudden or gradual?

This helps establish the time course and may suggest alternative diagnoses.

**Fever:** Ask about measured temperature, chills and rigors. These support infection but are not specific to pneumonia.

**Sputum:** Ask about amount, colour, purulence and blood. Haemoptysis requires assessment for pneumonia complications, TB, malignancy and pulmonary embolism.

**Breathlessness:** Ask whether it occurs at rest or during exertion and whether it is worsening. This helps assess severity.

**Chest pain:** Pleuritic pain suggests pleural irritation. Pressure-like pain requires consideration of cardiac causes.

**Risk factors:** Ask about smoking, COPD, asthma, HIV, diabetes, alcohol use, previous TB, recent hospitalisation and previous antibiotic use.

**Exposure history:** Ask about sick contacts, influenza outbreaks, birds, farm animals and travel where relevant.

**Medication history:** Ask about corticosteroids, immunosuppressants, antibiotics and drug allergies.

## 6.2. Physical examination

Start with vital signs:

- Temperature.
- Respiratory rate.
- Heart rate.
- Blood pressure.
- Oxygen saturation.

Respiratory rate is particularly important because tachypnoea can be an early sign of serious respiratory disease.

Examine the patient for:

**General appearance:** distress, inability to speak full sentences, cyanosis, confusion and exhaustion.

**Inspection:** asymmetrical chest movement, use of accessory muscles and intercostal recession.

**Palpation:** reduced chest expansion and increased tactile vocal fremitus over consolidation.

**Percussion:** dullness over consolidated lung.

**Auscultation:** crackles, bronchial breath sounds and increased vocal resonance.

Remember that not every patient with pneumonia has all the classic signs. A normal auscultation does not reliably exclude pneumonia.

# 7. Investigations: what do we order and why?

## 7.1. Chest X-ray

Chest X-ray is the primary imaging investigation in your Rwanda guideline.

It helps identify:

- Consolidation.
- Distribution of infiltrates.
- Multilobar involvement.
- Pleural effusion.
- Cavitation.
- Alternative diagnoses.

### What does consolidation look like?

Consolidation appears as an area of increased whiteness because air in the alveoli has been replaced by inflammatory material.

An air bronchogram may be visible: dark branching air-filled bronchi surrounded by white consolidated lung.

**Important:** A chest X-ray supports the diagnosis but does not identify the organism. It also cannot reliably distinguish bacterial from viral pneumonia on its own.

### Why is CT not routinely performed?

CT is more sensitive than plain radiography and can identify complications such as:

- Lung abscess.
- Necrotising pneumonia.
- Pulmonary gangrene.
- Complicated pleural disease.
- Pulmonary infarction or malignancy mimicking pneumonia.

However, CT is more expensive and exposes the patient to more radiation.

Therefore, it is reserved for situations where the result is likely to change management.

### Why not repeat a chest X-ray routinely?

Radiological resolution often takes longer than clinical recovery.

A patient can become afebrile, breathe comfortably and recover clinically while the chest X-ray still shows residual opacity.

Therefore, routine repeat imaging is unnecessary when symptoms resolve as expected.

Repeat imaging is considered when the patient fails to improve, deteriorates, has suspected complications or has persistent symptoms that raise concern for an alternative diagnosis such as malignancy or TB.

## 7.2. Chest ultrasound

Lung ultrasound can identify:

- Subpleural consolidation.
- Pleural effusion.
- Septations within pleural fluid.
- Pulmonary oedema.
- Pneumothorax.

Why is it useful?

It can be performed at the bedside, does not use ionising radiation and is particularly useful for identifying and guiding drainage of pleural effusions.

However, accuracy depends on operator skill, equipment and the location of the lesion. It cannot reliably visualise every deep lesion that does not reach the pleural surface.

## 7.3. Full blood count

**White blood cells:** neutrophilic leukocytosis may support bacterial infection, but a normal WBC does not exclude pneumonia.

Leukopenia can occur in severe infection and is one of the minor criteria for severe CAP.

**Haemoglobin:** identifies pre-existing or associated anaemia, which can worsen tissue oxygen delivery.

**Platelets:** thrombocytopenia may occur in severe infection and is also a severity marker.

## 7.4. Urea and creatinine

These assess renal function.

Raised urea is included in CURB-65 and severe CAP criteria because it may indicate dehydration, renal impairment or systemic illness.

Creatinine helps identify acute kidney injury and guides antibiotic dose adjustment.

## 7.5. Electrolytes

Sodium is particularly relevant because hyponatraemia may accompany severe infection, including Legionella pneumonia.

Electrolyte abnormalities can also affect cardiac function and influence the safety of medications.

## 7.6. Blood glucose

Check glucose because infection can cause stress hyperglycaemia, while poor intake or diabetes medications can cause hypoglycaemia.

Marked hyperglycaemia is also included in the PSI score.

## 7.7. CRP and ESR

These are inflammatory markers.

CRP can help support the presence of inflammation and may be useful when following selected patients.

However, neither CRP nor ESR independently confirms pneumonia or identifies its cause.

## 7.8. Sputum microscopy and culture

Sputum microscopy can identify inflammatory cells and organisms. Culture may identify the causative bacterium and its antibiotic susceptibility.

It is particularly useful in:

- Severe CAP.
- Suspected MRSA or *Pseudomonas*.
- Previous isolation of resistant organisms.
- Failure of empirical treatment.

Do not delay initial antibiotics in a critically ill patient while waiting for sputum results.

## 7.9. Blood cultures

Blood cultures can identify bacteria that have entered the bloodstream.

They are particularly useful in severe CAP and when resistant pathogens are suspected.

They are not routinely necessary in every uncomplicated outpatient.

## 7.10. ECG and other investigations

An ECG is useful when there is chest pain, arrhythmia, suspected cardiac involvement or a need to assess QT interval before certain antibiotics.

Depending on the presentation, consider:

- Arterial blood gas: assesses oxygenation, ventilation and acid-base status.
- Lactate: helps assess tissue hypoperfusion in suspected sepsis.
- HIV testing: according to consent and national testing policy, particularly where immunosuppression would change the differential diagnosis.
- TB investigations: when symptoms, imaging or epidemiological risk suggest pulmonary TB.
- Influenza or SARS-CoV-2 testing: when clinically and epidemiologically indicated.

# 8. Differential diagnosis: what else can look like pneumonia?

Do not diagnose pneumonia simply because a patient has cough, fever and abnormal breath sounds.

| Differential | Features that help distinguish it |
| --- | --- |
| Pulmonary TB | Cough lasting weeks, weight loss, night sweats, haemoptysis and TB exposure; imaging may show upper-lobe disease or cavitation |
| Heart failure | Orthopnoea, paroxysmal nocturnal dyspnoea, raised JVP, peripheral oedema and bilateral pulmonary congestion |
| Pulmonary embolism | Sudden dyspnoea, pleuritic pain, tachycardia, hypoxaemia and risk factors for venous thromboembolism |
| COPD exacerbation | Known COPD, worsening breathlessness, wheeze and increased sputum; pneumonia may coexist |
| Asthma exacerbation | Episodic wheeze, chest tightness and reversible airflow obstruction |
| Lung cancer | Persistent cough, haemoptysis, weight loss or recurrent pneumonia in the same location |
| Atelectasis | Collapse of lung tissue, often with volume loss and displacement of structures towards the affected side |

**Rwanda clinical reminder:** TB is an important differential diagnosis. Do not label prolonged cough, weight loss and upper-lobe cavitation as ordinary bacterial pneumonia without investigating TB.

Also be careful with fluoroquinolones: levofloxacin and moxifloxacin have activity against *Mycobacterium tuberculosis*. Giving them empirically to someone with unrecognised TB can temporarily improve symptoms, delay diagnosis and potentially contribute to resistance.

# 9. Severity assessment: who can go home and who needs admission?

The diagnosis of pneumonia tells you what the patient has. Severity assessment tells you where and how urgently to treat them.

Your guideline discusses two important tools: PSI and CURB-65.

## 9.1. CURB-65

**CURB-65: one point for each feature**

| Letter | Clinical feature |
| --- | --- |
| C | New confusion |
| U | Urea >7 mmol/L |
| R | Respiratory rate ≥30/min |
| B | Blood pressure: systolic <90 mmHg or diastolic ≤60 mmHg |
| 65 | Age ≥65 years |

**Interpretation**

- 0–1: often suitable for outpatient treatment if otherwise safe.
- 2: consider hospital admission or closely supervised assessment.
- ≥3: severe disease; urgent hospital assessment and consideration of intensive care.

Clinical judgement overrides the score. Hypoxaemia, inability to take oral medication, unstable comorbidities or poor social support may require admission even with a low score.

Why does each feature matter?

- Confusion suggests cerebral dysfunction from hypoxaemia, sepsis or metabolic disturbance.
- Raised urea may indicate dehydration, renal dysfunction or severe systemic illness.
- Respiratory rate ≥30 suggests significant respiratory compromise.
- Low blood pressure suggests circulatory failure.
- Age ≥65 increases the risk of adverse outcomes.

## 9.2. Pneumonia Severity Index (PSI)

PSI estimates 30-day mortality and helps decide whether hospitalisation is needed.

It uses:

- Age and sex.
- Nursing-home residence.
- Comorbidities.
- Vital signs.
- Laboratory results.
- Oxygenation.
- Pleural effusion.

Your table gives points for individual features. Add them to calculate the score, except that Class I is identified using a separate low-risk screening rule.

| PSI class | Score | Usual disposition |
| --- | --- | --- |
| I | Low-risk screening group | Outpatient |
| II | ≤70 | Outpatient if clinically appropriate |
| III | 71–90 | Observation or individualised admission |
| IV | 91–130 | Hospital admission |
| V | >130 | Hospital admission; assess for ICU based on clinical condition |

**Important correction:** PSI Class V does not automatically mean ICU admission. It indicates high mortality risk and a need for hospitalisation. ICU decisions are based on respiratory or circulatory failure and clinical assessment.

Why does your guideline prefer PSI over CURB-65?

PSI identifies more patients as low risk and has better overall discrimination for mortality in the populations in which it was validated. However, it is more complicated to calculate.

In practice, CURB-65 is quicker at the bedside, while PSI is more comprehensive.

## 9.3. Severe community-acquired pneumonia

Your notes include the ATS/IDSA criteria.

**Severe CAP**

**One major criterion OR at least three minor criteria**

**Major criteria**

1. Septic shock requiring vasopressors.
2. Respiratory failure requiring mechanical ventilation.

**Minor criteria**

1. Respiratory rate ≥30/min.
2. PaO₂/FiO₂ ≤250.
3. Multilobar infiltrates.
4. Confusion or disorientation.
5. Blood urea nitrogen ≥20 mg/dL.
6. Leukopenia below 4,000 cells/µL.
7. Platelets below 100,000/µL.
8. Hypothermia below 36°C.
9. Hypotension requiring aggressive fluid resuscitation.

Why are these criteria important?

They identify patients who have significant respiratory failure, circulatory compromise or systemic organ dysfunction.

A patient with either major criterion requires immediate ICU-level assessment. Three or more minor criteria indicate severe CAP and should prompt higher-level care assessment.

Do not wait for the patient to accumulate three minor criteria if they are clinically deteriorating.

# 10. MANAGEMENT: choosing the right treatment and understanding why

This is the most important section.

The first principle is that **not every patient with pneumonia needs the same antibiotic**.

Your choice depends on:

1. Whether the patient has CAP or hospital-acquired pneumonia.
2. Whether the patient is stable enough for outpatient treatment.
3. The organisms most likely to cause the infection.
4. The patient's comorbidities and risk factors.
5. Previous antibiotic exposure and microbiology.
6. Local antimicrobial resistance patterns.

The antibiotic regimens below are adult regimens from the CAP treatment pathways in your supplied Rwanda 2022 guideline, which draws heavily on the 2019 ATS/IDSA recommendations. They are educational starting regimens, not a substitute for checking the current hospital protocol and local susceptibility data.

## 10.1. First understand the antibiotics we use

### A. Amoxicillin

**Dose: 1 g orally every 8 hours.**

**Why choose it?**

Amoxicillin is a beta-lactam antibiotic. It inhibits bacterial cell-wall synthesis by binding penicillin-binding proteins.

It is particularly useful against susceptible *Streptococcus pneumoniae*, an important cause of CAP.

It is a reasonable outpatient choice when:

- The patient has uncomplicated CAP.
- There are no important comorbidities requiring broader coverage.
- There is no serious penicillin allergy.
- Local susceptibility supports its use.

**Why not use it for every pneumonia?**

Amoxicillin does not reliably cover organisms such as *Mycoplasma pneumoniae*, because Mycoplasma has no cell wall.

It also does not reliably cover beta-lactamase-producing *H. influenzae*.

### B. Doxycycline

**Dose: 100 mg orally every 12 hours.**

**Why choose it?**

Doxycycline inhibits bacterial protein synthesis by binding the 30S ribosomal subunit.

It provides activity against:

- *Mycoplasma pneumoniae*.
- *Chlamydia pneumoniae*.
- Some susceptible *S. pneumoniae*.
- Some susceptible *H. influenzae*.

It is useful as an alternative outpatient treatment when appropriate.

**Important precautions:**

- Avoid in pregnancy unless a specialist determines a compelling indication.
- Avoid in children under 8 years in routine use.
- It can cause oesophagitis, so administer with sufficient water and advise the patient not to lie down immediately after taking it.
- It can cause photosensitivity.

### C. Azithromycin

**Dose: 500 mg orally on day 1, followed by 250 mg once daily on days 2–5.**

**Why choose it?**

Azithromycin is a macrolide. It binds the 50S ribosomal subunit and inhibits bacterial protein synthesis.

It is useful against atypical organisms, particularly:

- *Mycoplasma pneumoniae*.
- *Chlamydia pneumoniae*.
- *Legionella pneumophila*.

This explains why it is combined with a beta-lactam in many hospitalised patients.

**Why not use azithromycin alone in everyone?**

Pneumococcal resistance to macrolides can make it unreliable as sole treatment.

The 2019 ATS/IDSA guideline permits macrolide monotherapy for uncomplicated outpatient CAP only where local pneumococcal macrolide resistance is below 25%.

Do not assume that threshold is met in Rwanda without local data.

Other precautions include QT prolongation, potential arrhythmias and drug interactions.

### D. Amoxicillin-clavulanate

**Dose options from your guideline:**

- 500 mg/125 mg orally every 8 hours, or
- 875 mg/125 mg orally every 12 hours.

**Why choose it?**

Amoxicillin kills susceptible bacteria by inhibiting cell-wall synthesis.

Some bacteria produce beta-lactamase enzymes that destroy amoxicillin.

Clavulanate inhibits many of these enzymes, protecting amoxicillin.

This combination broadens coverage against beta-lactamase-producing organisms, including some strains of *H. influenzae* and *Moraxella catarrhalis*.

It is useful in outpatient CAP when comorbidities increase the likelihood of these organisms.

It does not reliably cover atypical organisms. That is why your guideline combines it with azithromycin, clarithromycin or doxycycline.

### E. Ceftriaxone

**Dose: 1–2 g IV once daily for CAP.**

**Why choose it?**

Ceftriaxone is a third-generation cephalosporin. It inhibits bacterial cell-wall synthesis.

It provides useful coverage against common typical CAP bacteria, particularly susceptible pneumococci and many strains of *H. influenzae*.

It is convenient for hospitalised patients because it can be administered once daily.

**Why combine it with azithromycin?**

Ceftriaxone does not reliably treat atypical pathogens such as Mycoplasma and Legionella.

Azithromycin provides that additional coverage.

Therefore:

**Ceftriaxone + azithromycin = coverage of common typical bacteria + atypical bacteria.**

### F. Ampicillin-sulbactam

**Dose: 1.5–3 g IV every 6 hours.**

Ampicillin inhibits bacterial cell-wall synthesis.

Sulbactam inhibits many beta-lactamase enzymes.

The combination provides coverage against susceptible pneumococci, *H. influenzae* and selected oral organisms.

It is another beta-lactam option for inpatient CAP.

### G. Cefotaxime

**Dose: 1–2 g IV every 8 hours.**

Cefotaxime is a third-generation cephalosporin with a similar role to ceftriaxone in CAP.

It is an alternative beta-lactam when ceftriaxone is unsuitable or when local protocols favour it.

### H. Levofloxacin

**Dose: 750 mg orally or IV once daily.**

**Why choose it?**

Levofloxacin is a respiratory fluoroquinolone.

It inhibits bacterial DNA gyrase and topoisomerase IV, enzymes required for bacterial DNA replication.

It has activity against:

- *S. pneumoniae*.
- *H. influenzae*.
- *Mycoplasma*.
- *Chlamydia pneumoniae*.
- *Legionella*.

It can therefore provide both typical and atypical coverage as a single agent.

However, it is not automatically better than a beta-lactam plus macrolide.

Important precautions:

- Tendonitis and tendon rupture.
- QT prolongation.
- Dysglycaemia.
- CNS adverse effects.
- Peripheral neuropathy.
- Selection of resistant organisms.

**Very important in Rwanda:** investigate possible pulmonary TB before choosing a fluoroquinolone for a patient with prolonged cough or other TB features. Fluoroquinolones can partially suppress TB and delay its diagnosis.

### I. Moxifloxacin

**Dose: 400 mg orally or IV once daily.**

Moxifloxacin is another respiratory fluoroquinolone with activity against typical and atypical CAP pathogens.

Its limitations include QT prolongation and other fluoroquinolone adverse effects.

It is not appropriate as a substitute for a TB diagnostic work-up.

## 10.2. Treatment of uncomplicated outpatient CAP

Imagine an adult who presents with:

- Fever.
- Cough.
- Mild dyspnoea.
- Chest X-ray showing a focal infiltrate.
- Normal blood pressure.
- No hypoxaemia.
- No confusion.
- No significant comorbidity.
- Ability to eat, drink and take medication.

The patient has uncomplicated CAP and may be suitable for outpatient management.

### First choice: amoxicillin

**Amoxicillin 1 g orally every 8 hours.**

Why?

Because *S. pneumoniae* is a major cause of CAP, and amoxicillin provides appropriate treatment for susceptible pneumococci.

It is narrow enough to avoid unnecessary broad-spectrum antibiotic exposure.

### Alternative: doxycycline

**Doxycycline 100 mg orally every 12 hours.**

Choose it when appropriate, particularly if atypical pathogens are suspected or beta-lactam treatment is unsuitable.

### Alternative: azithromycin

**500 mg orally on day 1, then 250 mg once daily on days 2–5.**

Use as monotherapy only if local pneumococcal resistance is sufficiently low and the patient is an appropriate low-risk candidate.

## 10.3. Outpatient CAP with comorbidities

Now imagine the patient has CAP and also has:

- Diabetes.
- Chronic kidney disease.
- COPD.
- Chronic heart failure.
- Chronic liver disease.
- Malignancy.

Why does this change treatment?

These patients have a greater likelihood of complications and may have a wider range of bacterial pathogens.

For example, COPD increases the likelihood of *H. influenzae* and *Moraxella catarrhalis*.

The antibiotic should therefore cover more than just susceptible pneumococci.

### Option 1: beta-lactam plus atypical coverage

One of the following beta-lactams:

- Amoxicillin-clavulanate 500/125 mg orally every 8 hours, or
- Amoxicillin-clavulanate 875/125 mg orally every 12 hours, or
- Cefuroxime 500 mg orally every 12 hours.

Combine with ONE of the following:

- Azithromycin 500 mg on day 1, then 250 mg daily, or
- Clarithromycin 500 mg every 12 hours, or
- Doxycycline 100 mg every 12 hours.

**Why combine them?**

The beta-lactam covers typical bacteria, including susceptible pneumococci and *H. influenzae*.

The macrolide or doxycycline adds coverage for atypical organisms.

Do not combine azithromycin and clarithromycin. They are alternatives, not drugs to administer together.

### Option 2: respiratory fluoroquinolone

One of:

- Levofloxacin 750 mg once daily, or
- Moxifloxacin 400 mg once daily.

Why is this an alternative?

A respiratory fluoroquinolone can cover both typical and atypical organisms, avoiding the need for two separate antibiotics.

However, weigh its adverse effects, interactions, TB risk and local susceptibility before prescribing.

## 10.4. Hospitalised non-severe CAP

A patient may need admission even without severe CAP criteria because of:

- Hypoxaemia.
- Inability to tolerate oral medication.
- Significant comorbidities.
- Dehydration.
- Poor response to outpatient therapy.
- Inadequate home support.

Your guideline recommends either:

### Regimen A: beta-lactam plus macrolide

Choose ONE beta-lactam:

- Ceftriaxone 1–2 g IV once daily, or
- Cefotaxime 1–2 g IV every 8 hours, or
- Ampicillin-sulbactam 1.5–3 g IV every 6 hours, or
- Ceftaroline 600 mg IV every 12 hours.

AND choose ONE macrolide:

- Azithromycin 500 mg IV or orally once daily, or
- Clarithromycin 500 mg IV or orally every 12 hours.

**Why this combination?**

The beta-lactam treats common typical bacteria, especially pneumococcus.

The macrolide provides coverage against atypical organisms such as Mycoplasma, Chlamydia pneumoniae and Legionella.

### Regimen B: respiratory fluoroquinolone monotherapy

One of:

- Levofloxacin 750 mg IV or orally once daily, or
- Moxifloxacin 400 mg IV or orally once daily.

**Why?**

These agents provide coverage against typical and atypical CAP pathogens.

They are alternatives to the beta-lactam plus macrolide combination, not an additional drug to automatically add to it.

## 10.5. Severe CAP

Severe CAP is different because the patient may have life-threatening respiratory failure or septic shock.

Admit to hospital and assess for ICU care.

Your guideline recommends:

### Standard empirical treatment

**Beta-lactam + macrolide**, or

**Beta-lactam + respiratory fluoroquinolone.**

For example:

- Ceftriaxone 2 g IV once daily.
- Azithromycin 500 mg IV once daily.

Why?

The patient may have a high bacterial burden, and delayed effective treatment can be dangerous.

The combination covers common typical and atypical pathogens while microbiological results are pending.

The choice must be adjusted for allergy, renal function, local susceptibility and clinical context.

### Do we automatically add vancomycin or meropenem?

No.

Broad-spectrum antibiotics should not be added simply because the patient is severely ill.

They are added when there is a meaningful risk of resistant pathogens.

This is important because unnecessary broad-spectrum antibiotics increase adverse effects, *Clostridioides difficile* infection and antimicrobial resistance.

## 10.6. When do we cover MRSA?

MRSA means methicillin-resistant *Staphylococcus aureus*.

It is resistant to most conventional beta-lactam antibiotics.

Consider empirical MRSA coverage particularly when the patient has:

- Previous respiratory isolation of MRSA.
- Recent hospitalisation and IV antibiotic exposure with additional locally validated risk factors.
- A clinical picture strongly suggesting staphylococcal pneumonia, such as severe necrotising pneumonia following influenza.

Your guideline provides:

**Vancomycin**

- 15 mg/kg IV every 12 hours as an initial regimen.
- Adjust according to renal function, drug exposure and therapeutic monitoring.

OR

**Linezolid**

- 600 mg IV or orally every 12 hours.

Why choose these drugs?

Vancomycin inhibits bacterial cell-wall synthesis and is used for serious MRSA infections.

Linezolid inhibits protein synthesis by acting on the 50S ribosomal subunit. It has excellent pulmonary penetration.

Important monitoring:

- Vancomycin: renal function and drug exposure.
- Linezolid: platelet count, blood count, drug interactions and risk of serotonin syndrome.

Once cultures and other tests show MRSA is unlikely, stop unnecessary MRSA coverage.

## 10.7. When do we cover Pseudomonas aeruginosa?

Pseudomonas is a Gram-negative organism that can cause severe pneumonia, particularly in patients with structural lung disease.

Consider it when there is:

- Previous respiratory isolation of *Pseudomonas*.
- Bronchiectasis or other significant structural lung disease.
- Recent hospitalisation and IV antibiotics with locally validated additional risk factors.

Your guideline lists the following antipseudomonal beta-lactams:

| Antibiotic | Dose from your guideline |
| --- | --- |
| Piperacillin-tazobactam | 4.5 g IV every 6 hours |
| Cefepime | 2 g IV every 8 hours |
| Ceftazidime | 2 g IV every 8 hours |
| Imipenem | 500 mg IV every 6 hours |
| Meropenem | 1 g IV every 8 hours |
| Aztreonam | 2 g IV every 8 hours |

Why these drugs?

They are selected because they have activity against susceptible *Pseudomonas* strains.

Their use depends on local susceptibility patterns, renal function, allergy history and severity.

**Do not combine all these drugs.** They are alternatives. Select an appropriate agent according to the clinical situation and local antibiogram.

If MRSA risk is also present, add a separate MRSA-active agent.

## 10.8. Aspiration pneumonia: when do we add anaerobic coverage?

Aspiration introduces bacteria from the oropharynx into the lungs.

Oral anaerobes can contribute to infection, particularly when aspiration is recurrent or there is poor dentition.

However, not every aspiration event causes anaerobic infection.

Your practical approach:

- Chemical aspiration pneumonitis without evidence of bacterial infection: do not automatically give antibiotics.
- Aspiration pneumonia without abscess or empyema: use an appropriate CAP regimen.
- Lung abscess or empyema: ensure the chosen regimen covers relevant anaerobes, and assess the need for drainage.

Amoxicillin-clavulanate or ampicillin-sulbactam may be useful because they cover many oral anaerobes as well as common aerobic bacteria.

## 10.9. Viral pneumonia: should we give antibiotics?

Antibiotics do not treat viruses.

For example, amoxicillin does not kill influenza virus, and ceftriaxone does not treat SARS-CoV-2.

Management depends on the virus:

- Influenza: consider oseltamivir when indicated.
- COVID-19: follow the current national treatment protocol according to severity.
- RSV: primarily supportive treatment in most immunocompetent adults.

However, bacterial co-infection can occur.

A patient with severe CAP and a positive viral test should not automatically have antibiotics withheld. Assess the likelihood of bacterial co-infection.

The 2025 ATS update recommends considering viral test results, clinical findings and risk of bacterial co-infection when deciding on antibiotics.

## 10.11. Supportive management: what else must we do?

Antibiotics treat the infection, but they do not immediately correct hypoxaemia, dehydration, respiratory distress or shock.

### Oxygen therapy

Give supplemental oxygen when the patient is hypoxaemic.

Why?

Pneumonia causes ventilation-perfusion mismatch and sometimes intrapulmonary shunting, reducing arterial oxygen.

Oxygen increases the oxygen concentration in inspired air and improves oxygen delivery to adequately ventilated alveoli.

Titrate oxygen to the patient's target saturation.

For most acutely ill adults, a target of 94–98% is appropriate. For patients at risk of hypercapnic respiratory failure, such as some patients with COPD, use a target of 88–92% while assessing blood gases.

### Fluids

If the patient is dehydrated or hypotensive, restore circulation with appropriate IV fluids and reassess frequently.

Why reassess?

Excessive fluid administration can worsen pulmonary oedema, especially in patients with heart failure or renal impairment.

### Fever and pain

Paracetamol 500–1,000 mg orally every 6–8 hours as required may be used in adults, respecting the maximum daily dose and reducing it in patients with liver disease or other risk factors.

It reduces fever and discomfort. It does not treat the infection itself.

### Nutrition and hydration

Ensure adequate oral fluid and nutritional intake.

If the patient is too breathless or has reduced consciousness, assess swallowing and aspiration risk before oral feeding.

### Thromboprophylaxis

Hospitalised patients with reduced mobility may require pharmacological VTE prevention, such as low-molecular-weight heparin, if their bleeding risk and renal function permit.

This prevents hospital-associated DVT and pulmonary embolism. It is not a treatment for pneumonia itself.

### Corticosteroids

Do not routinely give systemic corticosteroids to every patient with CAP.

The 2025 ATS guideline recommends against routine systemic corticosteroids in non-severe inpatient CAP, but conditionally suggests them in selected severe CAP patients, excluding influenza pneumonia. The decision depends on timing, severity, contraindications and the local protocol.

Corticosteroids may also be indicated for a separate condition, such as a COPD or asthma exacerbation.

## 10.12. Duration of antibiotics and switching from IV to oral

Your Rwanda 2022 guideline recommends a total of **at least 5 days for most uncomplicated CAP**, guided by clinical stability.

The patient should demonstrate:

- Improving temperature.
- Heart rate and respiratory rate returning towards normal.
- Stable blood pressure.
- Adequate oxygenation.
- Ability to eat and drink.
- Normal or baseline mental status.

Why not stop when the fever resolves?

Fever may improve before the infection has been adequately controlled. Clinical stability is a better measure than temperature alone.

When the patient is improving and can take oral medication, switch from IV to an appropriate oral agent.

For example:

- IV ceftriaxone can be stepped down to an appropriate oral beta-lactam, depending on the suspected or identified organism and susceptibility.
- IV azithromycin can be changed to oral azithromycin when tolerated.

For suspected or confirmed MRSA or *Pseudomonas* CAP, your 2022 guideline recommends 7 days, subject to clinical response and complications.

The 2025 ATS guideline now allows a shorter course, at least 3 days, for selected clinically stable adults with non-severe CAP. It still suggests 5 or more days for severe CAP. For your clinical practice, follow the Rwanda national protocol and individualise treatment rather than shortening treatment automatically.

# 11. Monitoring: how do you know treatment is working?

Do not simply prescribe antibiotics and wait.

Reassess the patient regularly.

## What should improve?

- Temperature should begin to settle.
- Respiratory rate should decrease.
- Oxygen saturation should improve.
- Heart rate should decrease.
- Breathlessness should improve.
- The patient should regain appetite and energy.
- Blood pressure and mental status should remain stable.

Most patients begin to improve within 48–72 hours after appropriate treatment.

## What if the patient is not improving?

Do not automatically change ceftriaxone to meropenem.

First, ask why the patient is not responding.

**1. Is the diagnosis correct?**

Consider pulmonary TB, pulmonary embolism, heart failure, malignancy or another infection.

**2. Is the organism resistant to the antibiotic?**

Review previous antibiotic exposure, culture results and local susceptibility data.

**3. Has a complication developed?**

Consider:

- Parapneumonic effusion.
- Empyema.
- Lung abscess.
- Necrotising pneumonia.
- Respiratory failure.
- Sepsis.

**4. Is there another source of infection?**

For example, a urinary tract infection or bloodstream infection may coexist.

**5. Is the patient receiving the correct dose?**

Check the dose, route, administration, adherence, absorption and renal adjustment.

Failure to achieve clinical stability within approximately five days should prompt reassessment rather than simply extending the same antibiotic.

# 12. Complications of pneumonia

Understanding complications helps you recognise patients who need urgent intervention.

## 12.1. Parapneumonic effusion

This is fluid accumulating in the pleural space as a consequence of pneumonia.

Inflammation spreads from the infected lung to the pleura, increasing capillary permeability and causing fluid to accumulate.

A small uncomplicated effusion may resolve with antibiotics.

A large or complicated effusion may require drainage.

## 12.2. Empyema

Empyema is pus within the pleural space.

Bacteria invade the pleural fluid, producing intense inflammation and sometimes septations that divide the fluid into separate pockets.

The patient may have persistent fever, pleuritic pain and failure to improve despite appropriate antibiotics.

**Management:** antibiotics plus drainage of the infected pleural collection when indicated.

## 12.3. Lung abscess

A lung abscess is a localised cavity containing pus and necrotic lung tissue.

It develops when infection causes tissue destruction.

Common associations include aspiration, oral anaerobes and certain bacterial infections.

Clinical features may include prolonged fever, productive cough, foul-smelling sputum and weight loss.

Chest imaging may show a cavity with an air-fluid level.

Treatment requires prolonged, appropriately selected antibiotics and assessment for drainage or other intervention if the patient fails to respond.

## 12.4. Necrotising pneumonia

This occurs when infection causes destruction of lung parenchyma, resulting in multiple areas of tissue necrosis and sometimes cavitation.

It may occur with organisms such as *Staphylococcus aureus*, including post-influenza infection.

It can cause severe sepsis and respiratory failure.

## 12.5. Respiratory failure

When extensive alveolar damage prevents adequate oxygen transfer, the patient develops hypoxaemic respiratory failure.

Signs include:

- Severe dyspnoea.
- Tachypnoea.
- Low oxygen saturation.
- Cyanosis in advanced cases.
- Exhaustion and altered consciousness.

These patients need urgent escalation of respiratory support.

## 12.6. Sepsis and septic shock

Severe infection can trigger a dysregulated systemic inflammatory response, causing circulatory and cellular dysfunction.

When vasodilation and capillary leakage cause persistent circulatory failure requiring vasopressors despite adequate fluid resuscitation, the patient has septic shock.

This requires urgent critical care.

# 13. When to discharge, admit or refer

This is how you translate the knowledge into clinical decisions.

## Outpatient: Discharge with treatment

Appropriate when the patient:

- Has low predicted mortality risk.
- Has stable vital signs.
- Has satisfactory oxygenation.
- Can take oral medication and fluids.
- Has no serious unstable comorbidity.
- Has reliable follow-up and support.

## Hospital admission: Admit for observation and treatment

Consider when there is:

- Moderate or high PSI/CURB-65 risk.
- Hypoxaemia.
- Inability to take oral medication.
- Significant dehydration.
- Unstable comorbidity.
- Failure of outpatient treatment.
- A complication requiring hospital management.

## Urgent escalation: ICU or higher-level referral

Particularly when there is:

- Respiratory failure requiring mechanical ventilation.
- Septic shock requiring vasopressors.
- Severe CAP with multiple minor criteria and deterioration.
- Rapidly worsening hypoxaemia.
- Severe organ dysfunction.
- Complications requiring interventions unavailable at the current facility.

Do not base discharge on a score alone. The patient's oxygenation, clinical stability, ability to take medication and social circumstances matter.

# 14. A practical clinical approach to an adult presenting with suspected pneumonia

Imagine a patient arriving at the hospital with fever, productive cough and difficulty breathing.

This is the sequence I want you to follow.

1. **First: assess ABCDE and vital signs.** Check airway, respiratory effort, respiratory rate, oxygen saturation, pulse, blood pressure, temperature and mental status. Identify respiratory failure or shock immediately.
2. **Second: establish whether pneumonia is likely.** Take a focused history and perform a respiratory examination. Look for focal crackles, bronchial breathing, dullness to percussion and other evidence of consolidation.
3. **Third: investigate.** Obtain a chest X-ray where available. Request FBC, renal function and other tests according to severity. Obtain cultures in severe disease or when resistant pathogens are suspected.
4. **Fourth: assess severity.** Calculate CURB-65 or PSI where appropriate. Assess the severe CAP criteria and do not overlook hypoxaemia or clinical deterioration.
5. **Fifth: choose empirical treatment.** Select an antibiotic regimen based on outpatient versus inpatient status, comorbidities, likely organisms, allergy, previous microbiology and local resistance.
6. **Sixth: provide supportive treatment.** Give oxygen if hypoxaemic, correct dehydration carefully, manage fever and pain, and address complications.
7. **Seventh: reassess.** Look for clinical improvement within 48–72 hours. If the patient deteriorates or fails to stabilise, investigate resistance, complications and alternative diagnoses.
8. **Finally: determine disposition and follow-up.** Discharge only when safe, admit patients who need monitoring or IV treatment, and refer those requiring critical care or interventions beyond the facility's capacity.

# 15. Important corrections and clinical cautions from your source

These are points I particularly want you to retain:

1. **Bronchopneumonia is a distribution pattern, not a specific organism.** You cannot select an antibiotic simply because the X-ray says bronchopneumonia.
2. **Atypical pneumonia does not mean mild pneumonia.** Legionella, for example, can cause severe disease.
3. **PSI Class V does not automatically mean ICU.** It means high mortality risk and hospitalisation. ICU decisions depend on respiratory failure, shock and overall clinical condition.
4. **Macrolide monotherapy is not appropriate for every outpatient.** Pneumococcal resistance matters.
5. **Not every aspiration event needs antibiotics or anaerobic coverage.** Distinguish chemical pneumonitis from bacterial aspiration pneumonia.
6. **Do not routinely cover MRSA or Pseudomonas.** Use patient-specific and locally validated risk factors.
7. **Do not use a fluoroquinolone casually in a patient with possible TB.** It can mask the disease and delay diagnosis.
8. **Do not repeat chest X-rays just because you want to see whether the opacity has disappeared.** Clinical recovery usually precedes radiological resolution.
9. **Do not automatically broaden antibiotics when the patient is not improving.** Investigate the reason first.
10. **Adjust antibiotic doses for renal impairment when necessary.** This is particularly important with amoxicillin-clavulanate, cefepime, piperacillin-tazobactam, levofloxacin and vancomycin.

# 16. The references and guidelines

Your supplied material is based mainly on:

1. Rwanda Standard Treatment Guidelines, Internal Medicine, 2022.
2. Lee MS et al. Guideline for Antibiotic Use in Adults with Community-acquired Pneumonia. *Infection & Chemotherapy*. 2018.
3. Metlay JP et al. ATS/IDSA Guideline for Diagnosis and Treatment of Adults with Community-acquired Pneumonia. *American Journal of Respiratory and Critical Care Medicine*. 2019.

There is also a newer ATS guideline from 2025, which updates selected areas including antibiotic duration, lung ultrasound, viral-positive CAP and corticosteroids.

# Final clinical takeaways

If you remember only the central logic, remember this:

- Pneumonia fills alveoli with inflammatory exudate, causing consolidation and impaired gas exchange.
- *S. pneumoniae* is an important typical CAP pathogen, which explains the role of amoxicillin.
- Beta-lactams do not cover Mycoplasma because it lacks a cell wall, which explains the role of macrolides or doxycycline.
- Ceftriaxone plus azithromycin covers common typical and atypical organisms in hospitalised CAP.
- MRSA and Pseudomonas coverage should be driven by meaningful risk factors, not given automatically.
- Oxygenation, haemodynamic stability and organ dysfunction determine urgency and disposition.
- Treatment response must be assessed clinically, not just by whether the fever has disappeared.

**One important prescribing qualification:** The doses above are adult examples. Before prescribing, check the current Rwanda facility protocol, renal and hepatic function, pregnancy status, allergies, drug interactions, available formulations and local antibiogram. Severe pneumonia, pregnancy, advanced HIV and immunocompromised patients need additional individual assessment.

# Let's test your clinical reasoning

A 62-year-old man presents with fever, productive cough and right-sided pleuritic chest pain. His chest X-ray shows right lower-lobe consolidation. He has COPD and diabetes. His BP is 125/80 mmHg, respiratory rate 22/min, temperature 38.5°C, HR 105/min and SpO₂ 94% on room air. He is alert and tolerating oral medication.

**Would you automatically prescribe amoxicillin alone, or would you choose a broader regimen? More importantly, explain why.**

I want you to reason from the likely organisms and the patient's comorbidities, not simply recall an antibiotic list.
