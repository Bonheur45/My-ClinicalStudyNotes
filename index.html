# STROKE AND TRANSIENT ISCHAEMIC ATTACK (TIA)
## Clinical study notes

# 1. Definitions

## What is a stroke?

A stroke is an acute neurological injury caused by interruption of blood supply to part of the brain or bleeding into or around the brain.

The brain needs a continuous supply of oxygen and glucose. When blood flow is interrupted, brain cells become deprived of energy, their normal function fails and, if the interruption persists, they become irreversibly damaged.

A stroke typically presents with sudden-onset neurological deficits, such as:

- Weakness or paralysis of one side of the body.
- Facial drooping.
- Speech disturbance.
- Loss of vision.
- Loss of balance or coordination.
- Reduced consciousness in some cases.

**Important:** Stroke is a medical emergency. The priority is to identify the type of stroke quickly because treatments for ischaemic and haemorrhagic stroke are different.

## What is a TIA?

A transient ischaemic attack is a temporary episode of neurological dysfunction caused by focal brain, spinal cord or retinal ischaemia, **without evidence of acute infarction**.

In simple terms, blood supply to an area of the brain temporarily decreases, causing neurological symptoms, but there is no established acute tissue infarction.

Symptoms may resolve within minutes, but this does not mean the patient is safe.

A TIA is an important warning that the patient may develop a full stroke, particularly in the following hours and days.

**Important correction:** Your notes define TIA as symptoms lasting less than 24 hours. That is the older time-based definition. Modern practice uses a tissue-based definition: absence of acute infarction, regardless of whether symptoms lasted minutes or several hours.

A patient whose symptoms resolve must still receive urgent assessment.

# 2. Classification of stroke

Stroke is broadly classified into two major types:

**A. Ischaemic stroke**

Occurs when an artery supplying the brain becomes blocked, reducing or stopping blood flow to the affected brain tissue.

Approximately 80–85% of strokes are ischaemic in many populations.

**B. Haemorrhagic stroke**

Occurs when a blood vessel ruptures, causing blood to escape into or around brain tissue. The bleeding can damage brain cells directly and increase intracranial pressure.

Approximately 15–20% of strokes in many populations.

## 2.1. Ischaemic stroke

There are two important mechanisms.

**A. Small-vessel disease (lacunar stroke)**

Small penetrating arteries supply deep structures of the brain, including the basal ganglia, thalamus, internal capsule and pons.

Long-standing hypertension and diabetes damage the walls of these small arteries. The walls become thickened and the lumen narrows or becomes blocked.

This produces a small area of infarction called a lacunar infarct.

Typical presentations include:

- Pure motor weakness, affecting the face, arm and leg on one side.
- Pure sensory loss.
- Combined sensorimotor symptoms.
- Ataxic hemiparesis.

A lacunar stroke may occur without aphasia or visual field loss because it usually affects deep structures rather than the cerebral cortex.

**B. Large-vessel atherosclerotic or thromboembolic stroke**

Large arteries, such as the carotid arteries and middle cerebral artery, can become narrowed by atherosclerosis.

Atherosclerosis is the accumulation of cholesterol, inflammatory cells and fibrous tissue within the arterial wall, forming an atherosclerotic plaque.

Two things can happen:

1. The plaque progressively narrows the artery, reducing blood flow.
2. The plaque ruptures, activating platelets and coagulation, producing a thrombus that blocks the artery.

A clot can also form elsewhere, such as in the heart, travel through the circulation and lodge in a cerebral artery. This is an embolic stroke.

## 2.2. Cardioembolic stroke

A particularly important cause is atrial fibrillation.

Normally, atrial contraction helps move blood into the ventricles. In atrial fibrillation, the atria contract in an irregular, ineffective manner.

Blood can stagnate, particularly in the left atrial appendage, allowing a thrombus to form.

Part of the thrombus may detach, travel through the aorta and carotid circulation, and block a cerebral artery.

Other cardiac sources include:

- Left ventricular thrombus, especially after myocardial infarction.
- Dilated cardiomyopathy with intracardiac thrombus.
- Prosthetic or diseased heart valves.
- Infective endocarditis, where infected vegetations can embolise.

**Clinical implication:** A patient with an apparently embolic stroke needs an ECG and cardiac assessment to look for atrial fibrillation or another cardiac source.

## 2.3. Haemorrhagic stroke

The main types of spontaneous haemorrhagic stroke are:

**A. Intracerebral haemorrhage (ICH)**

Blood leaks directly into the brain tissue following rupture of a blood vessel.

Chronic hypertension damages small penetrating arteries, making them susceptible to rupture. Cerebral amyloid angiopathy is another important cause, particularly in older adults.

The resulting haematoma:

- Destroys or compresses nearby brain tissue.
- Produces surrounding oedema.
- Increases intracranial pressure.
- May expand, worsening neurological damage.

**B. Subarachnoid haemorrhage (SAH)**

Blood enters the subarachnoid space, which lies between the arachnoid and pia mater and normally contains cerebrospinal fluid.

A common spontaneous cause is rupture of an intracranial saccular (berry) aneurysm.

The characteristic presentation is a sudden, extremely severe headache, often described as the worst headache of the patient's life.

Other features include neck stiffness, photophobia, vomiting and loss of consciousness.

**C. Extradural (epidural) haematoma**

Blood accumulates between the skull and dura mater, commonly after head trauma.

A middle meningeal artery injury, often associated with a temporal bone fracture, is a classic mechanism.

The patient may initially lose consciousness, recover temporarily (a lucid interval), and then deteriorate as the haematoma expands.

This is a traumatic intracranial haemorrhage, not a typical spontaneous stroke.

**D. Subdural haematoma**

Blood accumulates between the dura mater and arachnoid mater.

It commonly results from tearing of bridging veins, particularly after head trauma.

In older people, cerebral atrophy stretches these veins, making them more vulnerable to injury.

The presentation may be gradual, with headache, confusion, drowsiness or weakness developing over days or weeks.

Like extradural haematoma, it is usually classified as traumatic intracranial bleeding rather than spontaneous stroke.

# 3. Causes and risk factors

A risk factor is something that increases the likelihood of developing a disease. It does not necessarily mean that the patient already has the disease.

## 3.1. Hypertension

Hypertension is one of the most important modifiable risk factors for both ischaemic and haemorrhagic stroke.

How does it cause ischaemic stroke?

Long-term high pressure damages the endothelium, promoting atherosclerosis and small-vessel disease. These changes increase the risk of arterial narrowing and thrombosis.

How does it cause haemorrhagic stroke?

Persistent high pressure damages small penetrating arteries. Their walls become weakened and may develop lipohyalinosis and microaneurysmal changes, making them susceptible to rupture.

## 3.2. Diabetes mellitus

Chronic hyperglycaemia damages blood vessels through oxidative stress, inflammation and endothelial dysfunction.

It accelerates atherosclerosis and increases the risk of arterial thrombosis.

Diabetes therefore increases the risk of ischaemic stroke, particularly when associated with hypertension and dyslipidaemia.

## 3.3. Hypercholesterolaemia

High LDL cholesterol contributes to the development of atherosclerotic plaques.

When plaques develop in the carotid or cerebral arteries, they can narrow the vessel or rupture and produce thrombosis.

## 3.4. Smoking

Smoking damages vascular endothelium, increases inflammation, promotes platelet activation and increases blood coagulability.

It therefore increases the risk of both atherosclerotic disease and thrombotic stroke.

## 3.5. Advanced age

With ageing, arteries become less elastic, atherosclerosis accumulates and atrial fibrillation becomes more common.

The risk of both ischaemic and haemorrhagic stroke increases.

## 3.6. Other important risk factors

Also consider:

- Previous stroke or TIA.
- Atrial fibrillation.
- Carotid artery stenosis.
- Heart failure and cardiomyopathy.
- Valvular heart disease.
- Obesity and physical inactivity.
- Excessive alcohol consumption.
- Certain prothrombotic conditions.

**Clinical pearl:** Hypertension, diabetes, smoking and dyslipidaemia are modifiable. Treating them reduces the risk of a first or recurrent stroke.

# 4. Symptoms and signs

## 4.1. The most important feature: sudden onset

Stroke classically presents with a sudden focal neurological deficit.

*Focal* means that a specific function or body region is affected because a particular part of the nervous system has been injured.

Examples include:

- Sudden weakness of the right arm and leg.
- Sudden facial drooping.
- Sudden inability to speak.
- Sudden loss of vision in one eye.
- Sudden loss of half of the visual field.
- Sudden severe imbalance or incoordination.

The location of the lesion determines the clinical presentation.

## 4.2. Why does a stroke cause one-sided weakness?

The motor cortex controls voluntary movement.

Motor fibres descend through the brainstem and cross mainly at the lower medulla, forming the corticospinal tract.

Consequently, a lesion in the left cerebral hemisphere usually produces weakness on the right side of the body, and a lesion in the right hemisphere usually produces weakness on the left.

This is called contralateral weakness.

## 4.3. Why can stroke cause speech problems?

The dominant cerebral hemisphere, usually the left, contains important language areas.

Two important examples are:

- **Broca's area:** responsible for producing fluent speech. Damage causes expressive aphasia. The patient understands relatively well but struggles to produce words.
- **Wernicke's area:** responsible for language comprehension. Damage causes receptive aphasia. The patient may speak fluently, but the speech may lack meaning and comprehension is impaired.

Dysarthria is different from aphasia. It is difficulty articulating words due to impaired control of the muscles used for speech.

## 4.4. Why can a stroke cause visual problems?

The visual pathway extends from the retina through the optic nerves, optic chiasm, optic tracts and optic radiations to the occipital cortex.

A lesion at different points produces different visual deficits.

For example:

- Retinal or optic nerve ischaemia may cause sudden monocular visual loss.
- Occipital cortex injury may cause loss of the same half of the visual field in both eyes, called homonymous hemianopia.

## 4.5. How does an ischaemic stroke evolve?

Some patients develop maximal neurological deficits immediately.

Others deteriorate over the first hours because:

- The thrombus extends.
- More tissue becomes ischaemic.
- Oedema develops.
- Collateral blood supply becomes insufficient.

Some patients improve because blood flow is partially restored or collateral circulation supplies the threatened tissue.

## 4.6. How does haemorrhagic stroke differ clinically?

Intracerebral haemorrhage can look very similar to ischaemic stroke. Both can produce sudden weakness, facial drooping and speech disturbance.

However, haemorrhagic stroke is more likely to be associated with:

- Severe headache.
- Vomiting.
- Early reduced consciousness.
- Rapid clinical deterioration.
- Markedly elevated blood pressure.

These features are clues, not reliable diagnostic rules. You cannot distinguish ischaemic from haemorrhagic stroke confidently through symptoms alone. Brain imaging is required.

## 4.7. Specific presentations of traumatic and subarachnoid haemorrhage

- **Extradural haematoma:** head trauma, possible lucid interval, followed by rapidly worsening consciousness.
- **Subdural haematoma:** minor trauma followed by gradual headache, confusion, drowsiness or weakness.
- **Subarachnoid haemorrhage:** sudden thunderclap headache, vomiting, neck stiffness, photophobia and sometimes coma.

## 4.8. Stroke mimics

A stroke mimic is a condition that produces symptoms resembling stroke but is not caused by an acute cerebrovascular event.

Important examples:

**Hypoglycaemia:** low glucose impairs brain function and may produce focal weakness, confusion, seizures or coma. Check bedside glucose immediately.

**Seizure:** a patient may have abnormal movements followed by temporary weakness, called Todd's paresis.

**Migraine:** particularly migraine with aura, which can cause temporary visual, sensory or speech disturbances.

**Syncope:** temporary loss of consciousness due to reduced cerebral perfusion. It usually causes global rather than persistent focal neurological dysfunction.

Other possibilities include brain tumours, infections, functional neurological disorders and electrolyte abnormalities.

## 4.9. FAST assessment

### FAST

**F – Face**

Ask the patient to smile. Is one side of the face drooping?

**A – Arms**

Ask the patient to raise both arms. Does one arm drift down or fail to rise?

**S – Speech**

Ask the patient to repeat a simple sentence. Is speech slurred or abnormal?

**T – Time**

Record the time symptoms began or when the patient was last known well, and arrange emergency assessment.

FAST is a screening tool, not a complete neurological examination. Posterior circulation strokes can present with severe dizziness, ataxia, diplopia or difficulty swallowing without obvious FAST abnormalities.

# 5. Clinical examination

## 5.1. General examination

Start by assessing:

- Level of consciousness.
- Airway and breathing.
- Pulse and blood pressure.
- Temperature.
- Oxygen saturation.
- Blood glucose.

Look for signs of trauma, dehydration, anaemia and cardiovascular disease.

## 5.2. Neurological examination

Assess:

- Consciousness using GCS.
- Pupillary size and reaction.
- Speech and language.
- Cranial nerves.
- Motor power.
- Muscle tone.
- Reflexes.
- Plantar responses.
- Sensation.
- Coordination.
- Gait, only if safe.

## 5.3. Upper motor neuron signs

Most cerebral strokes produce upper motor neuron (UMN) findings.

These may include:

- Weakness.
- Increased muscle tone, although tone may initially be reduced in acute stroke.
- Increased deep tendon reflexes, which may develop over time.
- Upgoing plantar response (Babinski sign).
- Loss of fine voluntary movement.

Why?

The brain normally sends descending signals that control and regulate spinal motor neurons. A lesion in the corticospinal pathway removes some of this regulation, eventually producing hyperreflexia and spasticity.

An important point: early after a major stroke, the affected limb may initially be flaccid with reduced reflexes. Do not exclude stroke because hyperreflexia is absent.

## 5.4. Cardiovascular examination

Examine the heart for murmurs and irregular rhythm.

An irregularly irregular pulse suggests atrial fibrillation.

A murmur may suggest valvular disease or endocarditis, both of which can be sources of emboli.

Listen over the carotid arteries for bruits.

A bruit is a sound produced by turbulent blood flow, often associated with arterial narrowing.

However, the absence of a bruit does not exclude carotid stenosis.

## 5.5. Fundoscopy

Look for:

- Hypertensive retinopathy.
- Retinal vascular abnormalities.
- Papilloedema where raised intracranial pressure is suspected.

Papilloedema is swelling of the optic disc caused by raised intracranial pressure. Its presence is a warning sign requiring urgent evaluation.

# 6. Complications of stroke

Complications arise from direct brain injury, immobility, impaired swallowing and associated cardiovascular disease.

## 6.1. Dysphagia and aspiration pneumonia

Dysphagia means difficulty swallowing.

A stroke may damage the cortical or brainstem pathways responsible for coordinating swallowing.

Food, saliva or fluids can then enter the airway instead of the oesophagus. This is called aspiration.

Aspiration can introduce bacteria and material into the lungs, causing aspiration pneumonia.

**Clinical implication:** Keep the patient nil by mouth until a swallowing screen has been completed and it is safe to give oral intake.

## 6.2. Deep vein thrombosis and pulmonary embolism

A paralysed patient moves less, causing venous blood to stagnate, particularly in the deep veins of the legs.

Stasis, endothelial injury and hypercoagulability contribute to thrombus formation.

A clot may detach, travel through the venous circulation and lodge in the pulmonary arteries, causing pulmonary embolism.

Prevention includes intermittent pneumatic compression and appropriate mobilisation. Pharmacological prophylaxis may be considered after assessing bleeding risk.

## 6.3. Dehydration and malnutrition

Patients may be unable to drink or eat because of dysphagia, reduced consciousness or dependence on caregivers.

This can lead to dehydration, electrolyte abnormalities and malnutrition.

Assess swallowing, fluid intake, nutritional status and weight.

## 6.4. Pressure sores

A patient who remains in one position for a long time experiences prolonged pressure over bony prominences.

This compresses small blood vessels and reduces tissue perfusion, leading to pressure injury.

Prevention includes regular repositioning, skin inspection, pressure-relieving surfaces and adequate nutrition.

## 6.5. Urinary tract infection

Stroke can impair bladder control and mobility. Urinary catheterisation can introduce bacteria into the urinary tract.

Avoid unnecessary catheterisation and remove catheters as soon as possible.

## 6.6. Seizures

A stroke can irritate cerebral neurons, particularly when the cortex is involved, causing abnormal electrical discharges.

Seizures may occur early or later after stroke.

## 6.7. Myocardial infarction and heart failure

Stroke and coronary artery disease share risk factors such as hypertension, diabetes and atherosclerosis.

Acute neurological injury can also cause cardiac stress and rhythm abnormalities.

Monitor for chest pain, ECG changes, arrhythmias and heart failure.

## 6.8. Death

Death may result from:

- Extensive brain infarction.
- Haemorrhage expansion.
- Cerebral oedema and herniation.
- Aspiration pneumonia.
- Pulmonary embolism.
- Sepsis.
- Cardiac complications.

# 7. Investigations

The investigation strategy has two main purposes:

1. Confirm the diagnosis and identify the type of stroke.
2. Identify the underlying cause and complications.

## 7.1. Blood glucose

This is one of the first tests.

Hypoglycaemia can mimic stroke and is rapidly treatable.

Hyperglycaemia is also important because significant glucose elevation is associated with poorer outcomes.

## 7.2. Full blood count

FBC assesses:

- Haemoglobin: anaemia may worsen cerebral oxygen delivery.
- White blood cells: may suggest infection or inflammation.
- Platelets: low platelet count increases bleeding risk and may affect eligibility for thrombolysis.

## 7.3. Electrolytes, urea and creatinine

Electrolyte abnormalities can cause neurological symptoms.

Renal function is important when selecting medications and planning contrast-enhanced vascular imaging.

## 7.4. Coagulation profile

Request PT/INR and aPTT when indicated, particularly if the patient:

- Uses warfarin or another anticoagulant.
- Has a bleeding disorder.
- May require thrombolysis.
- Has suspected haemorrhagic stroke.

Do not delay emergency imaging while waiting for routine laboratory results.

## 7.5. Lipid profile

Assess total cholesterol, LDL, HDL and triglycerides.

This helps identify dyslipidaemia and guide long-term cardiovascular risk reduction.

## 7.6. ESR and CRP

These are inflammatory markers.

They are not routine diagnostic tests for ordinary stroke. Request them when there is suspicion of inflammatory or infectious disease, such as vasculitis or endocarditis.

## 7.7. Brain imaging: the most important investigation

**Non-contrast CT brain is usually the first imaging investigation in an acute stroke.**

Why non-contrast?

Blood is usually visible on an early non-contrast CT because acute blood appears hyperdense (bright).

This allows clinicians to identify many acute intracranial haemorrhages without giving contrast.

An early ischaemic stroke, on the other hand, may appear normal on CT because the tissue changes can take time to become visible.

This is why a normal early CT does not exclude ischaemic stroke.

**What are we looking for?**

- Intracerebral haemorrhage.
- Subarachnoid haemorrhage.
- Large established infarction.
- Mass effect or midline shift.
- Other diagnoses such as tumour or subdural haematoma.

**MRI brain:** Diffusion-weighted imaging (DWI) is highly sensitive for acute cerebral infarction. It is particularly useful when CT is normal but clinical suspicion remains high, and in selected posterior circulation or small infarcts.

**CT angiography (CTA):** Shows the cerebral and neck arteries. It identifies large-vessel occlusion, arterial stenosis, aneurysms and some vascular malformations.

**CT perfusion:** Estimates which areas of brain are already infarcted and which may still be salvageable. It helps select some patients for extended-window reperfusion treatment.

## 7.8. ECG

An ECG identifies atrial fibrillation, previous myocardial infarction and other rhythm abnormalities.

A single normal ECG does not exclude intermittent atrial fibrillation. Some patients require prolonged cardiac rhythm monitoring.

## 7.9. Echocardiography

Assesses possible cardiac sources of emboli, including:

- Left ventricular thrombus.
- Reduced ejection fraction.
- Valvular disease.
- Intracardiac abnormalities.

## 7.10. Carotid ultrasound

Assesses carotid artery narrowing and atherosclerotic plaques.

Significant carotid stenosis can cause artery-to-artery embolism or reduced cerebral blood flow.

CTA or MRA may be used for further assessment and treatment planning.

# 8. Management of acute stroke

The first principle is to establish whether the patient has an ischaemic or haemorrhagic stroke.

Why?

In ischaemic stroke, treatment may involve restoring blood flow and preventing further clot formation.

In haemorrhagic stroke, the priority is to prevent further bleeding, manage intracranial pressure and reverse anticoagulation when appropriate.

Giving antiplatelet or thrombolytic medication to a patient with an intracranial haemorrhage can be dangerous.

## 8.1. Initial management: ABCDE

**A – Airway**

Assess airway patency. A patient with reduced consciousness may lose protective airway reflexes and aspirate.

Consider airway protection if the patient cannot maintain it.

**B – Breathing**

Assess respiratory rate and oxygen saturation.

Give oxygen if hypoxaemic. Do not routinely give supplemental oxygen to patients with normal oxygen saturation.

**C – Circulation**

Assess pulse, blood pressure and perfusion.

Establish IV access, obtain blood samples and treat hypotension or hypovolaemia.

**D – Disability**

Assess GCS, pupils, limb power and bedside glucose.

Document the exact time the patient was last known to be well.

**E – Exposure**

Check temperature, examine for trauma and look for other relevant findings.

## 8.2. Oxygen

Oxygen is given when the patient is hypoxaemic.

Why not give it routinely to everyone?

Excess oxygen in a patient who is already adequately oxygenated has not been shown to improve stroke outcome.

The aim is to prevent hypoxia, which would worsen cerebral tissue injury.

## 8.3. Fever

Fever increases metabolic demand and can worsen neurological injury.

Use paracetamol when indicated and investigate possible infection.

## 8.4. Blood glucose

Avoid both hypoglycaemia and marked hyperglycaemia.

Correct hypoglycaemia immediately.

Treat significant hyperglycaemia according to hospital protocols, avoiding overly intensive glucose lowering that could produce hypoglycaemia.

## 8.5. Positioning and aspiration prevention

Keep the patient in a position that protects the airway and supports breathing.

Head elevation may be appropriate for patients with reduced consciousness, aspiration risk or raised intracranial pressure, but it should be individualised.

Do not give oral food, water or medication until swallowing safety has been assessed.

## 8.6. Hydration and nutrition

Maintain adequate hydration, preferably with appropriate isotonic IV fluids when oral intake is unsafe or insufficient.

Avoid unnecessary hypotonic fluids because they can worsen cerebral oedema.

If swallowing is unsafe, use enteral nutrition when appropriate, often through a nasogastric tube.

## 8.7. Pressure care and mobilisation

Reposition patients who cannot move independently, inspect skin regularly and use pressure-relieving surfaces.

Begin rehabilitation and mobilisation when clinically safe, with physiotherapy and occupational therapy involvement.

Avoid aggressive mobilisation in the very early unstable phase.

# 9. Blood pressure management

This is one of the most important and commonly misunderstood aspects of acute stroke care.

## 9.1. Why don't we immediately lower blood pressure in ischaemic stroke?

When an artery becomes blocked, the area supplied by that artery loses blood flow.

The affected region has:

- An infarct core, where damage is severe and often irreversible.
- An ischaemic penumbra, where tissue is dysfunctional but may still be salvageable.

Blood pressure may help maintain blood flow to the penumbra through collateral vessels.

If you rapidly reduce systemic blood pressure, cerebral perfusion may fall further and more brain tissue may become infarcted.

This explains why a high blood pressure reading in acute ischaemic stroke is not automatically an indication for immediate treatment.

## 9.2. Ischaemic stroke without reperfusion treatment

If the patient is not receiving thrombolysis or thrombectomy and there is no other urgent indication to lower blood pressure:

- Generally avoid acute lowering when BP is below 220/120 mmHg.
- If BP is ≥220/120 mmHg, cautious reduction may be considered, commonly aiming for about a 15% reduction over the first 24 hours.

The purpose is to avoid an abrupt reduction in cerebral perfusion.

## 9.3. Ischaemic stroke when thrombolysis is planned

The blood pressure requirements are stricter because high BP increases the risk of bleeding after thrombolysis.

- Before IV thrombolysis: BP must be below 185/110 mmHg.
- After IV thrombolysis: maintain BP below 180/105 mmHg for at least 24 hours.

## 9.4. Intracerebral haemorrhage

The problem is different.

Here, high blood pressure may contribute to continued bleeding and haematoma expansion.

For selected patients with mild-to-moderate spontaneous ICH and systolic BP between 150 and 220 mmHg, lowering systolic BP towards 140 mmHg and maintaining it around 130–150 mmHg may be reasonable.

Avoid reducing systolic BP below 130 mmHg in this setting because excessive lowering may be harmful.

These are hospital-based decisions requiring careful monitoring. Large or severe haemorrhages require individualised management.

**The central difference:**

- Ischaemic stroke: avoid reducing BP unnecessarily because cerebral perfusion may depend on it.
- Haemorrhagic stroke: carefully lower BP in appropriate patients to reduce the risk of further bleeding.

# 10. Specific treatment of ischaemic stroke

## 10.1. Intravenous thrombolysis

The correct term is **thrombolytic therapy**, not antithrombolytic therapy.

Thrombolysis means dissolving an existing blood clot to restore blood flow to the brain.

The drugs activate plasminogen into plasmin, an enzyme that breaks down fibrin, the protein framework holding a clot together.

Two important agents are:

**A. Alteplase (recombinant tissue plasminogen activator, rt-PA)**

Dose:

0.9 mg/kg IV, maximum 90 mg

- Give 10% as an IV bolus over one minute.
- Give the remaining 90% as an infusion over 60 minutes.

**B. Tenecteplase**

Dose:

0.25 mg/kg IV, maximum 25 mg

Given as a single IV bolus.

### Time window

The standard window for IV thrombolysis is **within 4.5 hours of symptom onset or last known well**, provided the patient meets eligibility criteria.

Some patients presenting later, including selected patients with unknown onset or 4.5–9 hours from last known well, may qualify based on advanced imaging.

The 6-hour window in your notes is not the standard IV thrombolysis window.

### Important contraindications and precautions

Examples include:

- Intracranial haemorrhage on CT.
- Active significant bleeding.
- Uncontrolled BP above the permitted threshold.
- Certain recent intracranial operations or serious head injuries.
- Significant coagulopathy or anticoagulant effect.
- Very low platelet count.

Eligibility must be assessed using the complete current stroke thrombolysis protocol.

## 10.2. Mechanical thrombectomy

This is an endovascular procedure used to remove a clot from a large cerebral artery.

A catheter is introduced through an artery, commonly the femoral or radial artery, and advanced to the cerebral circulation.

A stent retriever or aspiration catheter is used to remove the clot and restore blood flow.

It is particularly useful for large-vessel occlusion, such as:

- Internal carotid artery occlusion.
- Proximal middle cerebral artery occlusion.
- Selected basilar artery occlusions.

It is recommended in eligible patients within the early treatment window, and selected patients can benefit up to 24 hours after last known well, based on clinical and imaging criteria.

## 10.3. Aspirin

Aspirin is an antiplatelet drug.

It irreversibly inhibits cyclooxygenase-1 (COX-1), reducing thromboxane A2 production.

Thromboxane A2 normally promotes platelet activation and aggregation.

By inhibiting it, aspirin reduces the formation of new platelet-rich arterial clots.

**Acute dose:** A commonly used guideline regimen is 300 mg orally, rectally or through an enteral tube after imaging has excluded intracranial haemorrhage.

For long-term secondary prevention, a common dose is 75–100 mg daily, depending on the national protocol.

**Important:** If the patient received thrombolysis, do not give aspirin during the first 24 hours. Repeat brain imaging first to exclude haemorrhage.

## 10.4. Dual antiplatelet therapy

Selected patients with minor non-cardioembolic ischaemic stroke or high-risk TIA may benefit from short-term dual antiplatelet therapy.

This usually involves aspirin plus clopidogrel.

A commonly used regimen is:

- Aspirin 300 mg loading dose, followed by 75–100 mg daily.
- Clopidogrel 300 mg loading dose, followed by 75 mg daily.
- Continue both for approximately 21 days, then continue a single antiplatelet drug.

The exact regimen depends on the patient's eligibility, bleeding risk and local protocol.

Dual antiplatelet therapy is not appropriate for every stroke patient.

## 10.5. Statins

Statins inhibit HMG-CoA reductase, an enzyme involved in hepatic cholesterol synthesis.

They reduce LDL cholesterol and help stabilise atherosclerotic plaques, reducing future vascular events.

For secondary prevention after ischaemic stroke, a high-intensity statin is generally preferred when appropriate.

Examples:

- Atorvastatin 40–80 mg orally once daily.
- Rosuvastatin 20–40 mg orally once daily.

Your notes mention simvastatin 20–80 mg. Although simvastatin is a statin, high-intensity atorvastatin or rosuvastatin is commonly preferred for secondary prevention.

## 10.6. Anticoagulation in atrial fibrillation

A patient with atrial fibrillation may develop a thrombus in the left atrium.

Anticoagulants reduce the formation of further thrombi and therefore reduce the risk of another embolic stroke.

Examples include:

- Warfarin.
- Apixaban.
- Rivaroxaban.
- Dabigatran.

Warfarin inhibits vitamin K-dependent clotting factor synthesis.

When warfarin is used for non-valvular atrial fibrillation, the usual target INR is 2.0–3.0.

However, anticoagulation should not automatically be started immediately after an acute stroke. The timing depends on infarct size, severity, haemorrhagic transformation risk and the patient's overall condition.

For mechanical heart valves and some other conditions, warfarin may be necessary rather than a direct oral anticoagulant.

# 11. Management of TIA

A TIA is a warning event, not a harmless episode.

The patient may feel completely normal by the time they arrive at hospital, but the risk of a subsequent stroke is particularly important in the early period.

## What should you do?

1. Assess ABCDE and check bedside glucose.
2. Establish the history, including exact onset and duration of symptoms.
3. Perform a neurological and cardiovascular examination.
4. Arrange urgent brain and vascular imaging as indicated.
5. Obtain ECG to identify atrial fibrillation.
6. Start appropriate antiplatelet therapy when haemorrhage has been excluded and no contraindication exists.
7. Assess for carotid stenosis and cardiac embolic sources.
8. Treat modifiable risk factors.

NICE recommends immediate aspirin 300 mg for suspected TIA unless contraindicated, and specialist assessment within 24 hours. Follow the applicable local protocol.

The ABCD2 score estimates risk based on age, blood pressure, clinical features, duration and diabetes, but it should not be used to delay referral or to decide that a patient does not need urgent assessment.

# 12. Management of intracerebral haemorrhage

The management is different from ischaemic stroke because the main problem is bleeding rather than arterial obstruction.

## 12.1. Stop and reverse anticoagulation

If the patient is taking anticoagulants, identify the drug and reverse its effect urgently where indicated.

Examples:

| Anticoagulant          | Reversal                                                                             |
| ---------------------- | ------------------------------------------------------------------------------------ |
| Warfarin               | Four-factor prothrombin complex concentrate (PCC) plus IV vitamin K                  |
| Unfractionated heparin | Protamine sulphate                                                                   |
| Dabigatran             | Idarucizumab                                                                         |
| Apixaban/rivaroxaban   | Andexanet alfa where available and appropriate; PCC may be considered under protocol |

Vitamin K alone is not sufficient for rapid reversal of serious warfarin-associated intracerebral haemorrhage.

Aspirin is not reversed with vitamin K or protamine. Routine platelet transfusion for aspirin-associated spontaneous ICH is generally not recommended unless there is a specific indication, such as emergency neurosurgery.

## 12.2. Blood pressure control

Carefully lower BP in appropriate patients to reduce the risk of haematoma expansion.

Avoid excessive reductions that could compromise cerebral perfusion.

## 12.3. Raised intracranial pressure

A large haematoma can cause surrounding oedema and increase intracranial pressure.

This may reduce cerebral perfusion and eventually cause brain herniation.

Management may include:

- Elevating the head of the bed approximately 30 degrees when appropriate.
- Maintaining adequate oxygenation and ventilation.
- Treating fever and seizures.
- Avoiding hypotension.
- Urgent neurosurgical assessment.

Hyperosmolar therapy, such as mannitol or hypertonic saline, may be used for selected patients with raised intracranial pressure or impending herniation.

Mannitol is not a routine treatment for every patient with intracerebral haemorrhage.

## 12.4. Neurosurgical assessment

Urgent neurosurgical assessment is required in selected patients, particularly those with:

- Cerebellar haemorrhage with neurological deterioration.
- Brainstem compression.
- Obstructive hydrocephalus.
- Significant mass effect.
- Haematoma requiring surgical evacuation.

Not every intracerebral haemorrhage requires surgery. The decision depends on location, size, neurological state and imaging findings.

# 13. Extradural, subdural and subarachnoid haemorrhage

These require urgent specialist assessment, often involving neurosurgery.

**Extradural haematoma:** An expanding haematoma can rapidly compress the brain. Surgical evacuation may be necessary.

**Subdural haematoma:** Treatment depends on the size, symptoms and degree of compression. Significant or symptomatic collections may require drainage.

**Subarachnoid haemorrhage:** Management includes:

- Urgent CT brain.
- CT angiography to identify an aneurysm.
- Neurosurgical or neurointerventional assessment.
- Early aneurysm securing through coiling or clipping where indicated.
- Nimodipine to reduce the risk of delayed cerebral ischaemia from vasospasm.

A common nimodipine regimen for aneurysmal SAH is 60 mg orally or through an NG tube every four hours for 21 days, if appropriate.

Nimodipine is not a routine treatment for ordinary ischaemic stroke or intracerebral haemorrhage.

# 14. Rehabilitation and secondary prevention

Surviving a stroke does not necessarily mean the patient has recovered normal function.

Rehabilitation aims to maximise independence and reduce disability.

It may involve:

- Physiotherapy for weakness, balance and mobility.
- Occupational therapy for daily activities.
- Speech and language therapy for aphasia and dysphagia.
- Nutritional support.
- Psychological support.
- Family and caregiver education.

## Secondary prevention

After the acute phase, identify and manage the cause of stroke.

Important interventions include:

- Consistent blood pressure control.
- Diabetes management.
- Lipid lowering.
- Smoking cessation.
- Weight management.
- Regular physical activity.
- Reduced dietary salt.
- Appropriate antiplatelet or anticoagulant treatment.
- Carotid intervention in selected patients with significant symptomatic stenosis.

The purpose is to prevent another stroke, myocardial infarction and other cardiovascular events.

# 15. Putting everything together: clinical decision-making

Imagine a 65-year-old man arrives at the emergency department with sudden right-sided weakness and difficulty speaking.

How do you approach him?

**First: Recognise stroke.**

Sudden focal neurological deficits strongly suggest stroke.

**Second: Establish the time.**

Ask when he was last known to be well. This determines eligibility for reperfusion treatment.

**Third: Stabilise.**

Assess ABCDE, check glucose, oxygen saturation, blood pressure and GCS.

**Fourth: Image immediately.**

Request urgent non-contrast CT brain.

**Fifth: Classify the stroke.**

- Blood on CT suggests haemorrhagic stroke.
- No visible blood with a compatible clinical presentation suggests possible ischaemic stroke, although early CT can be normal.

**Sixth: Choose treatment.**

- Ischaemic stroke: assess eligibility for thrombolysis and thrombectomy, then institute appropriate antithrombotic and secondary prevention treatment.
- Intracerebral haemorrhage: control BP appropriately, reverse anticoagulation when indicated and obtain neurosurgical assessment.

**Seventh: Prevent complications.**

Assess swallowing, hydration, nutrition, pressure injury risk, DVT risk and rehabilitation needs.

**Eighth: Prevent recurrence.**

Investigate the cause, control risk factors and arrange follow-up.

# 16. Important clinical corrections to your original notes

| Original statement                                                   | Important clarification                                                                                                    |
| -------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------- |
| TIA lasts less than 24 hours                                         | Modern definition is tissue-based: transient neurological dysfunction without acute infarction                             |
| Thrombolysis within 6 hours                                          | Standard IV thrombolysis window is 4.5 hours; selected patients qualify for extended windows                               |
| Give oxygen to all stroke patients                                   | Give oxygen when hypoxaemic                                                                                                |
| Do not lower BP unless above 220/120 in ischaemic stroke             | Generally correct when no reperfusion treatment or other urgent indication exists; thrombolysis has stricter BP limits     |
| BP in haemorrhagic stroke should only be treated above 180/130       | Outdated. Selected ICH patients benefit from controlled acute BP reduction                                                 |
| Heparin 5,000 units SC twice daily for all ischaemic stroke patients | Not routine for everyone. Use mechanical prophylaxis and assess whether pharmacological prophylaxis is appropriate         |
| Mannitol 0.5–1 g/kg three times daily                                | Mannitol is not routinely scheduled; use hyperosmolar therapy for selected raised-ICP emergencies                          |
| Warfarin for all AF-related strokes                                  | Anticoagulation is appropriate for many patients, but timing and choice of drug depend on the cause and clinical situation |
| Extradural and subdural haematomas are types of haemorrhagic stroke  | They are usually traumatic intracranial haemorrhages, distinct from spontaneous haemorrhagic stroke                        |

# 17. Final clinical points to master

1. Always distinguish ischaemic from haemorrhagic stroke using urgent brain imaging.
2. A normal early CT does not exclude ischaemic stroke.
3. Hypoglycaemia is an important and treatable stroke mimic.
4. The time last known well is essential for reperfusion decisions.
5. Do not lower BP aggressively in acute ischaemic stroke without a clear indication.
6. Thrombolysis and thrombectomy are time-sensitive treatments.
7. Never give aspirin before excluding intracranial haemorrhage.
8. Do not give oral food, fluids or medication before assessing swallowing.
9. A TIA requires urgent assessment even when symptoms have resolved.
10. Stroke management does not end after stabilisation. Rehabilitation and secondary prevention are essential.

## Further reading

- [2026 AHA/ASA Guideline for Early Management of Acute Ischaemic Stroke](https://www.ahajournals.org/doi/10.1161/STR.0000000000000513?utm_source=chatgpt.com).
- [AHA/ASA Guideline for Spontaneous Intracerebral Haemorrhage](https://www.ahajournals.org/doi/10.1161/STR.0000000000000407?utm_source=chatgpt.com).
- [NICE Guideline: Stroke and TIA, Diagnosis and Initial Management](https://www.nice.org.uk/guidance/NG128/chapter/recommendations).

**The biggest lesson:** In a suspected stroke, do not spend time trying to guess whether it is ischaemic or haemorrhagic from the symptoms. Recognise it, stabilise the patient, establish the time of onset and obtain urgent brain imaging. That is what allows you to choose the right treatment.
