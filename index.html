DOI+1

### **D. Vasopressors**

First-line: Norepinephrine

Norepinephrine is the first-line vasopressor in septic shock.

Why?

The principal haemodynamic problem is often severe vasodilation and reduced systemic vascular resistance.

Norepinephrine:

- Produces predominantly alpha-1-mediated vasoconstriction.
- Increases systemic vascular resistance.
- Raises MAP.
- Helps restore organ perfusion pressure.

The usual initial MAP target is **65 mmHg**, adjusted to the patient's clinical circumstances.

If norepinephrine requirements continue to increase, vasopressin may be added. Epinephrine is another option if MAP remains inadequate.

**What about dobutamine?**

Dobutamine is not a vasopressor.

It may be considered when the patient has myocardial dysfunction and persistent hypoperfusion despite adequate volume status and arterial pressure support.

[image](https://www.google.com/s2/favicons?domain=https://survivingsepsis.org\&sz=32)

SCCM & ESICM+1

### **E. Other supportive treatment**

| Intervention              | When and why?                                                                                                                                                  |
| ------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------------------- |
| Hydrocortisone            | Consider IV 200 mg/day in septic shock with ongoing vasopressor requirement despite adequate resuscitation                                                     |
| Insulin                   | Treat persistent significant hyperglycaemia, commonly targeting 140–180 mg/dL in critically ill adults                                                         |
| Blood transfusion         | Generally use a restrictive Hb threshold around 7 g/dL in stable patients, but individualise for active bleeding, myocardial ischaemia and other circumstances |
| Mechanical ventilation    | For respiratory failure or severe ARDS                                                                                                                         |
| Renal replacement therapy | For standard indications such as refractory hyperkalaemia, severe acidosis, fluid overload or uraemic complications                                            |

Hydrocortisone is an adjunct for persistent vasopressor-dependent shock. It is not a substitute for fluids, antibiotics or norepinephrine.

## **8. Source control: a critical part of treatment**

Antibiotics alone may not be sufficient.

If the infection has a persistent anatomical source, that source must be controlled.

Examples:

- Intra-abdominal abscess → drainage.
- Perforated bowel → urgent surgical intervention.
- Obstructed infected urinary tract → urgent decompression.
- Infected central venous catheter → removal when indicated.
- Necrotising fasciitis → emergency surgical debridement.

The principle is simple: **remove or control the source that continues to drive infection.**

## **9. Monitoring response to treatment**

Do not assess improvement using BP alone.

| Parameter            | Desired response                            |
| -------------------- | ------------------------------------------- |
| MAP                  | Generally ≥65 mmHg initially                |
| Mental status        | Improving consciousness                     |
| Capillary refill     | Improving, ideally ≤3 seconds               |
| Urine output         | ≥0.5 mL/kg/hour                             |
| Lactate              | Falling if initially elevated               |
| Respiratory status   | Improving oxygenation and work of breathing |
| Peripheral perfusion | Improving warmth and pulse quality          |

A patient can achieve an acceptable BP while still having poor tissue perfusion. Always assess the whole patient.

## **10. When to refer or admit?**

Admit urgently

Any patient with suspected septic shock requires emergency hospital admission and usually ICU or high-dependency care.

Refer urgently for:

- Persistent hypotension.
- Vasopressor requirement.
- Altered consciousness.
- Respiratory failure.
- Oliguria or acute kidney injury.
- Rising lactate or severe metabolic acidosis.
- Coagulopathy or suspected DIC.
- Multiple organ dysfunction.

A patient with septic shock should never be discharged from the emergency department.

# **5. Obstructive shock**

Obstructive shock occurs when a mechanical obstruction prevents the heart from filling properly or ejecting blood effectively.

Unlike cardiogenic shock, where the heart muscle itself is failing, in obstructive shock the heart may be structurally capable of pumping, but something physically prevents normal circulation.

**The three major causes you must recognise are:**

1. Massive pulmonary embolism (PE).
2. Cardiac tamponade.
3. Tension pneumothorax.

## **1. Pathophysiology**

The basic mechanism is:

**Mechanical obstruction**

**Reduced cardiac filling or impaired blood ejection**

**Reduced stroke volume and cardiac output**

**Reduced tissue perfusion**

**Shock and organ dysfunction**

The precise mechanism differs depending on the obstruction.

## **2. Massive pulmonary embolism**

### **Definition**

Pulmonary embolism is obstruction of the pulmonary arterial circulation, usually by a thrombus originating from the deep veins of the lower limbs or pelvis.

A massive or high-risk PE causes haemodynamic instability, including obstructive shock or cardiac arrest.

### **A. Risk factors**

Think about conditions that promote venous stasis, endothelial injury or hypercoagulability.

These are known as Virchow's triad.

| Component          | Examples                                                                                     |
| ------------------ | -------------------------------------------------------------------------------------------- |
| Venous stasis      | Immobilisation, prolonged bed rest, long-distance travel                                     |
| Endothelial injury | Surgery, trauma                                                                              |
| Hypercoagulability | Pregnancy, postpartum period, malignancy, thrombophilia, oestrogen-containing contraceptives |

Other important risk factors include previous DVT or PE and hospitalisation.

### **B. Pathophysiology**

[Frontiers | Hemodynamic and respiratory support in pulmonary embolism: a narrative review](https://images.openai.com/static-rsc-4/qDFh7SqeOmFdCaMhikrDAHsm84dHOZzo5hLeJ5J1JdVdH69C7YPDKfYZ3tdlZPTo3WlBZvcZPopkiCtgufhXdfR0fmV1SNYIYMsF72vgMO3qvZ8p3VoDqjLucQ1Vc4fSFKV5IX1VC6SxrfRvs92y96M9QGtfBrHrcN9DRFITKVA?purpose=inline)

[frontiersin.org](https://www.frontiersin.org/journals/medicine/articles/10.3389/fmed.2023.1123793/full?utm_source=chatgpt.com)

Let's follow the mechanism:

1. A thrombus travels from the venous circulation into the right side of the heart.
2. It enters and obstructs the pulmonary arteries.
3. Pulmonary vascular resistance increases.
4. The right ventricle must generate greater pressure to pump blood through the pulmonary circulation.
5. The right ventricle dilates and may fail.
6. Less blood reaches the left ventricle.
7. Left ventricular preload and cardiac output decrease.
8. Systemic hypotension and shock develop.

**Important:** Acute right ventricular failure is the central mechanism of haemodynamic collapse in massive PE.

### **C. Clinical presentation**

- Sudden dyspnoea.
- Pleuritic chest pain.
- Tachycardia.
- Tachypnoea.
- Hypoxaemia.
- Syncope or presyncope.
- Haemoptysis, sometimes.
- Hypotension in high-risk PE.
- Raised JVP when right ventricular failure is significant.

A patient with sudden dyspnoea, hypotension, tachycardia and signs of right ventricular strain should raise strong suspicion of massive PE.

### **D. Investigations**

| Investigation                | Purpose                                                                            |
| ---------------------------- | ---------------------------------------------------------------------------------- |
| ECG                          | May show sinus tachycardia, right heart strain or S1Q3T3                           |
| D-dimer                      | Helps exclude PE in appropriate low/intermediate probability patients              |
| CTPA                         | Main imaging investigation to identify pulmonary arterial thrombi                  |
| Echocardiography             | Assess right ventricular dilation and dysfunction, especially in unstable patients |
| Troponin                     | May rise due to right ventricular myocardial injury                                |
| BNP/NT-proBNP                | May rise due to right ventricular wall stress                                      |
| Lower-limb venous ultrasound | May identify DVT when CTPA is unavailable or unsuitable                            |
| ABG                          | May show hypoxaemia and respiratory alkalosis, but can be normal                   |

**Clinical distinction:** D-dimer is not a rule-in test. In a patient with high clinical probability or haemodynamic instability, do not delay urgent management while waiting for D-dimer.

In an unstable patient who cannot safely undergo CTPA, bedside echocardiography and clinical assessment can guide urgent treatment.

### **E. Management**

High-risk PE is an emergency

1. ABCDE assessment and urgent senior/critical-care support.
2. Oxygen for hypoxaemia and respiratory support as required.
3. IV access and continuous monitoring.
4. Carefully selected fluid administration; excessive fluids can worsen right ventricular failure.
5. Vasopressor support, usually norepinephrine, if hypotension persists.
6. Therapeutic anticoagulation when appropriate.
7. Urgent reperfusion treatment for high-risk PE.

**Thrombolysis**

For a patient with high-risk PE and haemodynamic instability, systemic thrombolysis is generally the preferred reperfusion treatment if there are no major contraindications.

A commonly used adult regimen is alteplase 100 mg IV over 2 hours, subject to local protocols and bleeding-risk assessment.

If thrombolysis is contraindicated or unsuccessful, consider catheter-directed treatment or surgical embolectomy where available.

Anticoagulation prevents further clot formation and propagation, but it does not rapidly dissolve the existing obstructing thrombus.

## **3. Cardiac tamponade**

### **A. Definition**

Cardiac tamponade is a life-threatening condition in which fluid accumulates under pressure within the pericardial sac, compressing the heart and preventing adequate ventricular filling.

Normally, the pericardium contains a small amount of fluid that allows the heart to move with minimal friction.

However, when fluid accumulates rapidly or reaches a critical volume, intrapericardial pressure rises and compresses the cardiac chambers.

[Video: Cardiac tamponade: Clinical sciences | Osmosis](https://images.openai.com/static-rsc-4/Mp_ZebqqtWdYsOoxT-LRGoFmO5xUzfgQz-Z4LaRiaXNl6EnB2fqu5WLnPE2GfQFe2L1A_5o2vje0jdEykUNGjdG0XUgiy6E-jT1CwZzpDj2kpiDlg8I7OvpYa02jUx9r9C4_MxljOzmECedI8icBsADw4pjp23ZvhYdJjqotVGg?purpose=inline)

[osmosis.org](https://www.osmosis.org/video/Cardiac_tamponade%3A_Clinical_sciences?utm_source=chatgpt.com)

### **B. Causes**

- Malignancy.
- Tuberculosis.
- Trauma, including penetrating chest injury.
- Myocardial rupture following acute MI.
- Uraemia.
- Pericarditis.
- Complications of cardiac procedures.

**Rwanda clinical relevance:** Tuberculous pericardial disease is an important cause to consider in the appropriate clinical context.

### **C. Pathophysiology**

1. Fluid accumulates in the pericardial space.
2. Intrapericardial pressure increases.
3. The heart becomes compressed.
4. Ventricular filling during diastole is impaired.
5. Stroke volume decreases.
6. Cardiac output falls.
7. Systemic hypotension and shock develop.

The right-sided chambers are particularly vulnerable because their pressures are normally lower.

### **D. Clinical presentation**

The classic findings are known as **Beck's triad**:

**Hypotension**

Reduced ventricular filling leads to reduced cardiac output.

**Raised JVP**

Blood cannot enter the compressed right heart easily, causing systemic venous pressure to rise.

**Muffled heart sounds**

Fluid surrounding the heart dampens transmission of heart sounds.

Other findings:

- Tachycardia.
- Dyspnoea.
- Weak peripheral pulses.
- Cold extremities.
- Oliguria.
- Confusion.
- Pulsus paradoxus.

### **What is pulsus paradoxus?**

It is an exaggerated fall in systolic blood pressure during inspiration, usually greater than 10 mmHg.

Normally, systolic BP falls slightly during inspiration.

In tamponade, the ventricles compete for limited space inside the pericardium. During inspiration, increased right ventricular filling pushes the interventricular septum towards the left ventricle, reducing left ventricular filling and stroke volume.

This produces an exaggerated inspiratory fall in systolic BP.

### **E. Investigations**

| Investigation    | Findings / purpose                                                                    |
| ---------------- | ------------------------------------------------------------------------------------- |
| Echocardiography | Main investigation; detects pericardial effusion and chamber compression              |
| ECG              | May show sinus tachycardia, low-voltage QRS or electrical alternans                   |
| Chest X-ray      | May show an enlarged globular cardiac silhouette in a large, usually chronic effusion |
| Blood tests      | Investigate underlying cause, such as renal disease, infection or malignancy          |

[Focused Cardiac Ultrasound | PPTX](https://images.openai.com/static-rsc-4/E5PNLDDyJvnBTD0iHc5HM8QVvl3rjRRE9sT7FXOef3943nm4kvJllXUB-O1GwwGIGeuWt85M9eqegG2x5WyrbOb44N0WnQ0nWDAqNC_AvPbLi01wq9Pi_nNGK4qDIjFWAB7NHsekjN2U4xh1yWsdsTcsZ0Wiaq6A90yuREdPK9g?purpose=inline)

[slideshare.net](https://www.slideshare.net/slideshow/focused-cardiac-ultrasound/61348904?utm_source=chatgpt.com)

**Important:** A normal-sized cardiac silhouette on chest X-ray does not exclude tamponade. Echocardiography is much more useful.

### **F. Management**

Definitive treatment: urgent drainage

The definitive treatment is removal of the fluid compressing the heart.

**Emergency pericardiocentesis:**

- A needle and catheter are introduced into the pericardial space.
- Accumulated fluid is aspirated.
- Cardiac filling improves.
- Cardiac output and blood pressure may rapidly recover.

Surgical drainage or a pericardial window may be necessary, particularly with traumatic bleeding, purulent effusions or recurrent collections.

While arranging definitive treatment:

- Call for urgent specialist assistance.
- Give oxygen if indicated.
- Establish IV access and monitor continuously.
- A cautious fluid bolus may temporarily support preload in hypotensive patients.
- Avoid unnecessary positive-pressure ventilation when possible, as it can further reduce venous return and worsen haemodynamics.

**Do not delay drainage in an unstable patient while waiting for investigations that are not essential to the immediate diagnosis.**

## **4. Tension pneumothorax**

### **A. Definition**

A pneumothorax occurs when air enters the pleural space, causing partial or complete lung collapse.

A tension pneumothorax occurs when air enters the pleural space through a one-way valve mechanism but cannot escape.

Pressure progressively increases within the affected hemithorax, compressing the lung and shifting mediastinal structures.

[en.rattibha.com](https://en.rattibha.com/thread/1791824190741303516?utm_source=chatgpt.com)

### **B. Causes**

- Chest trauma.
- Penetrating chest injuries.
- Rib fractures.
- Mechanical ventilation, especially with high airway pressures.
- Spontaneous pneumothorax that develops a tension mechanism.
- Complications of central venous catheter insertion.

### **C. Pathophysiology**

1. Air enters the pleural space.
2. Air cannot escape.
3. Intrapleural pressure progressively increases.
4. The ipsilateral lung collapses.
5. The mediastinum may shift towards the opposite side.
6. The opposite lung and great veins can become compressed.
7. Venous return to the heart decreases.
8. Cardiac output falls, resulting in obstructive shock.

The key mechanism is **reduced venous return due to increased intrathoracic pressure**.

### **D. Clinical presentation**

Look for:

- Sudden severe dyspnoea.
- Pleuritic chest pain.
- Tachycardia.
- Hypotension.
- Tachypnoea.
- Reduced or absent breath sounds on the affected side.
- Hyperresonance on percussion.
- Distended neck veins, sometimes.
- Tracheal deviation away from the affected side, a late and unreliable sign.

[File:Tension pneumothorax .jpg - wikidoc](https://images.openai.com/static-rsc-4/cJcTTg4f49Y-8-s1lS_D43jJVoc99rNYJO6A3Lim8m-OtDE--hSiMmLYyk6Qz9p7jg1dupy44b_SJtnQx8XcvDTTgdKHTfLNUGfuy-76G28BDmnJvhQZkiZGyJS-1F1iYD2FI9vvkna6XZ2ayjramlv3fUtV_WuvatQMjAVURVA?purpose=inline)

[wikidoc.org](https://www.wikidoc.org/index.php/File%3ATension_pneumothorax_.jpg?utm_source=chatgpt.com)

**Clinical pearl:** Do not wait for tracheal deviation. It is often a late sign, and its absence does not exclude tension pneumothorax.

### **E. Diagnosis**

Tension pneumothorax in an unstable patient is a clinical diagnosis.

You do not need to wait for a chest X-ray.

If the patient is stable enough for imaging, chest X-ray or bedside ultrasound can help identify pneumothorax.

### **F. Management**

Immediate decompression

A clinically suspected tension pneumothorax causing haemodynamic compromise requires immediate decompression.

1. Call for emergency assistance.
2. Give oxygen and support ventilation as needed.
3. Perform immediate needle decompression or finger thoracostomy, according to clinician expertise and local trauma protocol.
4. Insert an intercostal chest drain to provide definitive ongoing drainage.
5. Monitor haemodynamic and respiratory improvement.

Common decompression sites include:

- Fourth or fifth intercostal space, anterior to the mid-axillary line.
- Second intercostal space, midclavicular line, in some protocols.

Finger thoracostomy is often preferred in appropriately trained trauma teams, particularly in traumatic arrest or severe instability.

**Remember:** Needle decompression is a temporising measure. A chest drain is generally required for definitive management.

## **5. Comparing the three causes of obstructive shock**

| Feature                    | Massive PE                                      | Cardiac tamponade                          | Tension pneumothorax                    |
| -------------------------- | ----------------------------------------------- | ------------------------------------------ | --------------------------------------- |
| Main obstruction           | Pulmonary arteries                              | Pericardial fluid compressing heart        | Increased pleural pressure              |
| Main physiological problem | RV outflow obstruction                          | Impaired diastolic filling                 | Reduced venous return                   |
| Breath sounds              | May be normal                                   | Usually normal                             | Reduced on affected side                |
| JVP                        | May be raised                                   | Usually raised                             | May be raised                           |
| ECG                        | Sinus tachycardia, possible RV strain           | Low voltage, electrical alternans possible | Usually nonspecific                     |
| Key investigation          | CTPA if stable                                  | Echocardiography                           | Clinical diagnosis if unstable          |
| Definitive treatment       | Reperfusion, often thrombolysis in high-risk PE | Pericardial drainage                       | Immediate decompression and chest drain |

# **6. Putting all four types of shock together**

You have now covered the four major categories. Let's build a practical approach for a patient arriving at the emergency department with suspected shock.

## **A. How to identify the type of shock**

| Clinical clue                                              | Most likely shock                 |
| ---------------------------------------------------------- | --------------------------------- |
| Major bleeding, diarrhoea, vomiting, dehydration           | Hypovolemic                       |
| Chest pain, pulmonary oedema, signs of heart failure       | Cardiogenic                       |
| Fever, suspected infection, organ dysfunction              | Septic                            |
| Sudden allergic reaction, wheezing, urticaria, hypotension | Anaphylactic                      |
| Sudden dyspnoea, unilateral absent breath sounds           | Obstructive: tension pneumothorax |
| Raised JVP, hypotension, muffled heart sounds              | Obstructive: tamponade            |
| Sudden dyspnoea, syncope, RV strain                        | Obstructive: PE                   |

These are clues, not absolute rules. More than one type of shock can coexist.

## **B. Your emergency approach: diagnose, treat, refer or discharge**

**Patient presents with suspected shock**

**ABCDE assessment**

Identify and treat immediate airway, breathing and circulatory threats

**Establish IV access, monitor and investigate**

ECG, blood tests, lactate, cultures when indicated, bedside ultrasound

**Identify the likely shock mechanism**

**Hypovolemic**

Replace volume; control bleeding.

**Cardiogenic**

Support cardiac function; treat cause.

**Septic**

Antibiotics, fluids, source control.

**Anaphylactic**

Immediate IM adrenaline.

**Obstructive**

Relieve the mechanical obstruction.

**Reassess response and escalate care**

ICU, surgery, cardiology or other specialist intervention as indicated

## **C. Important examination points**

1. Shock can exist without hypotension.
2. A normal lactate does not exclude shock.
3. Warm extremities do not exclude shock.
4. Do not give large fluid boluses to every patient.
5. Norepinephrine is the first-line vasopressor in septic shock.
6. Dobutamine is an inotrope, not a vasopressor.
7. IM adrenaline is first-line in anaphylaxis.
8. Tension pneumothorax requires immediate decompression without waiting for imaging.
9. Cardiac tamponade requires urgent drainage.
10. High-risk PE with haemodynamic instability requires urgent reperfusion assessment.

## **D. Can a patient with shock be discharged?**

**No.** A patient with active shock requires emergency stabilisation and hospital admission.

Discharge becomes a consideration only after the underlying condition has been treated, haemodynamic stability is sustained without support, organ perfusion is satisfactory, and the patient has been assessed as safe for discharge.

function render(n){
 const L=n.md.split('\n'),out=[],toc=[];let i=0,k=0,title=n.nohead?n.title:'',sub='',gotTitle=!!n.nohead,wantSub=false;
 const isList=l=>/^(- |\d+\. )/.test(l),isTab=l=>/^\|/.test(l),isHead=l=>/^#{1,4} /.test(l),isHr=l=>/^---+\s*$/.test(l);
 while(i<L.length){
  const l=L[i];
  if(!l.trim()||isHr(l)){i++;continue}
  if(isHead(l)){
   const m=l.match(/^(#{1,4}) (.*)/),lv=m[1].length,t=m[2];i++;
   if(lv===1&&!gotTitle){gotTitle=true;title=t;wantSub=!n.nosub;continue}
   if(wantSub&&lv===2){sub=t;wantSub=false;continue}
   wantSub=false;
   const id=n.id+'--s'+(++k);toc.push({lv,t,id});
   out.push(`<h${lv+1} id="${id}">${inl(t)}</h${lv+1}>`);continue;
  }
  if(isList(l)){
   const ord=/^\d/.test(l),re=ord?/^\d+\. (.*)/:/^- (.*)/,items=[],start=ord?parseInt(l):1;
   while(i<L.length){let j=i;while(j<L.length&&!L[j].trim())j++;
    if(j<L.length&&re.test(L[j])){items.push(L[j].match(re)[1]);i=j+1}else break}
   const tag=ord?'ol':'ul';
   out.push(`<${tag}${ord&&start!==1?` start="${start}"`:''}>${items.map(x=>`<li>${inl(x)}</li>`).join('')}</${tag}>`);continue;
  }
  if(isTab(l)){
   const rows=[];while(i<L.length&&isTab(L[i]))rows.push(L[i++]);
   const cells=r=>r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
   const head=cells(rows[0]),al=cells(rows[1]).map(c=>/^:?-+:$/.test(c)?'right':'left');
   const td=(c,j,t)=>`<${t} style="text-align:${al[j]||'left'}">${inl(c)}</${t}>`;
   out.push(`<div class="tw"><table><thead><tr>${head.map((c,j)=>td(c,j,'th')).join('')}</tr></thead><tbody>${rows.slice(2).map(r=>`<tr>${cells(r).map((c,j)=>td(c,j,'td')).join('')}</tr>`).join('')}</tbody></table></div>`);continue;
  }
  const p=[];while(i<L.length&&L[i].trim()&&!isHead(L[i])&&!isList(L[i])&&!isTab(L[i])&&!isHr(L[i]))p.push(L[i++]);
  out.push(`<p>${p.map(inl).join('<br>')}</p>`);
 }
 return {title,sub,toc,html:out.join('\n')};
}

const host=$('notes'),side=$('side'),cards=$('cards');
notes.forEach(n=>{n.r=render(n);
 const a=document.createElement('article');a.className='note';a.id='note-'+n.id;
 a.innerHTML=`<header class="note-head"><h1>${inl(n.r.title)}</h1><p class="sub">${inl(n.r.sub||n.sub)}</p><div class="btns"><button class="btn" data-pdf="${n.id}">Download PDF</button></div></header><div class="prose">${n.r.html}</div>`;
 host.appendChild(a);
 cards.insertAdjacentHTML('beforeend',`<a class="card" href="#${n.id}"><b>${esc(n.title)}</b><span>${esc(n.sub)}</span></a>`);
});
$('coverList').innerHTML=notes.map(n=>`<p>${esc(n.title)}</p>`).join('');
cards.insertAdjacentHTML('afterend','<button class="btn ghost" data-pdf="all">Download All Notes</button>');

function nav(cur){
 side.innerHTML='<h4>Topics</h4>'+notes.map(n=>`<a href="#${n.id}" class="${n.id===cur?'on':''}">${esc(n.title)}</a>`+(n.id===cur?'<div class="sub">'+n.r.toc.filter(e=>e.lv===1).map(e=>`<a href="#${e.id}">${inl(e.t)}</a>`).join('')+'</div>':'')).join('');
}
function show(v){
 $('view-home').classList.toggle('show',v==='home');
 notes.forEach(n=>$('note-'+n.id).style.display=(n.id===v)?'block':'none');
 nav(v);
}
function route(){
 const h=decodeURIComponent(location.hash.slice(1)),t=h.split('--')[0],n=notes.find(x=>x.id===t);
 show(n?n.id:'home');
 const e=h.includes('--')&&$(h);
 if(e)e.scrollIntoView();else scrollTo(0,0);
 side.classList.remove('open');
}
addEventListener('hashchange',route);route();
$('menu').onclick=()=>side.classList.toggle('open');

function pdf(w){
 document.querySelectorAll('.note').forEach(a=>a.classList.toggle('sel',w==='all'||a.id==='note-'+w));
 $('cover').classList.toggle('on',w==='all');
 const n=notes.find(x=>x.id===w);
 document.title=w==='all'?SERIES+' - All Notes':n.title+' - Medical Notes';
 print();
}
addEventListener('afterprint',()=>{document.title=BASE;document.querySelectorAll('.sel').forEach(a=>a.classList.remove('sel'));$('cover').classList.remove('on')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-pdf]');if(b)pdf(b.dataset.pdf)});
$('dlAll').onclick=()=>pdf('all');
})();
</script>
</body>
</html>
