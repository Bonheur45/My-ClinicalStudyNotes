# COPD: CLINICAL MASTERCLASS

# PART 1. Understanding COPD

# 1. What is COPD?

**Chronic Obstructive Pulmonary Disease (COPD)** is a heterogeneous lung disease characterised by persistent respiratory symptoms and airflow obstruction caused by abnormalities of the airways (chronic bronchitis/small-airway disease) and/or alveoli (emphysema).

The obstruction is usually **not fully reversible**, although some improvement may occur after bronchodilators.

## Diagnostic definition

COPD is confirmed by spirometry showing:

**Post-bronchodilator FEV₁/FVC < 0.70**

Let's understand what this means.

**Two important spirometry measurements**

**FEV₁**

**Forced Expiratory Volume in 1 second**

The amount of air a person can forcibly blow out during the first second after taking a full breath in.

**FVC**

**Forced Vital Capacity**

The total amount of air a person can forcibly exhale after taking a full breath in.

**FEV₁/FVC ratio**

It tells us what proportion of the total forced exhaled air comes out in the first second.

In COPD, narrowed and damaged airways make expiration difficult, so FEV₁ falls disproportionately compared with FVC.

**Example:**

- FEV₁ = 1.5 L
- FVC = 3 L

FEV₁/FVC = 1.5/3 = 0.5

0.50 is below 0.70

This demonstrates persistent airflow obstruction, supporting COPD in a patient with compatible symptoms and exposure history.

**Important:** A low ratio alone does not establish COPD. You need a compatible clinical history and must consider alternative causes of obstruction. Also, not every patient with COPD has completely irreversible airflow limitation.

# 2. What actually happens in COPD?

COPD mainly involves two pathological processes:

**A. Chronic bronchitis / small-airway disease**

- Chronic inflammation of the bronchi and bronchioles.
- Increased mucus production.
- Thickening and narrowing of airway walls.
- Small airways may collapse during expiration.

**Result:** Increased resistance to airflow, especially when breathing out.

**B. Emphysema**

- Destruction of alveolar walls.
- Enlargement of air spaces.
- Loss of elastic recoil.
- Destruction of alveolar attachments that help hold small airways open.

**Result:** Air gets trapped inside the lungs, particularly during expiration.

A patient can have predominantly airway disease, emphysema, or a combination of both.

# 3. Why does COPD cause airflow obstruction?

Let's follow the mechanism.

**Step 1: Chronic exposure to harmful particles**

Examples include:

- Cigarette smoke.
- Biomass smoke from cooking with wood, charcoal or other fuels.
- Occupational dust, fumes and chemicals.

**Step 2: Chronic inflammation**

These irritants activate inflammatory cells, particularly macrophages, neutrophils and CD8+ T lymphocytes.

They release inflammatory mediators and enzymes that damage lung tissue.

**Step 3: Structural damage develops**

Three important changes occur:

1. Airway inflammation and fibrosis narrow the small airways.
2. Mucus hypersecretion obstructs the airways.
3. Destruction of alveolar walls reduces elastic recoil.

**Step 4: Expiration becomes difficult**

Normally, elastic recoil helps push air out of the lungs. In emphysema, this recoil is reduced.

During expiration, small airways narrow or collapse prematurely, trapping air inside the lungs.

This is called **air trapping**.

**The consequence:** The lungs become hyperinflated, the diaphragm flattens, and breathing requires more effort.

# 4. Why does COPD cause its characteristic symptoms?

| Symptom | Explanation |
| --- | --- |
| Progressive dyspnoea | Air trapping, hyperinflation and increased work of breathing make ventilation difficult. |
| Chronic cough | Inflamed airways stimulate cough receptors. |
| Sputum production | Increased mucus secretion from goblet cells and enlarged mucus glands. |
| Wheezing | Air moving through narrowed airways produces musical sounds. |
| Reduced exercise tolerance | Ventilatory limitation and impaired gas exchange make it difficult to increase ventilation during exercise. |
| Recurrent respiratory infections | Impaired mucociliary clearance and mucus retention reduce the ability to clear pathogens. |

**A particularly important concept:**

COPD patients often have difficulty breathing out, not because they cannot get air into their lungs, but because they cannot empty their lungs efficiently.

This explains why they may develop prolonged expiration and pursed-lip breathing.

# 5. Risk factors

| Risk factor | How it contributes |
| --- | --- |
| Tobacco smoking | Chronic airway inflammation and destruction of alveoli. |
| Biomass exposure | Repeated inhalation of harmful particles from cooking/heating fuels. |
| Occupational exposure | Dust, fumes and chemicals cause chronic airway injury. |
| Alpha-1 antitrypsin deficiency | Genetic deficiency allows proteases to destroy alveolar tissue, causing early emphysema. |
| Childhood respiratory infections | May impair lung development and reduce maximum lung function achieved in adulthood. |
| Low birth weight | May be associated with impaired lung development. |
| Family history | May indicate genetic susceptibility and shared exposures. |

**Clinical point:** Never assume COPD only occurs in smokers. In Rwanda and other settings where biomass fuel exposure is common, a patient who has never smoked can still develop COPD.

# 6. Chronic bronchitis versus emphysema

These are not two separate diagnostic requirements for COPD. They are different pathological patterns that can coexist.

| Feature | Chronic bronchitis | Emphysema |
| --- | --- | --- |
| Main problem | Mucus hypersecretion and airway inflammation | Destruction of alveolar walls |
| Dominant symptom | Chronic productive cough | Progressive dyspnoea |
| Main mechanism | Airway narrowing and mucus obstruction | Loss of elastic recoil and air trapping |
| Gas exchange | May be significantly impaired | Impaired due to loss of alveolar surface area |

**Definition of chronic bronchitis:** Productive cough for at least 3 months in each of 2 consecutive years, after excluding other causes.

**Definition of emphysema:** Abnormal permanent enlargement of air spaces distal to terminal bronchioles, accompanied by destruction of their walls.

## Check your understanding

**Question 1. Why does emphysema cause air trapping?**

- Increased elastic recoil
- Loss of elastic recoil and premature airway collapse
- Excessive surfactant production

**Question 2. What confirms persistent airflow obstruction in COPD?**

- FEV₁ below 80% predicted
- Pre-bronchodilator FEV₁/FVC below 0.70
- Post-bronchodilator FEV₁/FVC below 0.70

**Question 3. Why does biomass exposure increase COPD risk?**

- It causes repeated airway inflammation and lung injury
- It directly increases alveolar oxygen
- It causes only acute bronchospasm

Let's continue. We will cover the remaining COPD topics systematically, with particular emphasis on how you would assess and manage a patient in the hospital. I will also distinguish what the Rwanda 2022 guideline says from newer GOLD recommendations where the distinction matters.

# PART 2. Clinical presentation and diagnosis

# 7. Clinical presentation of COPD

COPD usually develops gradually. Patients often present after years of exposure to tobacco smoke, biomass fuel or occupational irritants.

## A. Symptoms

**1. Progressive dyspnoea**

- Initially occurs during strenuous exercise.
- Progresses to breathlessness during ordinary activities.
- In advanced disease, the patient may become breathless while dressing or even at rest.

Why? Air trapping and hyperinflation increase the work of breathing. The diaphragm becomes flattened and less mechanically efficient.

**2. Chronic cough**

May be intermittent or persistent. It can precede breathlessness by years.

**3. Chronic sputum production**

Due to increased mucus production from inflamed airways and enlarged mucus-secreting glands.

**4. Wheezing and chest tightness**

Due to narrowed airways and turbulent airflow.

**5. Recurrent lower respiratory tract infections**

Impaired mucociliary clearance and retained secretions make infections more likely.

**6. Fatigue and reduced exercise tolerance**

The patient uses more energy to breathe, may have hypoxaemia, and often becomes physically deconditioned.

## B. Physical examination

| Finding | Why it occurs |
| --- | --- |
| Tachypnoea | Increased respiratory effort and ventilatory demand. |
| Prolonged expiration | Narrowed airways slow expiratory airflow. |
| Wheezing | Air passes through narrowed airways. |
| Reduced breath sounds | Reduced airflow and hyperinflation. |
| Hyperresonant percussion | Excess air trapped in the lungs. |
| Barrel-shaped chest | Chronic lung hyperinflation increases the anteroposterior chest diameter. |
| Use of accessory muscles | Increased work of breathing. |
| Pursed-lip breathing | Creates back-pressure during expiration, helping prevent premature small-airway collapse. |
| Tripod position | Allows accessory respiratory muscles to work more effectively. |

**Advanced COPD may present with:**

- Weight loss and muscle wasting.
- Peripheral cyanosis.
- Peripheral oedema.
- Raised jugular venous pressure.
- Hepatomegaly.

These may indicate advanced disease or associated pulmonary hypertension and cor pulmonale.

Important: Peripheral oedema in COPD is not automatically cor pulmonale. Consider heart failure, renal disease and other causes.

# 8. Diagnosis of COPD

COPD diagnosis requires two things:

1. A compatible clinical history.
2. Confirmation of persistent airflow obstruction by spirometry.

## A. Spirometry: the most important investigation

The patient takes a maximal inspiration and then exhales as forcefully and completely as possible into a spirometer.

The machine measures FEV₁ and FVC.

**Example:**

A patient has:

- FEV₁ = 1.2 L
- FVC = 2.4 L

FEV₁/FVC = 1.2/2.4 = 0.50

The ratio is below 0.70, indicating airflow obstruction.

We then administer a short-acting bronchodilator and repeat spirometry.

Why?

To determine whether airflow obstruction persists despite bronchodilation and to help distinguish COPD from asthma.

**Important distinction:** COPD can show some bronchodilator reversibility. A positive bronchodilator response does not automatically exclude COPD.

## B. Understanding FEV₁ severity classification

Once airflow obstruction is confirmed, use post-bronchodilator FEV₁ to grade its severity.

| GOLD grade | FEV₁ (% predicted) | Severity |
| --- | --- | --- |
| GOLD 1 | ≥80% | Mild |
| GOLD 2 | 50–79% | Moderate |
| GOLD 3 | 30–49% | Severe |
| GOLD 4 | <30% | Very severe |

This is the system used in your 2022 guideline.

## D. The newer GOLD ABE classification

The newer GOLD system combines the former C and D groups into **Group E**, because exacerbation risk is particularly important in treatment selection.

| Group | Symptoms | Exacerbations in previous year |
| --- | --- | --- |
| A | mMRC 0–1 or CAT/CAAT below 10 | 0 moderate or severe |
| B | mMRC ≥2 or CAT/CAAT ≥10 | 0 moderate or severe |
| E | Any symptom level | ≥1 moderate or severe |

The 2026 GOLD approach uses this ABE assessment.

**Clinical takeaway:** Do not confuse GOLD 1–4 with Groups A, B and E. One measures airflow obstruction; the other helps guide treatment.

# 12. BODE index: predicting prognosis

BODE is a multidimensional index used to assess COPD severity and predict mortality.

It is more informative than FEV₁ alone because it incorporates four dimensions:

- **B: BMI.** Body mass index.
- **O: Obstruction.** FEV₁ % predicted.
- **D: Dyspnoea.** mMRC grade.
- **E: Exercise capacity.** 6-minute walk distance.

## A. Scoring

| Parameter | 0 points | 1 point | 2 points | 3 points |
| --- | --- | --- | --- | --- |
| BMI | >21 | ≤21 | - | - |
| FEV₁ % predicted | ≥65 | 50–64 | 35–49 | <35 |
| mMRC dyspnoea grade | 0–1 | 2 | 3 | 4 |
| 6-minute walk distance (m) | ≥350 | 250–349 | 150–249 | ≤149 |

# Non-pharmacological management

## A. Smoking cessation

This is the most important intervention for a patient who smokes.

Why?

Continued smoking maintains airway inflammation and accelerates lung-function decline.

Stopping smoking reduces ongoing exposure and slows further damage.

Approach:

- Ask about smoking at every visit.
- Advise the patient to stop.
- Assess willingness to quit.
- Offer behavioural support.
- Consider nicotine replacement therapy, varenicline or bupropion where appropriate and available.

## B. Pulmonary rehabilitation

This is a structured programme involving exercise training, education and behaviour modification.

Why does it help?

COPD patients often become inactive because of breathlessness. Reduced activity causes muscle deconditioning, which makes even minor activity increasingly difficult.

Pulmonary rehabilitation interrupts this cycle by improving:

- Peripheral muscle strength.
- Exercise tolerance.
- Breathing efficiency.
- Confidence in performing daily activities.

## C. Vaccination

Vaccination helps prevent infections that can trigger exacerbations.

Consider:

- Annual influenza vaccination.
- Pneumococcal vaccination according to age, risk and national availability.
- COVID-19 vaccination according to current recommendations.
- RSV vaccination for eligible older or high-risk adults where available.

## D. Nutrition

Assess weight, BMI and muscle mass.

- Underweight patients may need increased calorie and protein intake.
- Obesity may increase the work of breathing.
- Malnutrition and muscle wasting are associated with poor prognosis.

## E. Breathing techniques

**Pursed-lip breathing**

The patient:

1. Breathes in slowly through the nose.
2. Purses the lips as if blowing out a candle.
3. Exhales slowly through the narrowed lips.

Why?

The increased pressure during expiration helps prevent premature collapse of small airways, reduces air trapping and may relieve breathlessness.

# 15. Pharmacological management: understanding the inhalers

*High-yield clinical section*

The main pharmacological treatment of COPD is bronchodilation.

There are two principal bronchodilator families:

1. Beta-2 agonists.
2. Muscarinic antagonists.

Let's understand them before prescribing.

## A. Beta-2 agonists

Examples:

- Salbutamol (SABA).
- Salmeterol (LABA).
- Formoterol (LABA).

**Mechanism of action**

Beta-2 receptors are present on bronchial smooth muscle.

When a beta-2 agonist stimulates these receptors:

β₂ → Gs → increased cAMP

Increased cAMP relaxes bronchial smooth muscle, causing bronchodilation.

**Clinical implications:**

- Airways widen.
- Airway resistance decreases.
- Expiration becomes easier.
- Breathlessness improves.

Potential adverse effects:

- Tremor.
- Palpitations.
- Tachycardia.
- Hypokalaemia, particularly with high doses.

## B. Muscarinic antagonists

Examples:

- Ipratropium (SAMA).
- Tiotropium (LAMA).
- Glycopyrronium (LAMA).
- Umeclidinium (LAMA).

Normally, acetylcholine stimulates M3 receptors on bronchial smooth muscle, causing bronchoconstriction and increased mucus secretion.

Antimuscarinic drugs block this effect.

M3 receptor blockade → reduced bronchoconstriction → bronchodilation

Potential adverse effects:

- Dry mouth.
- Urinary retention, especially in patients with prostatic enlargement.
- Precipitation of narrow-angle glaucoma if nebulised medication enters the eyes.

## C. Short-acting versus long-acting bronchodilators

| Class | Examples | Main role |
| --- | --- | --- |
| SABA | Salbutamol | Rapid relief of symptoms |
| SAMA | Ipratropium | Short-term bronchodilation |
| LABA | Formoterol, salmeterol | Maintenance bronchodilation |
| LAMA | Tiotropium, umeclidinium | Maintenance bronchodilation |

**Important distinction:**

Short-acting drugs provide rapid relief, whereas long-acting drugs maintain bronchodilation for many hours.

Long-acting bronchodilators are generally preferred for regular maintenance treatment.

# 16. Specific bronchodilator doses

These are common adult doses; the exact device and available formulation determine the prescribed dose.

| Drug | Typical dose | Clinical role |
| --- | --- | --- |
| Salbutamol inhaler | 100 micrograms, 1–2 puffs as needed | Rescue bronchodilator |
| Ipratropium inhaler | 20 micrograms, 2 puffs four times daily | Short-acting maintenance or acute relief |
| Salmeterol | 50 micrograms inhaled twice daily | LABA maintenance |
| Formoterol | 12 micrograms inhaled twice daily | LABA maintenance |
| Tiotropium HandiHaler | 18 micrograms inhaled once daily | LAMA maintenance |
| Umeclidinium | 62.5 micrograms inhaled once daily | LAMA maintenance |

**Why do we often prefer a LAMA over LABA monotherapy in patients with frequent exacerbations?**

LAMA treatment has a particularly useful effect on reducing exacerbations and hospitalisations. However, the choice should also consider symptoms, response, inhaler availability and tolerability.

## D. LABA + LAMA combination

This combines two different mechanisms:

- LABA stimulates beta-2 receptors.
- LAMA blocks muscarinic M3 receptors.

The result is complementary bronchodilation.

Why combine them?

Compared with either drug alone, the combination can:

- Improve FEV₁.
- Reduce dyspnoea.
- Improve exercise tolerance.
- Improve health status.
- Reduce exacerbations.

For many symptomatic COPD patients, LABA + LAMA is the preferred maintenance combination.

Examples of combinations include:

- Umeclidinium/vilanterol.
- Tiotropium/olodaterol.
- Glycopyrronium/indacaterol.

The doses are formulation-specific, so prescribe according to the actual inhaler available.

# 17. Inhaled corticosteroids (ICS): when do we add them?

Examples:

- Budesonide.
- Beclometasone.
- Fluticasone.

Unlike bronchodilators, corticosteroids do not primarily work by relaxing airway smooth muscle.

They reduce airway inflammation.

## Mechanism

ICS enters airway cells and binds intracellular glucocorticoid receptors. This modifies gene transcription, suppressing inflammatory mediators and reducing inflammatory activity.

## Why are they not given to every COPD patient?

Because COPD inflammation is not uniformly corticosteroid-responsive. In addition, regular ICS use increases the risk of pneumonia.

ICS is particularly useful in selected patients with:

- Frequent exacerbations despite bronchodilator treatment.
- Higher blood eosinophil counts.
- Concomitant asthma.

Blood eosinophils help predict the likelihood of benefit from ICS:

| Blood eosinophils | Likelihood of exacerbation reduction with ICS |
| --- | --- |
| <100 cells/µL | Low |
| 100–300 cells/µL | Moderate |
| ≥300 cells/µL | Highest |

## Triple therapy: ICS + LABA + LAMA

It combines:

1. LABA: relaxes bronchial smooth muscle.
2. LAMA: blocks cholinergic bronchoconstriction.
3. ICS: reduces airway inflammation.

**When is it considered?**

For a patient who continues to have exacerbations despite appropriate dual bronchodilation, especially when blood eosinophils are elevated. At initiation, current GOLD guidance also considers triple therapy in selected high-risk patients with eosinophils ≥300 cells/µL.

**Important adverse effects of ICS:**

- Pneumonia.
- Oral candidiasis.
- Dysphonia.
- Bruising.
- Possible systemic effects with prolonged high-dose exposure.

Teach patients to rinse their mouth and spit after using an ICS-containing inhaler.

# 18. Other drugs used in selected COPD patients

## A. Roflumilast

*PDE-4 inhibitor*

**Dose:** 500 micrograms orally once daily.

Some patients start with 250 micrograms once daily for four weeks to improve tolerability, then increase to 500 micrograms daily. The 250-microgram dose is not the maintenance therapeutic dose.

**Mechanism:**

Roflumilast inhibits phosphodiesterase-4 (PDE-4), increasing intracellular cAMP in inflammatory cells and reducing inflammatory activity.

**Why prescribe it?**

It is considered in patients with:

- Severe airflow obstruction, usually FEV₁ below 50% predicted.
- Chronic bronchitis.
- Persistent exacerbations despite appropriate inhaled treatment, particularly triple therapy.

It is not a rescue bronchodilator.

**Important adverse effects:**

- Diarrhoea.
- Nausea.
- Reduced appetite.
- Weight loss.
- Insomnia.
- Depression and other psychiatric effects.

Avoid or use extreme caution in patients with significant underweight or a history of depression or suicidal behaviour.

## B. Long-term macrolides

Example: azithromycin.

Your Rwanda guideline describes:

- Azithromycin 250 mg orally daily, or
- 500 mg orally three times weekly,
- For one year in selected patients prone to exacerbations.

**Why does azithromycin help?**

Besides its antibacterial action, macrolides have immunomodulatory effects that may reduce airway inflammation and exacerbation frequency.

**Why not prescribe it to everyone?**

Long-term use can cause:

- QT prolongation and torsades de pointes.
- Hearing impairment.
- Antimicrobial resistance.
- Gastrointestinal adverse effects.

Before starting, review the ECG/QTc, interacting medications, hearing history and potential microbiological consequences. Benefit is generally more favourable in selected former smokers with recurrent exacerbations.

## C. Mucolytics

Examples:

- N-acetylcysteine (NAC).
- Carbocisteine.

**Mechanism:** They reduce mucus viscosity, making sputum easier to clear.

N-acetylcysteine breaks disulphide bonds in mucus glycoproteins.

They may be considered in selected patients with chronic productive cough and recurrent exacerbations, but they are not substitutes for bronchodilators.

## D. Theophylline

Theophylline is a methylxanthine with bronchodilator activity, partly through phosphodiesterase inhibition and adenosine receptor antagonism.

However, its benefit in COPD is relatively modest.

Why is it not routinely preferred?

It has a narrow therapeutic index, meaning the difference between an effective dose and a toxic dose is small.

Toxicity can cause:

- Nausea and vomiting.
- Tremors.
- Tachyarrhythmias.
- Seizures.

It also has many drug interactions. Your guideline appropriately reserves it for situations where preferred long-acting inhalers are unavailable or unaffordable.

# 19. Choosing maintenance treatment: practical clinical examples

Using the older Rwanda ABCD classification:

| Group | Initial treatment in the 2022 guideline |
| --- | --- |
| A | A bronchodilator |
| B | LABA or LAMA |
| C | LAMA |
| D | LAMA, LAMA + LABA or ICS + LABA |

The current GOLD 2026 approach differs:

| Group | Preferred initial approach |
| --- | --- |
| A | A bronchodilator, preferably long-acting unless symptoms are very occasional |
| B | LABA + LAMA |
| E | LABA + LAMA; consider initial triple therapy if eosinophils ≥300 cells/µL |

**Let's apply this.**

- Patient with mMRC 1 and no exacerbations: Group A. Start a bronchodilator.
- Patient with mMRC 3 and no exacerbations: Group B. Start LABA + LAMA.
- Patient with mMRC 1 but two moderate exacerbations last year: Group E. Start LABA + LAMA.
- Patient with frequent exacerbations and eosinophils 400 cells/µL: consider triple therapy.

The decision is not based on FEV₁ alone.

# PART 5. Acute exacerbation of COPD

This is particularly important for emergency medicine and internal medicine.

# 20. What is an acute exacerbation?

An acute exacerbation of COPD (AECOPD) is an acute worsening of respiratory symptoms, usually over less than 14 days, requiring additional treatment.

Common manifestations:

- Increased dyspnoea.
- Increased cough.
- Increased sputum volume.
- Increased sputum purulence.
- Wheezing and chest tightness.

## Common causes

1. Bacterial respiratory infection.
2. Viral respiratory infection.
3. Air pollution and smoke exposure.
4. Poor adherence to maintenance treatment.
5. Other acute illnesses that mimic or precipitate exacerbation.

Common bacterial organisms include *Haemophilus influenzae*, *Streptococcus pneumoniae* and *Moraxella catarrhalis*. Severe disease or structural lung disease may involve Gram-negative organisms such as *Pseudomonas aeruginosa*.

**Important:** Not every episode of increased breathlessness in a patient with COPD is an exacerbation.

Always consider pneumonia, pulmonary embolism, pneumothorax, acute heart failure and arrhythmia.

# 21. Initial emergency assessment

Use an ABCDE approach.

**A – Airway**

Is the airway patent? Is the patient able to speak? Are there secretions or reduced consciousness?

**B – Breathing**

- Respiratory rate.
- SpO₂.
- Accessory muscle use.
- Chest expansion and breath sounds.
- Signs of exhaustion or silent chest.

**C – Circulation**

- Blood pressure.
- Heart rate.
- Peripheral perfusion.
- ECG where indicated.

**D – Disability**

Assess consciousness and confusion. Hypercapnia can cause headache, drowsiness and eventually coma.

**E – Exposure**

Look for fever, oedema, signs of DVT, chest trauma and other clues to the precipitating cause.

## Investigations during exacerbation

- **ABG:** Particularly important if hypoxaemic, drowsy, severely breathless or suspected of hypercapnic respiratory failure. It tells us the PaO₂, PaCO₂ and pH.
- **Chest X-ray:** Look for pneumonia, pneumothorax, pleural effusion and pulmonary oedema.
- **FBC:** Look for leukocytosis, anaemia and polycythaemia.
- **Urea, creatinine and electrolytes:** Assess renal function, dehydration and electrolyte abnormalities.
- **ECG:** Detect arrhythmia and possible myocardial ischaemia.
- **Sputum culture:** Consider in severe disease, frequent exacerbations, previous resistant organisms or treatment failure.
- **Troponin, BNP/NT-proBNP and D-dimer:** Use when the clinical presentation suggests myocardial infarction, heart failure or pulmonary embolism, respectively.

Do not delay emergency treatment while waiting for investigations.

# 22. Acute exacerbation treatment: exact drugs and why we use them

The immediate priorities are:

1. Relieve bronchoconstriction.
2. Correct hypoxaemia without causing oxygen-induced hypercapnia.
3. Reduce airway inflammation.
4. Treat bacterial infection when indicated.
5. Identify and manage respiratory failure.

## A. First-line bronchodilators

Use a short-acting beta-2 agonist, with or without a short-acting antimuscarinic.

**1. Salbutamol**

*First-line rescue bronchodilator*

- Nebulised: **2.5–5 mg every 20 minutes for the first hour** in a significant exacerbation, then reassess and individualise frequency.
- Metered-dose inhaler: commonly 4–10 puffs (100 micrograms per puff) through a spacer, repeated according to response and severity.

**Why?**

Salbutamol stimulates beta-2 receptors, increases cAMP and relaxes bronchial smooth muscle.

This rapidly reduces bronchoconstriction and improves expiratory airflow.

Adverse effects:

- Tremor.
- Tachycardia.
- Palpitations.
- Hypokalaemia, especially with repeated high doses.

**2. Ipratropium bromide**

- Nebulised: **500 micrograms every 4–6 hours**.
- Metered-dose inhaler: 20 micrograms per puff, commonly 4–8 puffs per treatment, depending on severity and local protocol.

**Why add ipratropium?**

It blocks muscarinic receptors, preventing acetylcholine-mediated bronchoconstriction.

It works through a different mechanism from salbutamol, so combining them produces greater bronchodilation than either alone.

**Why use salbutamol + ipratropium?**

- **Salbutamol:** Beta-2 stimulation
- **Ipratropium:** M3 blockade
- **Greater bronchodilation:** Reduced airway resistance and improved airflow

Monitor heart rate, potassium and clinical response, especially when repeated nebulisations are needed.

## B. Oxygen therapy

*Do not give uncontrolled high-flow oxygen routinely*

In acute COPD exacerbation, oxygen is prescribed to correct hypoxaemia.

**Target SpO₂: 88–92%.**

Why not aim for 98–100%?

Some patients with advanced COPD have chronic CO₂ retention. Excessive oxygen can worsen hypercapnia through several mechanisms:

1. Reversal of hypoxic pulmonary vasoconstriction increases blood flow to poorly ventilated lung regions, worsening V/Q mismatch.
2. The Haldane effect causes oxygenated haemoglobin to carry less CO₂, increasing dissolved CO₂ in blood.
3. A reduction in ventilatory drive may contribute, but it is not the main mechanism in most patients.

The result can be worsening respiratory acidosis, drowsiness and respiratory failure.

**How do we administer oxygen?**

- Controlled oxygen via Venturi mask, often 24% or 28%.
- Nasal cannula can also be used with careful titration.
- Recheck saturation and obtain ABG when indicated.

If the patient is severely hypoxaemic, give oxygen immediately while titrating to the target. Never withhold necessary oxygen because of fear of CO₂ retention.

**ABG is essential when there is concern about hypercapnic respiratory failure.**

For example:

| ABG parameter | Result |
| --- | --- |
| pH | 7.25 |
| PaCO₂ | 75 mmHg |
| PaO₂ | 55 mmHg |
| HCO₃⁻ | 32 mmol/L |

Interpretation:

- Low pH: acidaemia.
- High PaCO₂: respiratory acidosis.
- Elevated bicarbonate: renal compensation, suggesting chronic CO₂ retention with acute deterioration.

This is **acute-on-chronic hypercapnic respiratory failure**.

## C. Systemic corticosteroids

*Recommended for significant exacerbations*

**Prednisolone 40 mg orally once daily for 5 days.**

If the patient cannot take oral medication or has another reason requiring IV therapy, an equivalent systemic corticosteroid can be used, for example:

- Methylprednisolone 32 mg IV daily, approximately equivalent to prednisolone 40 mg.

**Why do we prescribe corticosteroids?**

During exacerbation, airway inflammation increases. This causes:

- Increased airway wall oedema.
- Increased mucus production.
- Worsening airflow obstruction.

Corticosteroids suppress inflammatory gene expression and reduce airway inflammation.

Clinical benefits:

- Improves FEV₁.
- Improves oxygenation.
- Speeds recovery.
- Reduces treatment failure and hospital stay.

**Why only 5 days?**

Longer treatment usually provides no additional benefit in routine exacerbations but increases exposure to adverse effects.

Watch for:

- Hyperglycaemia.
- Increased infection risk.
- Mood changes and insomnia.
- Fluid retention.

Oral prednisolone is generally as effective as IV corticosteroids. IV administration is not automatically superior.

## D. Antibiotics

*Only when indicated*

COPD exacerbations are frequently viral or non-infectious. Therefore, antibiotics are not required for every exacerbation.

**When should we prescribe antibiotics?**

The classical Anthonisen criteria consider three symptoms:

1. Increased dyspnoea.
2. Increased sputum volume.
3. Increased sputum purulence.

Antibiotics are particularly indicated when:

- All three symptoms are present.
- Two symptoms are present, provided one is increased sputum purulence.
- The patient requires invasive or non-invasive mechanical ventilation.

A previous positive sputum bacterial culture can also support antibiotic treatment.

**Why is sputum purulence important?**

Yellow or green sputum can reflect neutrophilic inflammation and myeloperoxidase activity. It increases the likelihood of bacterial infection, although it is not definitive proof.

**Common empirical options for uncomplicated bacterial exacerbation:**

| Antibiotic | Adult dose | Typical duration |
| --- | --- | --- |
| Amoxicillin-clavulanate | 875/125 mg PO every 12 hours | 5 days |
| Doxycycline | 100 mg PO every 12 hours | 5 days |
| Azithromycin | 500 mg PO on day 1, then 250 mg daily on days 2–5 | 5 days |

Selection depends on allergy history, renal function, recent antibiotic exposure, local resistance and suspected organism.

**Why amoxicillin-clavulanate?**

- Amoxicillin inhibits bacterial cell-wall synthesis.
- Clavulanate inhibits beta-lactamases produced by some bacteria.

This broadens activity against common respiratory pathogens, including beta-lactamase-producing *H. influenzae* and *Moraxella catarrhalis*.

**Why doxycycline?**

It inhibits the bacterial 30S ribosomal subunit, preventing protein synthesis. It covers several common respiratory pathogens and provides an alternative in selected patients.

**Why azithromycin?**

It inhibits the 50S ribosomal subunit and covers some typical and atypical respiratory organisms.

However, remember its potential to prolong QT and interact with other medications.

**When should we consider broader coverage?**

In patients with severe airflow obstruction, frequent exacerbations, bronchiectasis, previous isolation of resistant bacteria or mechanical ventilation, consider sputum cultures and assess the risk of *Pseudomonas* or other resistant organisms.

Do not automatically prescribe broad-spectrum antibiotics without assessing risk.

The 2027 GOLD report recommends a 5-day antibiotic course when antibiotics are indicated. The Rwanda 2022 guideline allows 5–7 days.

## E. Non-invasive ventilation (NIV)

*Important intervention in hypercapnic respiratory failure*

NIV provides ventilatory support through a tight-fitting mask without inserting an endotracheal tube.

The common mode is BiPAP, which delivers two pressure levels:

- IPAP: inspiratory positive airway pressure.
- EPAP: expiratory positive airway pressure.

**Why does NIV help?**

The patient with COPD has increased work of breathing and may be unable to ventilate sufficiently.

IPAP increases the pressure gradient that drives inspiration, improving alveolar ventilation and CO₂ elimination.

EPAP helps maintain airway patency and can improve oxygenation.

**When do we consider NIV?**

A key indication is persistent acute hypercapnic respiratory acidosis despite initial optimal treatment, typically:

**pH ≤ 7.35 and PaCO₂ > 45 mmHg**

Especially when accompanied by severe dyspnoea, respiratory muscle fatigue or persistent hypoxaemia.

**Contraindications or situations requiring particular caution:**

- Respiratory or cardiac arrest.
- Inability to protect the airway.
- Severe altered consciousness.
- Active vomiting or high aspiration risk.
- Facial trauma preventing mask fitting.
- Severe haemodynamic instability.

NIV requires close monitoring. If the patient deteriorates or fails NIV, do not delay intubation when indicated.

## F. When do we intubate and refer to ICU?

Consider urgent ICU referral for:

- Respiratory arrest or impending arrest.
- Severe or worsening respiratory acidosis despite NIV.
- NIV failure or contraindication.
- Persistent severe hypoxaemia.
- Severe respiratory muscle fatigue.
- Reduced consciousness or inability to protect the airway.
- Haemodynamic instability or shock.

**Clinical point:** A patient with pH 7.18, worsening drowsiness and rising PaCO₂ despite NIV needs urgent escalation, not repeated routine nebulisations alone.

# 23. Supportive management during admission

Do not focus only on inhalers.

- **Hydration:** Correct dehydration, but avoid fluid overload, particularly in patients with heart failure.
- **Nutrition:** Provide adequate calories and protein.
- **VTE prophylaxis:** Consider LMWH in immobile hospitalised patients if bleeding risk and renal function permit.
- **Treat the trigger:** Manage pneumonia, heart failure, arrhythmia or pulmonary embolism when present.
- **Continue or optimise maintenance bronchodilators:** Restart/optimise long-acting inhalers as the patient stabilises.
- **Smoking cessation:** Use the admission as an opportunity for intervention.
- **Chest physiotherapy:** Consider when there is significant retained sputum or difficulty clearing secretions, rather than using it routinely in every patient.

# 24. When can we discharge?

A patient should be considered for discharge when:

- Symptoms have improved sufficiently.
- Oxygenation is stable on an appropriate oxygen regimen.
- The patient is haemodynamically stable.
- The patient can eat, drink and take oral medication.
- The patient can use inhalers correctly.
- There is no unresolved complication requiring inpatient care.
- A follow-up and treatment plan is arranged.

Before discharge:

1. Review the maintenance inhaler regimen.
2. Demonstrate inhaler technique.
3. Assess the need for home oxygen.
4. Arrange follow-up.
5. Explain early warning signs of another exacerbation.

Recovery may take several weeks, and some patients do not return fully to their previous functional state.

# PART 6. Long-term oxygen therapy and complications

# 25. Long-term oxygen therapy (LTOT)

Not every COPD patient needs home oxygen.

LTOT is indicated in selected patients with **severe chronic resting hypoxaemia**, after assessment in a clinically stable state.

Typical criteria:

- PaO₂ ≤55 mmHg or SaO₂ ≤88%; OR
- PaO₂ 55–60 mmHg with pulmonary hypertension, peripheral oedema suggesting right-heart failure, or haematocrit ≥55%.

**Why prescribe oxygen long-term?**

Chronic hypoxaemia causes pulmonary vasoconstriction, which can lead to pulmonary hypertension, right ventricular strain and cor pulmonale.

In appropriately selected patients, LTOT improves survival.

The patient should generally use oxygen for at least **15 hours daily**, with the prescribed flow titrated to achieve adequate oxygenation.

Reassess after approximately 60–90 days to determine whether oxygen remains necessary.

# 26. Complications of COPD

## A. Pulmonary hypertension

Chronic alveolar hypoxia causes pulmonary arteriolar vasoconstriction.

Persistent vasoconstriction, together with vascular remodelling, increases pulmonary vascular resistance.

## B. Cor pulmonale

Cor pulmonale is right ventricular structural or functional disease resulting from pulmonary hypertension due to lung disease.

Mechanism:

COPD → hypoxic vasoconstriction → pulmonary hypertension → RV hypertrophy/dilatation

Clinical features:

- Raised JVP.
- Peripheral oedema.
- Hepatomegaly.
- Parasternal heave.
- Loud P2.

## C. Acute respiratory failure

- Type 1: hypoxaemic respiratory failure.
- Type 2: hypercapnic respiratory failure.

Advanced COPD commonly predisposes to type 2 respiratory failure.

## D. Pneumothorax

Emphysematous bullae may rupture, allowing air into the pleural space.

Suspect it when a COPD patient suddenly develops severe dyspnoea and unilateral chest pain with reduced breath sounds on one side.

## E. Other complications

- Recurrent pneumonia.
- Secondary polycythaemia.
- Cachexia and muscle wasting.
- Anxiety and depression.
- Cardiovascular disease.
- Lung cancer.

# 27. Important update to your study notes

The GOLD 2027 report was released on 15 November 2026, so it is now the latest international reference. The Rwanda 2022 guideline remains useful for your local clinical framework, but remember these differences:

1. GOLD now uses ABE rather than ABCD.
2. Group E includes even one moderate exacerbation in the previous year.
3. Current GOLD 2027 recommends a LAMA for Group A and LABA + LAMA for Group B and E, with consideration of triple therapy in Group E when eosinophils are ≥300 cells/µL.
4. GOLD recommends five days of systemic corticosteroids for significant exacerbations and five days of antibiotics when indicated.

# PART 7. Clinical application

Let's see whether you can apply this knowledge in a hospital setting.

## Clinical case 1

**A 68-year-old man presents to the emergency department.**

He has a 20-year history of cigarette smoking and a known diagnosis of COPD.

He reports:

- Three days of worsening breathlessness.
- Increased cough.
- Increased sputum volume.
- Sputum has changed from white to yellow-green.

Examination:

- RR: 32/min.
- HR: 115/min.
- BP: 130/80 mmHg.
- SpO₂: 84% on room air.
- Accessory muscle use.
- Diffuse expiratory wheezing.
- Alert but visibly distressed.

ABG on room air:

| Parameter | Result |
| --- | --- |
| pH | 7.28 |
| PaCO₂ | 68 mmHg |
| PaO₂ | 52 mmHg |
| HCO₃⁻ | 31 mmol/L |

**Question 1. What is the most likely diagnosis?**

- Stable COPD
- Acute exacerbation of COPD with acute-on-chronic hypercapnic respiratory failure
- Isolated pneumonia
- Acute pulmonary embolism

**Question 2. What oxygen saturation target would you choose initially?**

- 88–92%
- 94–98%
- 100%
- 80–85%

**Question 3. Which respiratory support should you urgently consider given the ABG?**

- Nasal oxygen only
- Non-invasive ventilation
- Discharge with inhalers
- No respiratory support

**Question 4. What systemic corticosteroid regimen is appropriate?**

- Prednisolone 40 mg orally daily for 5 days
- Prednisolone 40 mg daily for 30 days
- No corticosteroids
- Inhaled salbutamol alone

The next important skill is to be able to take a patient from the emergency department all the way through diagnosis, prescribing, monitoring, ICU referral if necessary, and safe discharge. That is what we will practise with clinical cases.

This is a particularly important topic because infective endocarditis can rapidly become life-threatening, and choosing antibiotics before obtaining appropriate blood cultures can make the diagnosis much harder.

# **Infective endocarditis: our study plan**

1. Definition, classification and pathophysiology.
2. Risk factors and causative organisms.
3. Clinical presentation: fever, murmurs, peripheral signs and why they occur.
4. Diagnosis: blood cultures, echocardiography and Duke criteria.
5. Investigations and interpretation.
6. Empirical and organism-specific antibiotic treatment, including doses, routes, duration and rationale.
7. Complications: heart failure, embolism, stroke, abscesses and renal injury.
8. Indications for urgent surgery and referral.
9. Monitoring, discharge and prevention.
10. Clinical cases and prescribing exercises.

We will distinguish **native-valve, prosthetic-valve and device-associated endocarditis**, as their management can differ.

# **PART 1. Understanding infective endocarditis**

## **1. Definition**

**Infective endocarditis (IE)** is an infection of the endocardial surface of the heart, most commonly involving the heart valves.

It can also affect:

- Prosthetic heart valves.
- Intracardiac devices and pacemaker leads.
- Congenital heart defects.
- Other areas of the endocardium.

The characteristic lesion is called a **vegetation**.

### **What exactly is a vegetation?**

A vegetation is an abnormal mass attached to a valve or endocardial surface, composed mainly of:

- Platelets.
- Fibrin.
- Microorganisms.
- Inflammatory cells and cellular debris.

Think of it as a **mass of infected material attached to the heart valve**.

Why is it dangerous?

1. It can destroy the valve, causing regurgitation.
2. Pieces can break off and travel through the bloodstream, causing emboli.
3. Infection can extend into surrounding cardiac tissue, producing an abscess.
4. Persistent infection can cause sepsis and death.

## **2. Classification of infective endocarditis**

There are several ways to classify IE.

### **A. According to the type of valve or cardiac structure**

**1. Native valve endocarditis (NVE)**

Infection involving the patient's own heart valves.

Commonly affects the mitral and aortic valves.

**2. Prosthetic valve endocarditis (PVE)**

Infection involving an artificial heart valve.

May be early or late after valve implantation. Early infections are particularly concerning for healthcare-associated organisms, including staphylococci.

**3. Device-associated endocarditis**

Infection involving pacemaker or implantable cardioverter-defibrillator leads or other intracardiac foreign material.

### **B. According to the clinical course**

**Acute infective endocarditis**

- Develops rapidly over days.
- Often associated with highly virulent organisms, especially *Staphylococcus aureus*.
- Can affect previously normal valves.
- May cause rapid valve destruction, sepsis and heart failure.

**Subacute infective endocarditis**

- Develops gradually over weeks or months.
- Often caused by less virulent organisms, such as viridans group streptococci.
- More commonly occurs on previously abnormal valves.
- May present with prolonged fever, fatigue, weight loss and anaemia.

| Feature | Acute IE | Subacute IE |
| --- | --- | --- |
| Onset | Rapid | Gradual |
| Typical organism | *S. aureus* | Viridans streptococci |
| Fever | Often high | May be low-grade |
| Valve destruction | Rapid and severe | Usually slower |
| Clinical course | Aggressive | More indolent |

**Important:** These are clinical patterns, not absolute rules. For example, *S. aureus* can also cause subacute disease.

### **C. According to the affected side of the heart**

**Left-sided endocarditis**

- Involves the mitral or aortic valve.
- Emboli travel into systemic circulation.
- Can cause stroke, splenic infarction, renal infarction and limb ischaemia.

**Right-sided endocarditis**

- Usually involves the tricuspid valve.
- Particularly associated with injection drug use and intravascular devices.
- Emboli travel to the pulmonary circulation, causing septic pulmonary emboli, pulmonary infarcts and sometimes lung abscesses.

## **3. Pathophysiology: how does infective endocarditis develop?**

This is one of the most important concepts to understand.

Let's follow the process step by step.

1. **Endothelial injury or abnormal valve surface**

Turbulent blood flow, previous valve damage, congenital abnormalities or prosthetic material can predispose to injury or abnormal surfaces.

2. **Platelets and fibrin accumulate**

The injured area becomes covered with a small sterile thrombus containing platelets and fibrin.

This is sometimes called non-bacterial thrombotic vegetation.

3. **Transient bacteraemia occurs**

Microorganisms enter the bloodstream, for example from infected skin, oral infections, vascular access or other infections.

4. **Microorganisms attach to the thrombus**

Bacteria adhere to the platelet-fibrin material and multiply.

*Staphylococcus aureus* is particularly important because it can also adhere to and infect relatively undamaged endothelium.

5. **Vegetation develops**

More platelets and fibrin accumulate around the microorganisms, creating a mass of infected material.

The fibrin-platelet matrix protects bacteria from immune clearance and makes eradication difficult.

6. **Cardiac and systemic complications develop**

Valve destruction, regurgitation, abscess formation, persistent bacteraemia and embolisation may occur.

### **Why does IE cause valve regurgitation?**

Imagine a normal mitral valve.

During systole, the mitral valve should close completely to prevent blood from flowing backwards from the left ventricle into the left atrium.

When infection destroys the valve leaflets or damages their supporting structures, the valve may no longer close properly.

Blood then flows backwards.

This produces **mitral regurgitation**.

The same principle applies to aortic valve infection, which can cause aortic regurgitation.

### **Why can IE cause heart failure?**

Valve destruction produces acute or progressive regurgitation.

For example, severe acute aortic regurgitation causes blood to flow backwards into the left ventricle during diastole.

The ventricle suddenly receives additional blood volume, increasing filling pressures and potentially causing pulmonary oedema.

This is why acute severe valve regurgitation is a surgical emergency in some patients.

### **Why does IE cause embolism?**

Vegetations are friable, meaning pieces can break away.

These fragments enter the bloodstream and travel until they lodge in a vessel.

- Left-sided vegetation → systemic embolism.
- Right-sided vegetation → pulmonary embolism, usually septic.

This explains why a patient with IE may present with a stroke, sudden abdominal pain, limb ischaemia or respiratory symptoms.

## **4. Risk factors**

A patient is more likely to develop IE when they have a cardiac surface or clinical situation that permits microorganisms to attach and multiply.

| Risk factor | Why it increases risk |
| --- | --- |
| Previous infective endocarditis | Previous infection may leave damaged valves and recurrence risk is increased. |
| Prosthetic heart valve | Artificial material provides a surface for microbial attachment. |
| Rheumatic heart disease | Damaged valves and abnormal blood flow predispose to endothelial injury. |
| Congenital heart disease | Abnormal blood flow can damage endocardium. |
| Degenerative valvular disease | Abnormal valve surfaces and turbulent flow increase susceptibility. |
| Injection drug use | Repeated introduction of bacteria directly into the bloodstream. |
| Haemodialysis | Repeated vascular access and healthcare exposure. |
| Indwelling venous catheters | Can introduce microorganisms into blood. |
| Cardiac implanted devices | Leads and intracardiac foreign material can become infected. |
| Poor dental health | Oral bacteraemia can occur, particularly with gingival inflammation. |
| Immunosuppression | May increase susceptibility to certain infections. |

**Rwanda clinical relevance:** Remember rheumatic heart disease. A patient with previous rheumatic fever and chronic mitral valve disease has a predisposed cardiac surface and deserves particular attention when presenting with unexplained fever.

## **5. Causative organisms**

The most important organisms to know are:

| Organism | Important clinical association |
| --- | --- |
| *Staphylococcus aureus* | Acute, aggressive IE; injection drug use; healthcare-associated infection |
| Viridans group streptococci | Subacute disease; oral source |
| *Streptococcus gallolyticus* | Association with colorectal neoplasia |
| Enterococcus faecalis | Older patients, genitourinary or gastrointestinal sources |
| Coagulase-negative staphylococci | Particularly prosthetic valve endocarditis |
| HACEK organisms | Uncommon, fastidious Gram-negative organisms |
| Fungi, especially *Candida* and *Aspergillus* | Prosthetic valves, immunocompromised patients and other high-risk situations |

The 2023 ESC guideline identifies *S. aureus*, oral streptococci, *S. gallolyticus*, HACEK organisms and *E. faecalis* among the important typical IE pathogens.

### **A few important organisms explained**

**1. Staphylococcus aureus**

A highly virulent organism.

It can:

- Adhere to endocardial tissue.
- Cause rapid vegetation formation.
- Destroy valve tissue.
- Cause metastatic infection and abscesses.

**2. Viridans streptococci**

Normal inhabitants of the oral cavity.

They can enter the bloodstream during dental procedures or through inflamed gums, then adhere to previously damaged valves.

**3. Enterococcus faecalis**

An intestinal and genitourinary organism.

Think about it in older patients and those with urinary tract infection, instrumentation or gastrointestinal disease.

**4. Streptococcus gallolyticus**

This organism is particularly important because of its association with colorectal neoplasia.

When identified in IE, investigate for an underlying colorectal lesion according to clinical circumstances.

## **6. A clinical distinction you must remember**

A patient with prolonged fever is not automatically a patient with IE.

But consider IE when a patient has:

- Fever without a clear source.
- A pre-existing abnormal valve or prosthetic valve.
- A new or changing heart murmur.
- Persistent positive blood cultures.
- Unexplained embolic events.
- Features of systemic infection with no obvious explanation.

The 2023 ESC guideline specifically recommends considering IE in patients with sepsis or fever of unknown origin, particularly when risk factors are present.

## **Check your understanding**

**1. Why does infective endocarditis cause valve regurgitation?**

- Increased heart rate
- Destruction of valve leaflets or supporting structures
- Increased blood viscosity

**2. A patient with IE develops sudden left-sided weakness. What is the likely mechanism?**

- Septic embolism from a left-sided vegetation
- Pulmonary embolism
- Right ventricular failure

**3. Which organism is particularly associated with aggressive acute infective endocarditis?**

- Viridans streptococci
- Staphylococcus aureus
- Lactobacillus

**4. Why is Enterococcus faecalis important in older patients with IE?**

- It is associated with genitourinary and gastrointestinal sources
- It is exclusively transmitted by mosquitoes
- It only infects prosthetic valves

# **INFECTIVE ENDOCARDITIS**

## **PART 2. Clinical presentation: understanding every sign and symptom**

The clinical presentation of infective endocarditis is produced by three major mechanisms:

1. **Infection and inflammation:** cause fever, chills, fatigue and weight loss.
2. **Cardiac destruction:** causes murmurs, regurgitation and heart failure.
3. **Embolisation and immune reactions:** cause neurological deficits, skin manifestations, renal injury and other systemic findings.

Understanding these three mechanisms makes the clinical presentation much easier to remember.

## **1. General symptoms**

### **A. Fever**

Commonest clinical feature

Fever is caused by the body's inflammatory response to circulating microorganisms.

When bacteria enter the bloodstream, immune cells recognise them and release inflammatory cytokines, particularly:

- IL-1.
- IL-6.
- TNF-alpha.

These stimulate prostaglandin E2 production in the hypothalamus, increasing the body's temperature set point.

The patient develops fever, chills and sometimes rigors.

**Clinical distinction:**

- Acute IE: often presents with high fever and systemic toxicity.
- Subacute IE: may present with prolonged low-grade fever, fatigue and night sweats.

However, fever may be absent in elderly, immunocompromised or previously antibiotic-treated patients.

### **B. Fatigue and malaise**

Patients often complain of persistent tiredness, weakness and reduced ability to perform normal activities.

Why?

The persistent inflammatory response produces cytokines that affect metabolism, appetite and energy utilisation.

Additionally, chronic inflammation can suppress erythropoiesis, contributing to anaemia of inflammation.

### **C. Weight loss and anorexia**

Persistent infection causes:

- Increased metabolic demand.
- Cytokine-mediated appetite suppression.
- Increased protein breakdown.

Consequently, patients may experience progressive weight loss over weeks or months.

### **D. Night sweats**

Night sweats result from systemic inflammatory activity and changes in body temperature during fever cycles.

They are particularly noticeable in subacute IE but are not specific to it.

### **E. Arthralgia and myalgia**

Patients may complain of joint and muscle pain.

These symptoms result from systemic inflammation and immune activation.

## **2. Cardiac manifestations**

These are particularly important because IE directly damages cardiac structures.

### **A. Heart murmur**

A heart murmur is produced by turbulent blood flow.

In IE, infection damages the valve leaflets, preventing them from closing properly.

This produces regurgitation.

Examples:

- Mitral valve destruction → mitral regurgitation → pansystolic murmur at the apex, often radiating to the axilla.
- Aortic valve destruction → aortic regurgitation → early diastolic decrescendo murmur along the left sternal border.

**Important clinical point:** A new regurgitant murmur in a patient with fever should make you strongly suspect IE.

However, a murmur may be absent, especially early in the disease.

### **B. Heart failure**

Heart failure is one of the most serious complications of IE.

The principal mechanism is acute valve dysfunction.

For example, severe mitral regurgitation causes blood to flow backwards into the left atrium during systole.

This increases left atrial pressure, which is transmitted backwards into the pulmonary veins.

Eventually, pulmonary capillary hydrostatic pressure rises, causing fluid to enter the pulmonary interstitium and alveoli.

The patient develops pulmonary oedema.

**Clinical manifestations:**

- Dyspnoea.
- Orthopnoea.
- Paroxysmal nocturnal dyspnoea.
- Bilateral basal crackles.
- Tachycardia.
- Raised JVP and peripheral oedema if right-sided congestion develops.

Acute severe aortic or mitral regurgitation can produce rapidly progressive heart failure.

### **C. Perivalvular abscess**

The infection may extend beyond the valve into the surrounding cardiac tissue.

This produces an abscess.

Why is it dangerous?

The abscess can extend into the conduction system, particularly around the aortic valve near the atrioventricular node and bundle of His.

This can produce:

- PR prolongation.
- AV block.
- New conduction abnormalities.

**Clinical pearl:** New AV block in a patient with aortic valve endocarditis should raise suspicion of a perivalvular abscess.

This requires urgent specialist assessment.

## **3. Peripheral manifestations**

These are the classic physical examination findings of infective endocarditis.

They are important because they provide clues to the diagnosis, although many are absent in modern presentations.

### **A. Petechiae**

Petechiae are small, non-blanching red or purple spots caused by tiny areas of bleeding under the skin.

Why do they occur?

IE can produce:

- Small-vessel inflammation.
- Immune-mediated vascular injury.
- Microembolic damage.
- Thrombocytopenia in some patients.

These mechanisms allow red blood cells to escape into the surrounding tissues.

Common locations include:

- Conjunctivae.
- Oral mucosa.
- Skin of the extremities.

Remember: petechiae are not specific to IE. They can also occur in thrombocytopenia, vasculitis and other infections.

### **B. Splinter haemorrhages**

These are thin, reddish-brown or dark linear haemorrhages beneath the fingernails or toenails.

They resemble small wooden splinters trapped beneath the nail.

Why do they occur?

Small-vessel injury allows blood to leak into the nail bed.

They may result from microembolic or inflammatory vascular injury.

**Important:** Splinter haemorrhages are not specific to IE. They can also occur following trauma and in other systemic conditions.

### **C. Osler nodes**

Osler nodes are small, painful, tender, raised lesions typically found on:

- Finger pads.
- Toe pads.

Why are they painful?

They are classically associated with immune-complex-mediated inflammation of small blood vessels.

Antigen-antibody complexes deposit in the vessels, activate complement and cause local inflammation.

This produces painful nodules.

**Remember: Osler nodes are painful.**

### **D. Janeway lesions**

Janeway lesions are small, flat, painless, erythematous or haemorrhagic lesions found on:

- Palms.
- Soles.

Why do they occur?

They are associated with septic microemboli and local microabscess formation in the skin.

Bacterial emboli obstruct small vessels and produce local tissue injury.

**Remember: Janeway lesions are painless.**

**Osler nodes versus Janeway lesions**

| Feature | Osler nodes | Janeway lesions |
| --- | --- | --- |
| Pain | Painful | Painless |
| Appearance | Raised nodules | Flat lesions |
| Location | Finger/toe pads | Palms and soles |
| Classical mechanism | Immune-complex vasculitis | Septic microemboli |

### **E. Roth spots**

Roth spots are retinal haemorrhages with pale or white centres.

Why do they occur?

They are associated with retinal capillary injury and haemorrhage.

The pale centre represents fibrin, platelets and inflammatory cellular material.

They can occur in IE but are not specific. They are also seen in leukaemia, severe anaemia and other systemic diseases.

### **F. Conjunctival haemorrhages**

These are small haemorrhagic lesions visible on the conjunctiva.

They result from small-vessel injury and bleeding.

During examination, gently inspect the lower conjunctival surface by asking the patient to look upwards and pulling down the lower eyelid.

## **4. Embolic manifestations**

This is another major mechanism of disease.

Vegetations contain bacteria, fibrin and platelets. Because they are fragile, fragments may detach and enter the circulation.

The destination depends on which side of the heart is infected.

### **A. Cerebral embolism: stroke**

A fragment from a left-sided vegetation can travel through the aorta into the cerebral circulation.

If it obstructs a cerebral artery, it causes an ischaemic stroke.

Clinical presentation:

- Sudden weakness of one side of the body.
- Facial drooping.
- Speech disturbance.
- Visual disturbances.
- Altered consciousness.

**Important:** Septic emboli can also cause:

- Cerebral abscesses.
- Infectious intracranial aneurysms (mycotic aneurysms).
- Intracranial haemorrhage.

A patient with IE who develops a sudden severe headache or focal neurological deficit needs urgent brain imaging and specialist assessment.

### **B. Splenic infarction**

The spleen receives blood through the splenic artery, which arises from the coeliac trunk.

A septic embolus from left-sided IE can obstruct the splenic artery or one of its branches.

This causes splenic ischaemia and infarction.

Clinical presentation:

- Sudden left upper quadrant abdominal pain.
- Left upper quadrant tenderness.
- Sometimes referred pain to the left shoulder.

If the infarct becomes infected, a splenic abscess may develop.

### **C. Renal infarction**

A septic embolus may obstruct a renal artery or its branches.

This causes renal tissue ischaemia.

Clinical presentation:

- Sudden flank pain.
- Haematuria.
- Sometimes acute deterioration in renal function.

There is another important renal complication that we must distinguish.

### **D. Glomerulonephritis**

Why does IE cause glomerulonephritis?

During persistent infection, bacterial antigens combine with antibodies to form immune complexes.

These complexes can deposit in the glomeruli, activating complement and causing inflammation.

This damages the glomerular filtration barrier.

Consequently:

- Red blood cells enter the urine → haematuria.
- Protein enters the urine → proteinuria.
- Glomerular filtration decreases → rising creatinine.
- Salt and water retention may produce oedema and hypertension.

**Typical investigations:**

- Urinalysis: blood and protein.
- Urine microscopy: dysmorphic red blood cells and sometimes red-cell casts.
- Serum creatinine: may be elevated.
- Complement: may be reduced, particularly C3.

This is an important distinction:

| Renal complication | Mechanism |
| --- | --- |
| Renal infarction | Septic embolic obstruction |
| Glomerulonephritis | Immune-complex-mediated inflammation |

### **E. Limb ischaemia**

A vegetation may travel through systemic circulation and obstruct an artery supplying a limb.

The patient may present with the classic six Ps of acute limb ischaemia:

1. Pain.
2. Pallor.
3. Pulselessness.
4. Paraesthesia.
5. Paralysis.
6. Poikilothermia (cold limb).

This is a vascular emergency.

## **5. Right-sided infective endocarditis: pulmonary manifestations**

This deserves separate attention.

The tricuspid valve is the most commonly affected valve in right-sided IE.

When a fragment breaks off the tricuspid vegetation, it travels through:

Right atrium → right ventricle → pulmonary artery → pulmonary circulation.

It may obstruct pulmonary arterial branches and introduce bacteria into the lung.

This produces **septic pulmonary emboli**.

### **Clinical presentation**

- Fever.
- Pleuritic chest pain.
- Cough.
- Haemoptysis.
- Dyspnoea.
- Sometimes hypoxaemia.

### **Why does haemoptysis occur?**

The septic embolus obstructs a pulmonary vessel and causes local inflammation and tissue injury.

If pulmonary infarction or cavitation develops, damaged blood vessels may bleed into the airways.

### **What can imaging show?**

- Multiple peripheral pulmonary nodules.
- Cavitating pulmonary lesions.
- Pulmonary infiltrates.
- Sometimes pleural effusions.

**Clinical pearl:** A patient with injection drug use, fever, a tricuspid murmur and multiple cavitating pulmonary nodules should make you strongly suspect right-sided IE.

## **6. Splenomegaly**

Splenomegaly may occur, particularly in subacute IE.

Why?

The spleen participates in immune responses and removes microorganisms and immune complexes from the circulation.

Persistent infection leads to prolonged immune activation and increased activity of the reticuloendothelial system.

This can cause enlargement of the spleen.

Additionally, repeated embolisation and splenic infarction may contribute.

Clinical examination may reveal a palpable spleen below the left costal margin.

## **7. Musculoskeletal manifestations**

IE can also produce musculoskeletal symptoms.

### **A. Arthralgia**

Joint pain without necessarily having visible joint inflammation.

This is associated with systemic inflammation and immune activation.

### **B. Septic arthritis**

Bacteria may spread through the bloodstream and infect a joint.

The patient develops:

- Severe joint pain.
- Swelling.
- Warmth.
- Restricted movement.
- Sometimes fever.

This requires urgent joint aspiration and appropriate antimicrobial treatment.

### **C. Vertebral osteomyelitis and spondylodiscitis**

Bacteria circulating in the bloodstream may seed the vertebral endplates or intervertebral disc.

The patient may present with persistent back pain, fever or spinal tenderness.

This is particularly important when a patient with IE complains of unexplained persistent back pain.

## **8. Putting the clinical presentation together**

Here is how I want you to approach a patient suspected of having IE.

| Clinical finding | Possible explanation |
| --- | --- |
| Fever and rigors | Systemic infection |
| Weight loss and night sweats | Persistent inflammatory response |
| New regurgitant murmur | Valve destruction |
| Dyspnoea and crackles | Heart failure from valve dysfunction |
| Osler nodes | Immune-complex-mediated inflammation |
| Janeway lesions | Septic microemboli |
| Splinter haemorrhages | Nail-bed microvascular injury |
| Roth spots | Retinal vascular injury and haemorrhage |
| Focal neurological deficit | Cerebral embolism |
| Left upper abdominal pain | Splenic infarction |
| Flank pain and haematuria | Renal infarction or glomerulonephritis |
| Pleuritic chest pain and haemoptysis | Septic pulmonary embolism |
| New AV block | Possible perivalvular abscess |

**One important examination point:** You do not need to find all these manifestations to diagnose IE. Many patients have none of the classical peripheral signs. Their absence does not exclude the disease.

## **9. How to examine a patient suspected of IE**

When you are on the ward or in the emergency department, use a systematic examination.

**General examination**

- Temperature: fever.
- Pallor: possible anaemia.
- Cachexia: prolonged infection.
- Skin: petechiae, Janeway lesions and Osler nodes.
- Nails: splinter haemorrhages.
- Eyes: conjunctival haemorrhages and Roth spots.

**Cardiovascular examination**

- Inspect for signs of heart failure.
- Palpate peripheral pulses.
- Assess JVP.
- Auscultate all four valve areas.
- Identify new murmurs.
- Look for peripheral oedema.

**Respiratory examination**

- Crackles suggesting pulmonary oedema.
- Signs of pulmonary infection or septic emboli.
- Reduced breath sounds if pleural effusion is present.

**Abdominal examination**

- Splenomegaly.
- Hepatomegaly.
- Left upper quadrant tenderness.
- Renal angle tenderness.

**Neurological examination**

- Assess GCS.
- Examine cranial nerves.
- Assess limb power and sensation.
- Look for focal neurological deficits.

On examination:

- SpO₂: 91%.
- A systolic murmur is heard at the lower left sternal border.

- Mitral
- Aortic

- Systemic embolisation to the brain

- Splenic infarction
- Immune-complex glomerulonephritis
